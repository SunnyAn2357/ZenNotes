<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zen Notes - ADS</title>

    <link rel="icon" href="">

    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

    <script>

        const CLIENT_ID = '765080058790-uhqk1gj2ko8a197f26ujnq0gb4nl97ha.apps.googleusercontent.com';
        const API_KEY = 'AIzaSyD1Z5E5e8tRfmG9fDruBM72pliOt6ZkShw';

        const DISCOVERY_DOC = "https://www.googleapis.com/discovery/v1/apis/drive/v3/rest";
        const SCOPES = "https://www.googleapis.com/auth/drive.file";

        let tokenClient, gapiInited = false, gisInited = false;
        let hasLoadedFromCloud = false; 
        let backupFolderId = null; 

        function gapiLoaded() {
            gapi.load('client', async () => {
                try {
                    await gapi.client.init({ apiKey: API_KEY, discoveryDocs: [DISCOVERY_DOC] });
                    gapiInited = true;
                    console.log("구글 API 준비 완료!");
                } catch (e) {
                    console.error("GAPI 초기화 실패:", e);
                }
            });
        }

        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: ''
            });
            gisInited = true;
            console.log("구글 인증 준비 완료!");
        }
    </script>

    <script src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root {
            --bg: #131314;
            --surface: #1e1e20;
            --surface-hover: #262629;
            --border: #2a2a2c;
            --text-main: #e3e3e3;
            --text-muted: #c4c7c5;
            --accent: #78a9ff;
            --danger: #ff6b6b;
            --font-family: 'Pretendard', -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-family);
            display: flex;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
        }
        
        input::placeholder { color: var(--text-muted); }
        
        button {
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        button:hover { color: var(--text-main); }

        @keyframes icon-blink {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.15); color: #fff; }
            100% { opacity: 1; transform: scale(1); }
        }
        .blink-active { animation: icon-blink 0.4s ease-in-out 3; color: var(--accent) !important; }

        @keyframes status-pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pulse-fast { animation: status-pulse 1s infinite ease-in-out; }
        .pulse-slow { animation: status-pulse 2s infinite ease-in-out; }

        .col-left {
            width: 285px;
            min-width: 285px;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            transition: width 0.25s ease-in-out, min-width 0.25s ease-in-out, transform 0.25s ease-in-out;
        }

        .nav-header {
            padding: 24px 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .toggle-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            cursor: pointer;
        }
        .toggle-btn:hover { background: var(--surface-hover); color: var(--text-main); }

        .col-left.collapsed { width: 60px; min-width: 60px; }
        .col-left.collapsed .nav-header { padding: 24px 0 16px 0; align-items: center; }
        .col-left.collapsed .search-bar,
        .col-left.collapsed .memo-list,
        .col-left.collapsed .btn-text { display: none !important; }
        .col-left.collapsed .new-note-btn {
            justify-content: center;
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 50%;
            margin: 0 auto;
        }

        .search-bar {
            background: var(--bg);
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border);
        }
        .search-bar input { width: 100%; }

        .memo-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            padding: 0 10px 20px;
        }

        .memo-item {
            padding: 12px 14px;
            margin-bottom: 4px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.1s;
            border-left: 3px solid transparent;
            color: var(--text-main);
        }
        .memo-item:hover { background: var(--surface-hover); }
        .memo-item.active {
            background: var(--surface-hover);
            border-left: 3px solid var(--accent);
            border-radius: 4px 8px 8px 4px;
        }

        .memo-info { overflow: hidden; display: flex; flex-direction: column; gap: 4px; }
        .memo-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; font-weight: 400; }
        .memo-date { font-size: 11px; color: var(--text-muted); opacity: 0.7; }
        .memo-actions { display: flex; align-items: center; gap: 4px; }

        .btn-delete { opacity: 0; color: #fda4af; padding: 4px; font-size: 12px; transition: all 0.2s; cursor: pointer; }
        .btn-delete:hover { color: #f43f5e; opacity: 1 !important; }
        .btn-pin { opacity: 0; color: #94a3b8; padding: 4px; font-size: 12px; transition: all 0.2s; transform: rotate(-45deg); cursor: pointer; }
        .btn-pin:hover { color: #60a5fa; opacity: 1 !important; }
        .btn-pin.is-pinned { transform: rotate(0deg); color: #3b82f6; opacity: 1 !important; }
        .memo-item:hover .btn-delete, .memo-item:hover .btn-pin { opacity: 0.6; }

        .btn-restore { opacity: 0; color: #94a3b8; padding: 4px; font-size: 12px; transition: all 0.2s; cursor: pointer; }
        .btn-restore:hover { color: #60a5fa; opacity: 1 !important; }
        .btn-hard-delete { opacity: 0; color: #fda4af; padding: 4px; font-size: 12px; transition: all 0.2s; cursor: pointer; }
        .btn-hard-delete:hover { color: #f43f5e; opacity: 1 !important; }
        .memo-item:hover .btn-restore, .memo-item:hover .btn-hard-delete { opacity: 0.6; }

        .col-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--bg);
            min-height: 0;
        }

        .editor-header {
            padding: 30px 24px 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-shrink: 0;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        #memo-title-input {
            font-size: 28px;
            font-weight: 700;
            width: 60%;
            letter-spacing: -0.5px;
        }

        .status-container {
            position: fixed;
            top: 34px;
            right: 70px;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 상태 점(Dot) 크기 축소 (6px -> 4px) */
        .status-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.5s ease;
            opacity: 0;
        }
        .status-dot.saved { background-color: var(--accent); box-shadow: 0 0 6px rgba(120, 169, 255, 0.4); opacity: 1; }
        .status-dot.unsaved { background-color: var(--danger); box-shadow: 0 0 6px rgba(255, 107, 107, 0.4); opacity: 1; }
        .status-dot.logged-out { background-color: var(--text-muted); box-shadow: none; opacity: 1; }

        .status-text {
            font-size: 9px;
            color: var(--text-muted);
            transition: opacity 0.5s ease-in-out, color 0.5s ease;
            opacity: 0;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .print-hr { display: none; }

        .quill-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0;
            min-height: 0;
        }

        /* 툴바 고정 간격 및 좌측 정렬 */
        .ql-toolbar.ql-snow {
            border: none !important;
            padding: 12px 24px !important;
            margin: 0 auto !important;
            border-bottom: 1px solid var(--border) !important;
            flex-shrink: 0;
            max-width: 800px;
            width: 100%;
            display: flex !important;
            flex-wrap: wrap !important;
            justify-content: flex-start !important;
            gap: 0px !important; /* 툴 간격 고정 */
        }
        
        .ql-toolbar.ql-snow .ql-formats {
            display: flex !important;
            margin: 0 !important; /* 기존 그룹 우측 15px 여백 제거 */
            gap: 0px !important; /* 그룹 내 툴 간격 고정 */
        }
        
        .ql-toolbar.ql-snow .ql-formats button,
        .ql-toolbar.ql-snow .ql-formats .ql-picker {
            margin: 0 !important; /* 툴별 기본 여백 완전 제거 */
        }

        .ql-container.ql-snow {
            border: none !important;
            font-size: 16px;
            font-family: var(--font-family);
            flex: 1;
            min-height: 0;
            overflow-y: auto !important;
        }

        .col-center::-webkit-scrollbar,
        .quill-wrapper::-webkit-scrollbar,
        .ql-container.ql-snow::-webkit-scrollbar,
        .ql-editor::-webkit-scrollbar {
            display: none;
        }

        .col-center,
        .quill-wrapper,
        .ql-container.ql-snow,
        .ql-editor {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .ql-snow .ql-stroke { stroke: var(--text-muted) !important; }
        .ql-snow .ql-fill { fill: var(--text-muted) !important; }
        .ql-snow .ql-picker { color: var(--text-muted) !important; }

        .ql-snow .ql-picker-options {
            background-color: var(--surface) !important;
            border: 1px solid var(--border) !important;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6) !important;
            border-radius: 8px !important;
            padding: 8px 0 !important;
            z-index: 10000 !important;
        }

        .ql-snow .ql-picker-item {
            color: var(--text-main) !important;
            padding: 6px 12px !important;
            transition: color 0.2s, background-color 0.2s !important;
        }
        .ql-snow .ql-picker-item:hover,
        .ql-snow .ql-picker-item.ql-selected {
            color: var(--accent) !important;
            background-color: var(--surface-hover) !important;
        }

        .ql-snow .ql-picker-label { color: var(--text-muted) !important; }
        .ql-snow .ql-picker-label:hover { color: var(--accent) !important; }
        .ql-snow .ql-picker-label::before { color: inherit !important; }

        .ql-snow .ql-tooltip {
            background-color: var(--surface) !important;
            border: 1px solid var(--border) !important;
            color: var(--text-main) !important;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6) !important;
            border-radius: 12px !important;
            padding: 12px 16px !important;
            z-index: 10000 !important;
        }

        .ql-snow .ql-tooltip.ql-hidden { display: none !important; }

        .ql-snow .ql-tooltip input[type=text] {
            background-color: var(--bg) !important;
            color: var(--text-main) !important;
            border: 1px solid var(--border) !important;
            border-radius: 6px !important;
            padding: 6px 10px !important;
            font-family: inherit !important;
            height: auto !important;
            margin: 0 8px !important;
        }
        .ql-snow .ql-tooltip input[type=text]:focus { border-color: var(--accent) !important; }
        .ql-snow .ql-tooltip::before { color: var(--text-muted) !important; }
        
        .ql-snow .ql-tooltip a.ql-action::before {
            background-color: var(--accent) !important;
            color: #fff !important;
            padding: 6px 12px !important;
            border-radius: 6px !important;
            font-weight: 500 !important;
            transition: opacity 0.2s !important;
        }
        .ql-snow .ql-tooltip a.ql-action:hover::before { opacity: 0.8 !important; }
        .ql-snow .ql-tooltip a.ql-remove::before {
            color: var(--danger) !important;
            font-weight: 500 !important;
            margin-left: 8px !important;
        }

        .ql-editor {
            padding: 24px 24px;
            line-height: 1.8 !important;
            color: var(--text-main);
            letter-spacing: -0.01em;
            font-weight: 400;
            font-size: 16px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            position: relative;
        }

        .ql-editor hr {
            border: none;
            border-bottom: 1px solid var(--border);
            margin: 20px 0;
            opacity: 0.7;
        }
        .ql-editor.ql-blank::before {
            color: #404040 !important;
            font-weight: 400 !important;
            position: absolute !important;
            left: 24px !important;
            top: 24px !important;
            pointer-events: none !important;
            opacity: 0.9;
        }

        .col-right {
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            height: 100svh;
            z-index: 1001;
            border-left: none;
            width: 285px;
            min-width: 285px;
            background: var(--surface);
            padding: 24px 20px calc(30px + env(safe-area-inset-bottom)) 20px;
            display: flex;
            flex-direction: column;
            gap: 36px;
            overflow-y: auto;
            transition: transform 0.25s ease-in-out;
        }
        .col-right.is-closed { transform: translateX(100%); }

        .trash-pane {
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            height: 100dvh;
            z-index: 1003;
            border-left: none;
            width: 285px;
            min-width: 285px;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease-in-out;
            transform: translateX(100%);
            box-shadow: -4px 0 24px rgba(0,0,0,0.4);
        }
        .trash-pane.is-open { transform: translateX(0); }

        .util-section { display: flex; flex-direction: column; gap: 12px; }
        .util-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 4px;
        }
        .util-btn {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }
        .util-btn:hover { background: var(--surface-hover); }
        .mt-auto { margin-top: auto; }

        @media print {
            body { background: white !important; color: black !important; display: block; }
            .col-left, .col-right, .trash-pane, .editor-actions, .ql-toolbar.ql-snow { display: none !important; }
            .col-center { width: 100%; background: white !important; }
            #memo-title-input { color: black !important; font-size: 32px !important; width: 100%; }
            hr.print-hr { display: block !important; border-bottom: 1px solid #d4d4d4; margin: 0 16px 16px; }
            .ql-editor { color: black !important; }
        }

        .ql-editor * { background-color: transparent !important; }
        .ql-editor pre.ql-syntax {
            background-color: #1E222A !important;
            border: 1px solid var(--border) !important;
            border-radius: 8px !important;
            padding: 1.25rem !important;
            color: #abb2bf !important;
            font-family: 'D2Coding', 'Consolas', monospace !important;
            font-size: 14px !important;
            line-height: 1.6 !important;
            margin: 1rem 0 !important;
            overflow-x: auto;
        }
        .ql-editor code {
            background-color: rgba(120, 169, 255, 0.1) !important;
            color: var(--accent) !important;
            padding: 3px 6px !important;
            border-radius: 4px !important;
            font-size: 0.9em !important;
            font-family: inherit;
        }
        
        .ql-editor pre.ql-syntax span { background-color: transparent !important; }
        .ql-editor pre.ql-syntax span.hljs-keyword,
        .ql-editor pre.ql-syntax span.hljs-selector-tag { color: #c678dd !important; font-weight: 500; }
        .ql-editor pre.ql-syntax span.hljs-function,
        .ql-editor pre.ql-syntax span.hljs-title { color: #61afef !important; }
        .ql-editor pre.ql-syntax span.hljs-string { color: #98c379 !important; }
        .ql-editor pre.ql-syntax span.hljs-comment { color: #5c6370 !important; font-style: italic; }
        .ql-editor pre.ql-syntax span.hljs-params,
        .ql-editor pre.ql-syntax span.hljs-attribute { color: #d19a66 !important; }
        .ql-editor pre.ql-syntax span.hljs-number,
        .ql-editor pre.ql-syntax span.hljs-literal { color: #d19a66 !important; }
        .ql-editor pre.ql-syntax span.hljs-built_in,
        .ql-editor pre.ql-syntax span.hljs-name { color: #56b6c2 !important; }
        
        .ql-editor ol, .ql-editor ul { padding-left: 1.5em !important; }
        .ql-editor li:not(.ql-direction-rtl)::before {
            margin-left: -1.5em !important;
            margin-right: 0.5em !important;
            text-align: right !important;
            display: inline-block !important;
            width: 1em !important;
        }
        .ql-editor .ql-indent-1:not(.ql-direction-rtl) { padding-left: 3em !important; }
        .ql-editor .ql-indent-2:not(.ql-direction-rtl) { padding-left: 4.5em !important; }
        .ql-editor .ql-indent-3:not(.ql-direction-rtl) { padding-left: 6em !important; }

        .mobile-only { display: none !important; }
        
        .mobile-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
            z-index: 1001;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        @media screen and (max-width: 768px) {
            .mobile-only { display: flex !important; }
            .mobile-overlay { display: block; }
            .mobile-overlay.is-active { opacity: 1; pointer-events: auto; }
            .col-center { width: 100vw; min-width: 100vw; }
            
            .editor-header {
                padding: 70px 20px 10px !important;
                flex-direction: column;
                align-items: flex-start !important;
                gap: 16px;
            }
            
            #memo-title-input { width: 100% !important; font-size: 24px !important; }
            .status-container { position: fixed; top: 34px; right: 70px; z-index: 999; }
            
            /* 모바일에서도 고정 간격 유지되도록 설정 */
            .ql-toolbar.ql-snow {
                padding: 12px 20px !important;
                gap: 0px !important; /* 모바일은 간격 6px로 살짝 줄임 */
            }
            .ql-toolbar.ql-snow .ql-formats {
                gap: 0px !important;
            }
            .ql-snow .ql-tooltip { left: 20px !important; transform: none !important; }
            
            .ql-editor { padding: 16px 20px !important; font-size: 15px; }
            .ql-editor.ql-blank::before { left: 20px !important; }
            
            .col-left {
                position: fixed !important;
                top: 0; left: 0;
                height: 100vh;
                height: 100svh;
                width: 285px !important;
                min-width: 285px !important;
                z-index: 1002;
                transform: translateX(-100%);
                transition: transform 0.25s ease-in-out;
                box-shadow: 2px 0 12px rgba(0,0,0,0.5);
            }
            .col-left.is-mobile-open { transform: translateX(0) !important; }
            .col-left .nav-header > button.toggle-btn { display: none; }
            
            .col-right, .trash-pane {
                height: 100vh;
                height: 100svh;
                width: 285px !important;
                min-width: 285px !important;
                z-index: 1002;
                box-shadow: -2px 0 12px rgba(0,0,0,0.5);
            }
            #global-menu-btn { z-index: 1000 !important; }

            .trash-pane .nav-header .trash-hamburger { display: none; }
        }
    </style>
</head>
<body>

    <button id="mobile-left-menu-btn" class="toggle-btn mobile-only" style="position: fixed; top: 24px; left: 10px; z-index: 1000;" onclick="toggleLeftPaneMobile()">
        <i class="fa-solid fa-bars"></i>
    </button>
    
    <div id="mobile-overlay" class="mobile-overlay" onclick="closeAllPanelsMobile()"></div>

    <button id="global-menu-btn" class="toggle-btn" style="position: fixed; top: 24px; right: 20px; z-index: 1000;" onclick="toggleRightPane()">
        <i class="fa-solid fa-ellipsis-vertical"></i>
    </button>

    <div class="col-left" id="col-left">
        <div class="nav-header">
            <button class="toggle-btn" onclick="document.getElementById('col-left').classList.toggle('collapsed')">
                <i class="fa-solid fa-bars"></i>
            </button>
            <button class="new-note-btn" onclick="createNewMemo()" style="color: var(--text-main); font-weight: 600;">
                <i class="fa-solid fa-pen-to-square"></i> <span class="btn-text">새 노트 작성</span>
            </button>
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass" style="font-size: 12px;"></i>
                <input type="text" id="list-search-input" placeholder="노트 검색..." oninput="loadMemoList()">
            </div>
        </div>
        <ul id="memo-list" class="memo-list"></ul>
    </div>

    <div class="col-center">
        <div class="editor-header">
            <input type="text" id="memo-title-input" placeholder="제목 없는 노트">
            <div class="editor-actions">
                <div class="status-container">
                    <span id="status-text" class="status-text">disconnected</span>
                    <div id="status-dot" class="status-dot logged-out"></div>
                </div>
            </div>
        </div>
        <hr class="print-hr">
        <div class="quill-wrapper">
            <div id="editor"></div>
        </div>
    </div>

    <div class="col-right is-closed" id="col-right">
        <div style="margin-bottom: -16px; display: flex; justify-content: space-between; align-items: center;">
            <button class="toggle-btn" onclick="toggleRightPane()">
                <i class="fa-solid fa-bars"></i>
            </button>

                <i class="fa-brands fa-google"></i>
            </button>
        </div>

        <div class="util-section">
            <div class="util-title">Export & Print</div>
            <button class="util-btn" id="btn-read-memo">
                <i class="fa-solid fa-volume-high"></i> <span class="btn-text">음성으로 읽기</span>
            </button>
            <button class="util-btn" onclick="exportHTML(); closeAllPanelsMobile();">

            </button>
            <button class="util-btn" onclick="exportPDF(); closeAllPanelsMobile();">
                <i class="fa-regular fa-file-pdf"></i> <span class="btn-text">PDF 저장</span>
            </button>
            <button class="util-btn" onclick="exportTXT(); closeAllPanelsMobile();">
                <i class="fa-regular fa-file-lines"></i> <span class="btn-text">TXT 저장</span>
            </button>
            <button class="util-btn" onclick="exportJSON(); closeAllPanelsMobile();">
                <i class="fa-solid fa-code"></i> <span class="btn-text">JSON 저장</span>
            </button>
            <button class="util-btn" onclick="window.print(); closeAllPanelsMobile();">
                <i class="fa-solid fa-print"></i> <span class="btn-text">인쇄하기</span>
            </button>

        <div class="util-section mt-auto">
            <div class="util-title">Data Management</div>
            <button class="util-btn" onclick="document.getElementById('import-file').click(); closeAllPanelsMobile();">
                <i class="fa-solid fa-file-import"></i> <span class="btn-text">파일 불러오기</span>
            </button>
            <div style="display: flex; gap: 8px;">
                <button class="util-btn" style="flex: 1;" onclick="backupAllData(); closeAllPanelsMobile();">
                    <i class="fa-solid fa-database"></i> <span class="btn-text">전체 백업</span>
                </button>
                <button class="util-btn" style="flex: 1; justify-content: center;" onclick="toggleTrashPane();">
                    <i class="fa-solid fa-trash"></i> <span class="btn-text">휴지통</span>

    <div class="trash-pane" id="trash-pane">
        <div class="nav-header">
            <button class="toggle-btn trash-hamburger" onclick="closeAllRightPanels()">
                <i class="fa-solid fa-bars"></i>
            </button>
            <button class="new-note-btn" onclick="emptyTrash()" style="color: var(--text-main); font-weight: 600;">
                <i class="fa-solid fa-trash-can"></i> <span class="btn-text">비우기(30일이후 영구삭제)</span>
            </button>
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass" style="font-size: 12px;"></i>
                <input type="text" id="trash-search-input" placeholder="휴지통 검색..." oninput="loadTrashList()">
            </div>
        </div>
        <ul id="trash-list" class="memo-list"></ul>
    </div>

    <script>
        function generateSyncId() {
            return Date.now().toString(36) + Math.random().toString(36).substring(2);
        }

        let tokenRefreshTimer = null;
        let db, currentMemoId = null, saveTimer = null;
        let selectedMemos = new Set(), displayedMemos = [], lastSelectedId = null;
        let selectedTrashMemos = new Set(), displayedTrashMemos = [], lastSelectedTrashId = null;

        // [핵심] Zen 스타일 상태 점(Dot) UI 큐 관리 (최소 2초 유지)
        let uiStatusQueue = [];
        let isStatusAnimating = false;

        function setStatusUI(state) {
            if (uiStatusQueue.length > 0 && uiStatusQueue[uiStatusQueue.length - 1] === state) return;
            uiStatusQueue.push(state);
            processUIStatus();
        }

        function processUIStatus() {
            if (isStatusAnimating || uiStatusQueue.length === 0) return;
            isStatusAnimating = true;

            const state = uiStatusQueue.shift();
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');

            txt.style.opacity = '1';

            if (state === 'saving') {
                dot.className = 'status-dot unsaved pulse-fast'; // Red
                txt.innerText = 'saving...';
            } else if (state === 'loading') {
                dot.className = 'status-dot logged-out pulse-fast'; // Gray Pulse
                txt.innerText = 'loading...';
            } else if (state === 'saved') {
                dot.className = 'status-dot saved pulse-slow'; // Blue
                txt.innerText = 'saved';
            } else if (state === 'disconnected') {
                dot.className = 'status-dot logged-out'; // Gray
                txt.innerText = 'disconnected';
            }

            // 0.1초만에 끝나는 작업도 무조건 최소 2초간 사용자에게 보여줍니다.
            setTimeout(() => {
                isStatusAnimating = false;
                
                if (uiStatusQueue.length > 0) {
                    processUIStatus(); 
                } else {
                    // 작업 큐가 비었다면, 최종 상태에 따라 텍스트만 조용히 숨깁니다.
                    if (state === 'saved') {
                        txt.style.opacity = '0';
                        dot.classList.remove('pulse-slow');
                    } else if (state === 'disconnected') {
                        txt.style.opacity = '0';
                    }
                    // saving, loading은 다음 상태가 올 때까지 무한정 유지됩니다.
                }
            }, 2000);
        }

        function silentTokenRefresh() {
            if (localStorage.getItem('zen_logged_in') === 'true' && tokenClient) {
                tokenClient.requestAccessToken({ prompt: '' });
            }
        }

        function toggleRightPane() {
            const rp = document.getElementById('col-right');
            const gb = document.getElementById('global-menu-btn');
            document.getElementById('trash-pane').classList.remove('is-open');

            if (rp.classList.contains('is-closed')) {
                rp.classList.remove('is-closed');
                gb.style.display = 'none';
            } else {
                rp.classList.add('is-closed');
                gb.style.display = 'flex';
            }
        }

        function toggleTrashPane() {
            const tp = document.getElementById('trash-pane');
            if (tp.classList.contains('is-open')) {
                tp.classList.remove('is-open');
            } else {
                tp.classList.add('is-open');
                loadTrashList(); 
            }
        }

        function closeAllRightPanels() {
            document.getElementById('trash-pane').classList.remove('is-open');
            document.getElementById('col-right').classList.add('is-closed');
            document.getElementById('global-menu-btn').style.display = 'flex';
            if (window.innerWidth <= 768) {
                document.getElementById('mobile-overlay').classList.remove('is-active');
            }
        }

        document.addEventListener('click', e => {
            const rp = document.getElementById('col-right');
            const tp = document.getElementById('trash-pane');
            const gb = document.getElementById('global-menu-btn');
            
            if (!rp.classList.contains('is-closed') && !rp.contains(e.target) && !tp.contains(e.target) && !gb.contains(e.target)) {
                rp.classList.add('is-closed');
                gb.style.display = 'flex';
            }
            if (tp.classList.contains('is-open') && !tp.contains(e.target) && !rp.contains(e.target) && !gb.contains(e.target)) {
                tp.classList.remove('is-open');
            }
        });

        hljs.configure({ languages:['javascript', 'python', 'html', 'css', 'typescript', 'bash'] });

        const Link = Quill.import('formats/link');
        class CustomLink extends Link {
            static create(v) {
                return super.create(v && !/^https?:\/\//i.test(v) && !/^mailto:/i.test(v) ? 'http://' + v : v);
            }
        }
        Quill.register(CustomLink, true);

        const BlockEmbed = Quill.import('blots/block/embed');
        class DividerBlot extends BlockEmbed { }
        DividerBlot.blotName = 'divider';
        DividerBlot.tagName = 'hr';
        Quill.register(DividerBlot);

        const quill = new Quill('#editor', {
            theme: 'snow',
            bounds: '.col-center',
            placeholder: '여기에 지식을 기록하세요...',
            modules: {
                syntax: true,
                toolbar: {
                    container: [
                        [{ 'header':[1, 2, 3, false] }],
                        ['bold', 'italic', 'underline', 'strike'],
                        ['blockquote', 'code-block', 'link', 'image', 'divider'],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                        ['clean']
                    ],
                    handlers: {
                        'divider': function() {
                            const r = this.quill.getSelection(true);
                            this.quill.insertText(r.index, '\n', Quill.sources.USER);
                            this.quill.insertEmbed(r.index + 1, 'divider', true, Quill.sources.USER);
                            this.quill.setSelection(r.index + 2, Quill.sources.SILENT);
                        }
                    }
                }
            }
        });

        quill.root.addEventListener('paste', (e) => {
            const clipboardData = e.clipboardData || window.clipboardData;
            if (!clipboardData || !clipboardData.items) return;
            
            for (let i = 0; i < clipboardData.items.length; i++) {
                const item = clipboardData.items[i];
                if (item.type.indexOf('image') === 0) {
                    e.preventDefault(); 
                    const file = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const range = quill.getSelection(true) || { index: quill.getLength() };
                        quill.insertEmbed(range.index, 'image', ev.target.result, Quill.sources.USER);
                        quill.setSelection(range.index + 1, Quill.sources.SILENT);
                    };
                    reader.readAsDataURL(file);
                }
            }
        });

        quill.root.addEventListener('drop', (e) => {
            if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
                for (let i = 0; i < e.dataTransfer.files.length; i++) {
                    const file = e.dataTransfer.files[i];
                    if (file.type.indexOf('image') === 0) {
                        e.preventDefault();
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            const range = quill.getSelection(true) || { index: quill.getLength() };
                            quill.insertEmbed(range.index, 'image', ev.target.result, Quill.sources.USER);
                            quill.setSelection(range.index + 1, Quill.sources.SILENT);
                        };
                        reader.readAsDataURL(file);
                    }
                }
            }
        });

        quill.root.addEventListener('dragover', (e) => { e.preventDefault(); });

        document.getElementById('memo-title-input').addEventListener('keydown', e => {
            if (e.key === 'Tab') {
                e.preventDefault();
                quill.focus();
            }
        });

        const dividerBtn = document.querySelector('.ql-divider');
        if (dividerBtn) dividerBtn.innerHTML = '<i class="fa-solid fa-minus" style="font-size: 14px; color: var(--text-muted);"></i>';

        document.querySelector('.col-center').addEventListener('click', e => {
            if (!e.target.closest('.editor-header') && !e.target.closest('.ql-toolbar') && !e.target.closest('.ql-editor')) {
                quill.focus();
            }
        });

        // ==========================================
        // [핵심] 백그라운드 큐(Queue) 시스템 구현부
        // ==========================================
        let syncQueue = [];
        let isProcessingQueue = false;

        function addToQueue(task) {
            if (task.type === 'UPDATE_INDEX' && syncQueue.some(t => t.type === 'UPDATE_INDEX')) return;
            if (task.type === 'FETCH_NOTE' && syncQueue.some(t => t.type === 'FETCH_NOTE' && t.syncId === task.syncId)) return;
            if (task.type === 'UPLOAD_NOTE') {
                syncQueue = syncQueue.filter(t => !(t.type === 'UPLOAD_NOTE' && t.syncId === task.syncId));
            }
            
            syncQueue.push(task);
            processQueue();
        }

        async function processQueue() {
            if (isProcessingQueue) return;
            isProcessingQueue = true;

            while (syncQueue.length > 0) {
                if (!gapi.client.getToken()) {
                    setStatusUI('disconnected');
                    break;
                }

                const task = syncQueue.shift();
                try {
                    if (task.type === 'FETCH_NOTE') setStatusUI('loading');
                    else setStatusUI('saving');

                    if (task.type === 'UPLOAD_NOTE') {
                        await uploadNoteToCloud(task.syncId);
                    } else if (task.type === 'DELETE_NOTE') {
                        await deleteFromCloud([task.syncId]);
                    } else if (task.type === 'FETCH_NOTE') {
                        await processFetchNoteQueue(task.syncId);
                    } else if (task.type === 'UPDATE_INDEX') {
                        await updateCloudIndex();
                    }
                } catch (e) {
                    console.error("Queue task failed", task, e);
                }
            }

            isProcessingQueue = false;
            if (gapi.client.getToken()) setStatusUI('saved');
            else setStatusUI('disconnected');
        }

        // ==========================================
        // 데이터베이스 초기화
        // ==========================================
        const request = indexedDB.open("ZenMemoDB_Ultimate", 2);
        request.onupgradeneeded = e => {
            db = e.target.result;
            if (!db.objectStoreNames.contains('memos')) {
                const store = db.createObjectStore('memos', { keyPath: 'id', autoIncrement: true });
                store.createIndex('updatedAt', 'updatedAt', { unique: false });
            }
        };
        request.onsuccess = e => {
            db = e.target.result;
            runAutoPurge(); 
            loadMemoList();
        };

        function runAutoPurge() {
            const txRead = db.transaction(['memos'], 'readonly');
            const storeRead = txRead.objectStore('memos');
            storeRead.getAll().onsuccess = e => {
                const now = Date.now();
                const THIRTY_DAYS = 30 * 24 * 60 * 60 * 1000;
                const idsToDelete = [];
                const syncIdsToDelete = [];
                
                e.target.result.forEach(m => {
                    if (m.isDeleted && m.deletedAt && (now - m.deletedAt > THIRTY_DAYS)) {
                        idsToDelete.push(m.id);
                        if(m.syncId) syncIdsToDelete.push(m.syncId);
                    }
                });

                if (idsToDelete.length > 0) {
                    const txWrite = db.transaction(['memos'], 'readwrite');
                    idsToDelete.forEach(id => txWrite.objectStore('memos').delete(id));
                    txWrite.oncomplete = () => {
                        syncIdsToDelete.forEach(syncId => addToQueue({ type: 'DELETE_NOTE', syncId: syncId }));
                    };
                }
            };
        }

        function triggerAutoSave() {
            if (currentMemoId) {
                const existing = displayedMemos.find(m => m.id === currentMemoId);
                if (existing && existing.contentLoaded === false) {
                    existing.contentLoaded = true;
                }
            }
            setStatusUI('saving');
            if (saveTimer) clearTimeout(saveTimer);
            saveTimer = setTimeout(executeSave, 1200);
        }

        quill.on('text-change', (delta, old, source) => {
            if (source === 'user') triggerAutoSave();
        });

        document.getElementById('memo-title-input').addEventListener('input', triggerAutoSave);

        function executeSave() {
            const title = document.getElementById('memo-title-input').value.trim() || '제목 없는 노트';
            document.title = title;
            const content = quill.root.innerHTML, plainText = quill.getText();
            
            if (!currentMemoId && !document.getElementById('memo-title-input').value && plainText.trim() === '') {
                setStatusUI('saved');
                saveTimer = null;
                return;
            }
            
            setStatusUI('saving');
            
            const memoData = { title, content, plainText, updatedAt: Date.now(), isDeleted: false, contentLoaded: true };
            
            if (currentMemoId) {
                memoData.id = currentMemoId;
                const existingMemo = displayedMemos.find(m => m.id === currentMemoId);
                memoData.syncId = (existingMemo && existingMemo.syncId) ? existingMemo.syncId : generateSyncId();
                if (existingMemo && existingMemo.pinnedAt) memoData.pinnedAt = existingMemo.pinnedAt;
            } else {
                memoData.syncId = generateSyncId();
            }

            const tx = db.transaction(['memos'], 'readwrite');
            const req = currentMemoId ? tx.objectStore('memos').put(memoData) : tx.objectStore('memos').add(memoData);
            
            req.onsuccess = e => {
                if (!currentMemoId) currentMemoId = e.target.result;
            };
            
            tx.oncomplete = () => {
                saveTimer = null;
                loadMemoList(true);
                addToQueue({ type: 'UPLOAD_NOTE', syncId: memoData.syncId });
                addToQueue({ type: 'UPDATE_INDEX' });
                setStatusUI('saved');
            };
        }

        function forceSaveImmediate() {
            if (saveTimer) {
                clearTimeout(saveTimer);
                executeSave();
            }
        }

        // ==========================================
        // 클라우드 API 관련 함수들
        // ==========================================
        async function getBackupFolderId() {
            if (backupFolderId) return backupFolderId;
            const token = gapi.client.getToken()?.access_token;
            if(!token) throw new Error('No token');
            
            const q = "name='ZenNotesBackup' and mimeType='application/vnd.google-apps.folder' and trashed=false";
            const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}`, { headers: { 'Authorization': `Bearer ${token}` } }).then(r=>r.json());
            
            if (res.files && res.files.length > 0) {
                backupFolderId = res.files[0].id;
                return backupFolderId;
            }
            
            const meta = { name: 'ZenNotesBackup', mimeType: 'application/vnd.google-apps.folder', parents: ['root'] };
            const created = await fetch('https://www.googleapis.com/drive/v3/files', {
                method: 'POST', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(meta)
            }).then(r=>r.json());
            backupFolderId = created.id;
            return backupFolderId;
        }

        async function updateCloudIndex() {
            const folderId = await getBackupFolderId();
            const token = gapi.client.getToken()?.access_token;
            
            const memos = await new Promise(res => db.transaction(['memos'], 'readonly').objectStore('memos').getAll().onsuccess = e => res(e.target.result));
            
            const indexData = memos.map(m => ({
                syncId: m.syncId, title: m.title, updatedAt: m.updatedAt, isDeleted: m.isDeleted, pinnedAt: m.pinnedAt
            }));

            const content = JSON.stringify({ type: 'ZenIndex', data: indexData });
            const qFiles = `name='ZenNotes_Index.json' and '${folderId}' in parents and trashed=false`;
            const resFiles = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(qFiles)}`, { headers: { 'Authorization': `Bearer ${token}` } }).then(r=>r.json());

            if (resFiles.files && resFiles.files.length > 0) {
                await fetch(`https://www.googleapis.com/upload/drive/v3/files/${resFiles.files[0].id}?uploadType=media`, {
                    method: 'PATCH', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }, body: content
                });
            } else {
                const metadata = { name: 'ZenNotes_Index.json', mimeType: 'application/json', parents: [folderId] };
                const boundary = '-------314159265358979323846';
                const body = `\r\n--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
                await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                    method: 'POST', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': `multipart/related; boundary=${boundary}` }, body: body
                });
            }
        }

        async function uploadNoteToCloud(syncId) {
            const folderId = await getBackupFolderId();
            const token = gapi.client.getToken()?.access_token;
            
            const memo = await new Promise(res => {
                const tx = db.transaction(['memos'], 'readonly');
                tx.objectStore('memos').getAll().onsuccess = e => res(e.target.result.find(m => m.syncId === syncId));
            });
            if(!memo || memo.contentLoaded === false) return; 

            const content = JSON.stringify({ type: 'ZenMemo', data: memo });
            const fileName = `Note_${syncId}.json`;
            const qFiles = `name='${fileName}' and '${folderId}' in parents and trashed=false`;
            const resFiles = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(qFiles)}`, { headers: { 'Authorization': `Bearer ${token}` } }).then(r=>r.json());

            if (resFiles.files && resFiles.files.length > 0) {
                await fetch(`https://www.googleapis.com/upload/drive/v3/files/${resFiles.files[0].id}?uploadType=media`, {
                    method: 'PATCH', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }, body: content
                });
            } else {
                const metadata = { name: fileName, mimeType: 'application/json', parents: [folderId] };
                const boundary = '-------314159265358979323846';
                const body = `\r\n--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
                await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                    method: 'POST', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': `multipart/related; boundary=${boundary}` }, body: body
                });
            }
        }

        async function deleteFromCloud(syncIdList) {
            const folderId = await getBackupFolderId();
            const token = gapi.client.getToken()?.access_token;
            for (let syncId of syncIdList) {
                if(!syncId) continue;
                const fileName = `Note_${syncId}.json`;
                const qFiles = `name='${fileName}' and '${folderId}' in parents and trashed=false`;
                const resFiles = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(qFiles)}`, { headers: { 'Authorization': `Bearer ${token}` } }).then(r => r.json());
                if (resFiles.files && resFiles.files.length > 0) {
                    await fetch(`https://www.googleapis.com/drive/v3/files/${resFiles.files[0].id}`, {
                        method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` }
                    });
                }
            }
        }

        // 구글에서 단일 노트 다운로드 핵심 함수 (VIP 및 백그라운드 공용)
        async function downloadNoteFromCloudDirect(syncId) {
            const folderId = await getBackupFolderId();
            const token = gapi.client.getToken()?.access_token;
            if(!token) throw new Error("Offline");

            const fileName = `Note_${syncId}.json`;
            const qFiles = `name='${fileName}' and '${folderId}' in parents and trashed=false`;
            const resFiles = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(qFiles)}`, { headers: { 'Authorization': `Bearer ${token}` } }).then(r=>r.json());

            if (resFiles.files && resFiles.files.length > 0) {
                const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${resFiles.files[0].id}?alt=media`, { headers: { 'Authorization': `Bearer ${token}` } }).then(r=>r.json());
                if (fileRes.type === 'ZenMemo' && fileRes.data) {
                    return fileRes.data;
                }
            }
            throw new Error("Not found");
        }

        // 백그라운드 큐 전용 다운로드 처리
        async function processFetchNoteQueue(syncId) {
            const fetched = await downloadNoteFromCloudDirect(syncId);
            if (fetched) {
                const txWrite = db.transaction(['memos'], 'readwrite');
                const store = txWrite.objectStore('memos');
                store.getAll().onsuccess = e => {
                    const localMemo = e.target.result.find(m => m.syncId === syncId);
                    if (localMemo && localMemo.contentLoaded === false) {
                        localMemo.content = fetched.content || '';
                        localMemo.plainText = fetched.plainText || '';
                        localMemo.contentLoaded = true; // 다운로드 완료!
                        localMemo.updatedAt = fetched.updatedAt;
                        store.put(localMemo);
                        
                        if (currentMemoId === localMemo.id) {
                            quill.root.innerHTML = localMemo.content;
                        }
                    }
                };
            }
        }

        // [핵심] VIP 새치기 기능 (즉시 로딩)
        async function fetchNoteFromCloudVIP(syncId, localId) {
            setStatusUI('loading');
            try {
                syncQueue = syncQueue.filter(t => !(t.type === 'FETCH_NOTE' && t.syncId === syncId));

                const fetched = await downloadNoteFromCloudDirect(syncId);
                if (fetched) {
                    const txWrite = db.transaction(['memos'], 'readwrite');
                    const store = txWrite.objectStore('memos');
                    
                    const m = await new Promise(res => store.get(localId).onsuccess = ev => res(ev.target.result));
                    if (m) {
                        m.content = fetched.content || '';
                        m.plainText = fetched.plainText || '';
                        m.contentLoaded = true;
                        m.updatedAt = fetched.updatedAt;
                        
                        store.put(m).onsuccess = () => {
                            if (currentMemoId === m.id) {
                                quill.root.innerHTML = m.content;
                            }
                            setStatusUI('saved');
                        };
                    }
                }
            } catch (e) {
                alert("현재 오프라인 상태라 클라우드에서 내용을 불러오지 못했습니다. 연결되면 다시 시도합니다.");
                setStatusUI('disconnected');
            }
        }

        // ==========================================
        // UI 조작 및 목록 렌더링
        // ==========================================
        function createNewMemo() {
            forceSaveImmediate();
            currentMemoId = null;
            selectedMemos.clear();
            lastSelectedId = null;
            document.getElementById('memo-title-input').value = '';
            document.title = "새 노트";
            quill.root.innerHTML = '';
            setStatusUI('saved');
            loadMemoList();
            closeAllPanelsMobile();
        }

        function loadMemoList(queryDB = true) {
            const query = document.getElementById('list-search-input').value.toLowerCase();
            const list = document.getElementById('memo-list');
            const savedScroll = list.scrollTop;
            
            if (queryDB) {
                const tx = db.transaction(['memos'], 'readonly');
                let pinnedMemos = [], normalMemos = [];
                
                tx.objectStore('memos').index('updatedAt').openCursor(null, 'prev').onsuccess = e => {
                    const cursor = e.target.result;
                    if (cursor) {
                        const m = cursor.value;
                        if (!m.isDeleted && (m.title.toLowerCase().includes(query) || (m.plainText && m.plainText.toLowerCase().includes(query)))) {
                            if (m.pinnedAt) pinnedMemos.push(m);
                            else normalMemos.push(m);
                        }
                        cursor.continue();
                    }
                };
                
                tx.oncomplete = () => { 
                    pinnedMemos.sort((a, b) => a.pinnedAt - b.pinnedAt);
                    displayedMemos = [...pinnedMemos, ...normalMemos];
                    list.innerHTML = '';
                    displayedMemos.forEach(m => list.appendChild(createMemoElement(m)));
                    list.scrollTop = savedScroll; 
                };
            } else {
                list.innerHTML = '';
                displayedMemos.forEach(m => list.appendChild(createMemoElement(m)));
                list.scrollTop = savedScroll;
            }
        }

        function loadTrashList() {
            const query = document.getElementById('trash-search-input').value.toLowerCase();
            const list = document.getElementById('trash-list');
            const savedScroll = list.scrollTop;
            
            const tx = db.transaction(['memos'], 'readonly');
            displayedTrashMemos = [];
            
            tx.objectStore('memos').index('updatedAt').openCursor(null, 'prev').onsuccess = e => {
                const cursor = e.target.result;
                if (cursor) {
                    const m = cursor.value;
                    if (m.isDeleted && (m.title.toLowerCase().includes(query) || (m.plainText && m.plainText.toLowerCase().includes(query)))) {
                        displayedTrashMemos.push(m);
                    }
                    cursor.continue();
                }
            };
            
            tx.oncomplete = () => { 
                list.innerHTML = '';
                displayedTrashMemos.forEach(m => list.appendChild(createTrashElement(m)));
                list.scrollTop = savedScroll; 
            };
        }

        function formatDateTime(timestamp) {
            const d = new Date(timestamp);
            const hours = d.getHours().toString().padStart(2, '0');
            const minutes = d.getMinutes().toString().padStart(2, '0');
            return `${d.toLocaleDateString()} ${hours}:${minutes}`;
        }

        function createMemoElement(memo) {
            const li = document.createElement('li');
            li.className = `memo-item ${currentMemoId === memo.id || selectedMemos.has(memo.id) ? 'active' : ''}`;
            li.innerHTML = `
                <div class="memo-info">
                    <span class="memo-title">${memo.title}</span>
                    <span class="memo-date">${formatDateTime(memo.updatedAt)}</span>
                </div>
                <div class="memo-actions">
                    <i class="fa-solid fa-thumbtack btn-pin ${memo.pinnedAt ? 'is-pinned' : ''}" onclick="togglePin(${memo.id}, event)"></i>
                    <i class="fa-solid fa-trash-can btn-delete" onclick="deleteMemo(${memo.id}, event)"></i>
                </div>`;
                
            li.onclick = e => {
                if (e.target.classList.contains('btn-delete') || e.target.classList.contains('btn-pin')) return;
                forceSaveImmediate();
                
                const isCtrl = e.ctrlKey || e.metaKey;
                const isShift = e.shiftKey;
                
                if (isShift && lastSelectedId !== null) {
                    const cIdx = displayedMemos.findIndex(m => m.id === memo.id);
                    const lIdx = displayedMemos.findIndex(m => m.id === lastSelectedId);
                    if (cIdx !== -1 && lIdx !== -1) {
                        const start = Math.min(cIdx, lIdx);
                        const end = Math.max(cIdx, lIdx);
                        if (!isCtrl) selectedMemos.clear();
                        for (let i = start; i <= end; i++) selectedMemos.add(displayedMemos[i].id);
                    }
                    loadMemoList(false);
                } else if (isCtrl) {
                    if (selectedMemos.has(memo.id)) selectedMemos.delete(memo.id);
                    else selectedMemos.add(memo.id);
                    lastSelectedId = memo.id;
                    loadMemoList(false);
                } else {
                    selectedMemos.clear();
                    selectedMemos.add(memo.id);
                    lastSelectedId = memo.id;
                    loadMemo(memo.id); 
                }
            };
            return li;
        }

        function createTrashElement(memo) {
            const li = document.createElement('li');
            li.className = `memo-item ${selectedTrashMemos.has(memo.id) ? 'active' : ''}`;
            li.innerHTML = `
                <div class="memo-info">
                    <span class="memo-title">${memo.title}</span>
                    <span class="memo-date">${formatDateTime(memo.deletedAt || memo.updatedAt)}</span>
                </div>
                <div class="memo-actions">
                    <i class="fa-solid fa-rotate-left btn-restore" onclick="restoreMemo(${memo.id}, event)"></i>
                    <i class="fa-solid fa-xmark btn-hard-delete" onclick="hardDeleteMemo(${memo.id}, event)"></i>
                </div>`;
                
            li.onclick = e => {
                if (e.target.classList.contains('btn-restore') || e.target.classList.contains('btn-hard-delete')) return;
                
                const isCtrl = e.ctrlKey || e.metaKey;
                const isShift = e.shiftKey;
                
                if (isShift && lastSelectedTrashId !== null) {
                    const cIdx = displayedTrashMemos.findIndex(m => m.id === memo.id);
                    const lIdx = displayedTrashMemos.findIndex(m => m.id === lastSelectedTrashId);
                    if (cIdx !== -1 && lIdx !== -1) {
                        const start = Math.min(cIdx, lIdx);
                        const end = Math.max(cIdx, lIdx);
                        if (!isCtrl) selectedTrashMemos.clear();
                        for (let i = start; i <= end; i++) selectedTrashMemos.add(displayedTrashMemos[i].id);
                    }
                    loadTrashList();
                } else if (isCtrl) {
                    if (selectedTrashMemos.has(memo.id)) selectedTrashMemos.delete(memo.id);
                    else selectedTrashMemos.add(memo.id);
                    lastSelectedTrashId = memo.id;
                    loadTrashList();
                } else {
                    selectedTrashMemos.clear();
                    selectedTrashMemos.add(memo.id);
                    lastSelectedTrashId = memo.id;
                    loadTrashList();
                }
            };
            return li;
        }

        function togglePin(id, e) {
            e.stopPropagation();
            forceSaveImmediate(); 
            
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');
            
            store.get(id).onsuccess = ev => {
                const memo = ev.target.result;
                if (memo) {
                    if (memo.pinnedAt) delete memo.pinnedAt;
                    else memo.pinnedAt = Date.now();
                    store.put(memo);
                    addToQueue({ type: 'UPDATE_INDEX' }); 
                }
            };
            tx.oncomplete = () => loadMemoList(true);
        }

        function loadMemo(id) {
            db.transaction(['memos'], 'readonly').objectStore('memos').get(id).onsuccess = e => {
                const m = e.target.result;
                if (m) {
                    currentMemoId = m.id;
                    document.getElementById('memo-title-input').value = m.title;
                    document.title = m.title; 
                    
                    if (m.contentLoaded === false) {
                        quill.root.innerHTML = '';
                        fetchNoteFromCloudVIP(m.syncId, m.id); 
                    } else {
                        quill.root.innerHTML = m.content || '';
                        setStatusUI('saved');
                    }
                    loadMemoList(false);
                }
            };
            closeAllPanelsMobile();
        }

        function deleteMemo(id, e) {
            e.stopPropagation();
            const targets = (selectedMemos.has(id) && selectedMemos.size > 1) ? Array.from(selectedMemos) : [id];
            if (!confirm(targets.length > 1 ? `선택한 ${targets.length}개의 노트를 휴지통으로 보냅니다.` : '휴지통으로 보내시겠습니까?')) return;
            
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');
            
            targets.forEach(targetId => {
                store.get(targetId).onsuccess = ev => {
                    const memo = ev.target.result;
                    if (memo) {
                        memo.isDeleted = true;
                        memo.deletedAt = Date.now(); 
                        memo.updatedAt = Date.now();
                        store.put(memo);
                    }
                };
            });
            
            tx.oncomplete = () => {
                if (targets.includes(currentMemoId)) createNewMemo();
                else loadMemoList();
                
                targets.forEach(targetId => selectedMemos.delete(targetId));
                addToQueue({ type: 'UPDATE_INDEX' }); 
            };
        }

        function restoreMemo(id, e) {
            e.stopPropagation();
            const targets = (selectedTrashMemos.has(id) && selectedTrashMemos.size > 1) ? Array.from(selectedTrashMemos) : [id];
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');
            
            targets.forEach(targetId => {
                store.get(targetId).onsuccess = ev => {
                    const memo = ev.target.result;
                    if (memo) {
                        memo.isDeleted = false;
                        delete memo.deletedAt;
                        memo.updatedAt = Date.now();
                        store.put(memo);
                    }
                };
            });
            
            tx.oncomplete = () => {
                targets.forEach(targetId => selectedTrashMemos.delete(targetId));
                loadTrashList();
                loadMemoList();
                addToQueue({ type: 'UPDATE_INDEX' }); 
            };
        }

        function hardDeleteMemo(id, e) {
            e.stopPropagation();
            const targets = (selectedTrashMemos.has(id) && selectedTrashMemos.size > 1) ? Array.from(selectedTrashMemos) : [id];
            if (!confirm(targets.length > 1 ? `선택한 ${targets.length}개의 노트를 영구 삭제하시겠습니까?` : '이 노트를 영구 삭제하시겠습니까? (복구 불가)')) return;
            
            const syncIdsToDelete = [];
            const txRead = db.transaction(['memos'], 'readonly');
            targets.forEach(targetId => {
                txRead.objectStore('memos').get(targetId).onsuccess = ev => {
                    if(ev.target.result && ev.target.result.syncId) syncIdsToDelete.push(ev.target.result.syncId);
                };
            });

            txRead.oncomplete = () => {
                const tx = db.transaction(['memos'], 'readwrite');
                targets.forEach(targetId => tx.objectStore('memos').delete(targetId));
                
                tx.oncomplete = () => {
                    targets.forEach(targetId => selectedTrashMemos.delete(targetId));
                    loadTrashList();
                    syncIdsToDelete.forEach(sId => addToQueue({ type: 'DELETE_NOTE', syncId: sId }));
                    addToQueue({ type: 'UPDATE_INDEX' });
                };
            };
        }

        function emptyTrash() {
            if (displayedTrashMemos.length === 0) { alert('휴지통이 이미 비어있습니다.'); return; }
            if (!confirm('휴지통의 모든 메모를 영구 삭제합니다. 계속하시겠습니까?')) return;
            
            const syncIdsToDelete = displayedTrashMemos.map(m => m.syncId).filter(id => id);
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');
            displayedTrashMemos.forEach(memo => store.delete(memo.id));
            
            tx.oncomplete = () => {
                selectedTrashMemos.clear();
                loadTrashList();
                syncIdsToDelete.forEach(sId => addToQueue({ type: 'DELETE_NOTE', syncId: sId }));
                addToQueue({ type: 'UPDATE_INDEX' });
            };
        }

        function backupAllData() {
            db.transaction(['memos'], 'readonly').objectStore('memos').getAll().onsuccess = e => {
                const activeData = e.target.result.filter(m => !m.isDeleted);
                saveAs(new Blob([JSON.stringify({type:'ZenBackup', data:activeData})], {type:'application/json'}), `Zen_Backup_${Date.now()}.json`);
            };
        }

        function handleFileImport(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            const isTxt = file.name.toLowerCase().endsWith('.txt');
            
            reader.onload = ev => {
                const fileContent = ev.target.result;
                if (isTxt) {
                    createNewMemo();
                    document.getElementById('memo-title-input').value = file.name.replace(/\.[^/.]+$/, "");
                    quill.setText(fileContent);
                    triggerAutoSave();
                    e.target.value = ''; return;
                }
                try {
                    const parsed = JSON.parse(fileContent);
                    if (parsed.type === 'ZenBackup') {
                        const readTx = db.transaction(['memos'], 'readonly');
                        readTx.objectStore('memos').getAll().onsuccess = (evGetAll) => {
                            const existingMemos = evGetAll.target.result;
                            const activeSyncIds = new Set(existingMemos.filter(m => !m.isDeleted).map(m => m.syncId).filter(id => id));
                            
                            const writeTx = db.transaction(['memos'], 'readwrite');
                            const store = writeTx.objectStore('memos');
                            
                            parsed.data.forEach(m => {
                                if (!m.syncId || !activeSyncIds.has(m.syncId)) {
                                    const isInTrash = existingMemos.some(ex => ex.syncId === m.syncId && ex.isDeleted);
                                    delete m.id;
                                    if (!m.syncId || isInTrash) m.syncId = generateSyncId();
                                    
                                    m.isDeleted = false; 
                                    m.contentLoaded = true; 
                                    store.add(m);
                                    activeSyncIds.add(m.syncId);
                                    
                                    addToQueue({ type: 'UPLOAD_NOTE', syncId: m.syncId });
                                }
                            });
                            writeTx.oncomplete = () => {
                                loadMemoList();
                                addToQueue({ type: 'UPDATE_INDEX' }); 
                            };
                        };
                    } else if (parsed.type === 'ZenMemo') {
                        createNewMemo();
                        document.getElementById('memo-title-input').value = parsed.title || file.name.replace(/\.[^/.]+$/, "");
                        quill.root.innerHTML = parsed.content || parsed.plainText || '';
                        triggerAutoSave();
                    } else { alert('지원하지 않는 JSON 형식입니다.'); }
                } catch(err) { alert('파일 읽기 오류'); }
                e.target.value = ''; 
            };
            reader.readAsText(file);
        }

        function checkAuthState() {
            const hasToken = gapiInited && gisInited && gapi.client && gapi.client.getToken() !== null;
            const authBtnIcon = document.querySelector('#btn-auth i');
            if (authBtnIcon) authBtnIcon.style.color = hasToken ? 'var(--accent)' : '';
            
            if (!hasToken) {
                setStatusUI('disconnected');
            } else if (uiStatusQueue.length === 0) {
                setStatusUI('saved');
            }
        }
        window.addEventListener('DOMContentLoaded', () => checkAuthState());

        document.getElementById('btn-auth').addEventListener('click', () => {
            if (!gapiInited || !gisInited) return;
            closeAllPanelsMobile(); 
            
            if (gapi.client.getToken() !== null) {
                if (confirm('구글 계정에서 로그아웃 하시겠습니까?')) {
                    const token = gapi.client.getToken();
                    google.accounts.oauth2.revokeToken(token.access_token);
                    gapi.client.setToken(null);
                    localStorage.removeItem('zen_logged_in');
                    checkAuthState(); 
                }
                return; 
            }
            
            tokenClient.callback = async (resp) => {
                if (resp.error !== undefined) {
                    localStorage.removeItem('zen_logged_in');
                    checkAuthState(); return;
                }
                localStorage.setItem('zen_logged_in', 'true');
                checkAuthState(); 
                
                const icon = document.querySelector('#btn-auth i');
                icon.classList.add('blink-active');
                setTimeout(() => icon.classList.remove('blink-active'), 1500);
                
                smartSync(); 
            };
            tokenClient.requestAccessToken({ prompt: 'consent' });
        });

        // ==========================================
        // [핵심] 인덱스(Index) 우선 로딩 및 껍데기 생성 시스템
        // ==========================================
        async function smartSync() {
            if (!gapi.client.getToken() || !db) return;
            setStatusUI('loading');
            
            try {
                const folderId = await getBackupFolderId();
                const token = gapi.client.getToken().access_token;
                
                const qFiles = `name='ZenNotes_Index.json' and '${folderId}' in parents and trashed=false`;
                const resFiles = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(qFiles)}`, { headers: { 'Authorization': `Bearer ${token}` } }).then(r=>r.json());

                const txRead = db.transaction(['memos'], 'readonly');
                const localData = await new Promise(res => txRead.objectStore('memos').getAll().onsuccess = e => res(e.target.result));
                const localMap = new Map(localData.map(m => [m.syncId || m.id.toString(), m]));

                let cloudIndex = [];

                if (resFiles.files && resFiles.files.length > 0) {
                    const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${resFiles.files[0].id}?alt=media`, { headers: { 'Authorization': `Bearer ${token}` } }).then(r=>r.json());
                    if (fileRes.type === 'ZenIndex' && fileRes.data) cloudIndex = fileRes.data;
                } else {
                    localData.forEach(m => {
                        if (m.contentLoaded === undefined) m.contentLoaded = true; 
                        addToQueue({ type: 'UPLOAD_NOTE', syncId: m.syncId });
                    });
                    addToQueue({ type: 'UPDATE_INDEX' });
                    setStatusUI('saved');
                    return;
                }

                let needUIUpdate = false;
                const txWrite = db.transaction(['memos'], 'readwrite');
                const store = txWrite.objectStore('memos');

                cloudIndex.forEach(cloudItem => {
                    const localMemo = localMap.get(cloudItem.syncId);
                    
                    if (!localMemo) {
                        store.add({
                            syncId: cloudItem.syncId, title: cloudItem.title, updatedAt: cloudItem.updatedAt, isDeleted: cloudItem.isDeleted, pinnedAt: cloudItem.pinnedAt,
                            content: '', plainText: '', contentLoaded: false 
                        });
                        needUIUpdate = true;
                        addToQueue({ type: 'FETCH_NOTE', syncId: cloudItem.syncId });
                    } else if (cloudItem.updatedAt > localMemo.updatedAt) {
                        localMemo.title = cloudItem.title;
                        localMemo.isDeleted = cloudItem.isDeleted;
                        localMemo.pinnedAt = cloudItem.pinnedAt;
                        localMemo.updatedAt = cloudItem.updatedAt;
                        localMemo.contentLoaded = false;
                        store.put(localMemo);
                        needUIUpdate = true;
                        addToQueue({ type: 'FETCH_NOTE', syncId: cloudItem.syncId });
                    }
                });

                localData.forEach(localMemo => {
                    if (localMemo.contentLoaded !== false) {
                        const inCloud = cloudIndex.find(c => c.syncId === localMemo.syncId);
                        if (!inCloud || localMemo.updatedAt > inCloud.updatedAt) {
                            addToQueue({ type: 'UPLOAD_NOTE', syncId: localMemo.syncId });
                        }
                    }
                });
                
                addToQueue({ type: 'UPDATE_INDEX' });

                txWrite.oncomplete = () => {
                    hasLoadedFromCloud = true;
                    if (needUIUpdate) loadMemoList();
                    setStatusUI('saved'); 
                };

            } catch (err) {
                console.error(">>> Sync Error:", err);
                setStatusUI('disconnected');
            }
