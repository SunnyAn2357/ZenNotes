<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" media="(min-width: 769px)" content="#282C26">
    <meta name="theme-color" media="(max-width: 768px)" content="#131314">
    <title>ZenNotes-ADS</title>
    <link rel="icon" type="image/png" href="favicon.png?v=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

    <script>

        const CLIENT_ID = '765080058790-uhqk1gj2ko8a197f26ujnq0gb4nl97ha.apps.googleusercontent.com';
        const API_KEY = 'AIzaSyD1Z5E5e8tRfmG9fDruBM72pliOt6ZkShw';

        const DISCOVERY_DOC = "https://www.googleapis.com/discovery/v1/apis/drive/v3/rest";
        const SCOPES = "https://www.googleapis.com/auth/drive.file";

        let tokenClient, gapiInited = false, gisInited = false;
        let hasLoadedFromCloud = false; 

        function gapiLoaded() {
            gapi.load('client', async () => {
                try {
                    await gapi.client.init({ apiKey: API_KEY, discoveryDocs: [DISCOVERY_DOC] });
                    gapiInited = true;
                    console.log("✅ 구글 API 준비 완료!");
                } catch (e) {
                    console.error("❌ GAPI 초기화 실패:", e);
                }
            });
        }

        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
		// 🎯 추가됨: 매번 무작위 암호를 생성하여 위조된 응답(CSRF)을 방어합니다.
                state: Math.random().toString(36).substring(2),
                callback: ''
            });
            gisInited = true;
            console.log("✅ 구글 인증 준비 완료!");
        }

    </script>

    <script src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root {
            --bg: #131314;
            --surface: #1e1e20;
            --surface-hover: #2e2e32;
            --border: #444746;
            --text-main: #e3e3e3;
            --text-muted: #c4c7c5;
            --accent: #78a9ff;
            --danger: #ff6b6b;
            --font-family: 'Pretendard', -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            /* 🎯 [추가] 브라우저 최상단부터 당겨서 새로고침 완벽 차단 */
            overscroll-behavior: none !important; 
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-family);
            display: flex;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
        }
        
        input::placeholder { color: var(--text-muted); }
        
        button {
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            color: var(--text-main);
            font-family: inherit;
            font-size: 15px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        button:hover { color: var(--text-main); }

        @keyframes icon-blink {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.15); color: #fff; }
            100% { opacity: 1; transform: scale(1); }
        }
        .blink-active { animation: icon-blink 0.4s ease-in-out 3; color: var(--accent) !important; }

        @keyframes status-pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pulse-fast { animation: status-pulse 1s infinite ease-in-out; }
        .pulse-slow { animation: status-pulse 2s infinite ease-in-out; }

        .col-left {
            width: 285px;
            min-width: 285px;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            transition: width 0.25s ease-in-out, min-width 0.25s ease-in-out, transform 0.25s ease-in-out;
        }

        .nav-header {
            padding: 24px 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .toggle-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            cursor: pointer;
        }
	.toggle-btn i { font-size: 15px; }
        .toggle-btn:hover { color: var(--accent) !important; }

        .col-left.collapsed { width: 60px; min-width: 60px; }
        .col-left.collapsed .nav-header { padding: 24px 0 16px 0; align-items: center; }
        .col-left.collapsed .search-bar,
        .col-left.collapsed .memo-list,
        .col-left.collapsed .btn-text { display: none !important; }
        .col-left.collapsed .new-note-btn {
            justify-content: center;
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 50%;
            margin: 0 auto;
        }

        .search-bar {
            background: var(--bg);
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border);
        }
        .search-bar input { width: 100%; }

	/* 🎯 [제미나이 핏] 유틸, 네비게이션 아이콘 크기 통일 */
        .new-note-btn i, .search-bar i, .util-btn i, .memo-actions i { font-size: 15px !important; }

        .memo-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            padding: 0 10px 20px;
        }

        .memo-item {
            padding: 12px 14px;
            margin-bottom: 4px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.1s;
            border-left: 3px solid transparent;
            color: var(--text-main);
        }
        .memo-item:hover { background: var(--surface-hover); }
        .memo-item.active {
            background: var(--surface-hover);
            border-left: 3px solid var(--accent);
            border-radius: 4px 8px 8px 4px;
        }

	.memo-info { overflow: hidden; display: flex; flex-direction: column; gap: 4px; max-width: 170px; } /* 👈 max-width 추가! */
        .memo-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; font-weight: 400; }
        .memo-date { font-size: 11px; color: var(--text-muted); opacity: 0.7; }
        .memo-actions { display: flex; align-items: center; gap: 10px; }
        .memo-item:hover .btn-delete, .memo-item:hover .btn-pin { opacity: 0.6; }
        .memo-item:hover .btn-restore, .memo-item:hover .btn-hard-delete { opacity: 0.6; }

        .btn-delete { opacity: 0; color: #fda4af; padding: 4px; font-size: 12px; transition: all 0.2s; cursor: pointer; }
        .btn-delete:hover { color: #f43f5e; opacity: 1 !important; }

        .btn-pin { opacity: 0; color: #94a3b8; padding: 4px; font-size: 12px; transition: all 0.2s; transform: rotate(-45deg); cursor: pointer; }
        .btn-pin:hover { color: #60a5fa; opacity: 1 !important; }
        .btn-pin.is-pinned { transform: rotate(0deg); color: #3b82f6; opacity: 1 !important; }

        .btn-restore { opacity: 0; color: #94a3b8; padding: 4px; font-size: 12px; transition: all 0.2s; cursor: pointer; }
        .btn-restore:hover { color: #60a5fa; opacity: 1 !important; }

        .btn-hard-delete { opacity: 0; color: #fda4af; padding: 4px; font-size: 12px; transition: all 0.2s; cursor: pointer; }
        .btn-hard-delete:hover { color: #f43f5e; opacity: 1 !important; }

        .col-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--bg);
            min-height: 0;
	    min-width: 0;
        }

        .editor-header {
            padding: 30px 24px 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-shrink: 0;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        #memo-title-input {
            font-size: 28px;
            font-weight: 600;	/* 🎯 [제미나이 핏] 700에서 600으로 수정 */
            width: 75%;
            letter-spacing: -0.5px;
        }

        .status-container {
            position: fixed;
            top: 35px;
            right: 55px; /* 상태알림과 상태점의 오른쪽 여백, 모바일에서도 고쳐야 함 */
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 8px; /* 상태알림과 상태점 사이의 여백 */
        }

        .status-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.5s ease;
            opacity: 0;
        }

        .status-dot.saved { background-color: var(--accent); box-shadow: 0 0 6px rgba(120, 169, 255, 0.4); opacity: 1; }
        .status-dot.unsaved { background-color: var(--danger); box-shadow: 0 0 6px rgba(255, 107, 107, 0.4); opacity: 1; }
        .status-dot.logged-out { background-color: var(--text-muted); box-shadow: none; opacity: 1; }

        .status-text {
            font-size: 9px;
            color: var(--text-muted);
            transition: opacity 0.5s ease-in-out, color 0.5s ease;
            opacity: 0;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .print-hr { display: none; }

        .quill-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0;
            min-height: 0;
        }

        .ql-toolbar.ql-snow {
            border: none !important;
            padding: 12px 24px !important;
            margin: 0 auto !important;
            border-bottom: 1px solid var(--border) !important;
            flex-shrink: 0;
            max-width: 800px;
            width: 100%;
            /* 🎯 툴바 가로 정렬의 핵심! 이 4줄이 빠져서 세로로 무너졌던 겁니다 */
            display: flex !important;
            flex-wrap: wrap !important;
            align-items: center;
            gap: 4px;
        }

	/* 🎯 [제미나이 핏] 툴바 버튼 규격 통일 */
        .ql-toolbar.ql-snow button { width: 30px !important; height: 30px !important; }
        .ql-toolbar.ql-snow button svg { width: 18px !important; height: 18px !important; }

        .ql-container.ql-snow {
            border: none !important;
            font-size: 16px;
            font-family: var(--font-family);
            flex: 1;
            min-height: 0;
            overflow-y: auto !important;
        }

        .col-center::-webkit-scrollbar,
        .quill-wrapper::-webkit-scrollbar,
        .ql-container.ql-snow::-webkit-scrollbar,
        .ql-editor::-webkit-scrollbar {
            display: none;
        }

        .col-center,
        .quill-wrapper,
        .ql-container.ql-snow,
        .ql-editor {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .ql-snow .ql-stroke { stroke: var(--text-muted) !important; }
        .ql-snow .ql-fill { fill: var(--text-muted) !important; }
        .ql-snow .ql-picker { color: var(--text-muted) !important; }

        /* [추가] 툴바 버튼 마우스 오버 및 활성화 상태 시 푸른색(accent)으로 변경 */
        .ql-toolbar.ql-snow button:hover .ql-stroke,
        .ql-toolbar.ql-snow button.ql-active .ql-stroke { stroke: var(--accent) !important; }
        
        .ql-toolbar.ql-snow button:hover .ql-fill,
        .ql-toolbar.ql-snow button.ql-active .ql-fill { fill: var(--accent) !important; }
        
        /* 커스텀으로 넣은 구분선(divider) 아이콘 등 폰트 아이콘 처리용 */
        .ql-toolbar.ql-snow button:hover i,
        .ql-toolbar.ql-snow button.ql-active i { color: var(--accent) !important; }

        .ql-snow .ql-picker-options {
            background-color: var(--surface) !important;
            border: 1px solid var(--border) !important;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6) !important;
            border-radius: 8px !important;
            padding: 8px 0 !important;
            z-index: 10000 !important;
        }

        .ql-snow .ql-picker-item {
            color: var(--text-main) !important;
            padding: 6px 12px !important;
            transition: color 0.2s, background-color 0.2s !important;
        }
        .ql-snow .ql-picker-item:hover,
        .ql-snow .ql-picker-item.ql-selected {
            color: var(--accent) !important;
            background-color: var(--surface-hover) !important;
        }

        .ql-snow .ql-picker-label { color: var(--text-muted) !important; }
        .ql-snow .ql-picker-label:hover { color: var(--accent) !important; }
        .ql-snow .ql-picker-label::before { color: inherit !important; }

        .ql-snow .ql-tooltip {
            background-color: var(--surface) !important;
            border: 1px solid var(--border) !important;
            color: var(--text-main) !important;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6) !important;
            border-radius: 12px !important;
            padding: 12px 16px !important;
            z-index: 10000 !important;
        }

        .ql-snow .ql-tooltip.ql-hidden { display: none !important; }

        .ql-snow .ql-tooltip input[type=text] {
            background-color: var(--bg) !important;
            color: var(--text-main) !important;
            border: 1px solid var(--border) !important;
            border-radius: 6px !important;
            padding: 6px 10px !important;
            font-family: inherit !important;
            height: auto !important;
            margin: 0 8px !important;
        }
        .ql-snow .ql-tooltip input[type=text]:focus { border-color: var(--accent) !important; }
        .ql-snow .ql-tooltip::before { color: var(--text-muted) !important; }
        
        .ql-snow .ql-tooltip a.ql-action::before {
            background-color: var(--accent) !important;
            color: #fff !important;
            padding: 6px 12px !important;
            border-radius: 6px !important;
            font-weight: 500 !important;
            transition: opacity 0.2s !important;
        }
        .ql-snow .ql-tooltip a.ql-action:hover::before { opacity: 0.8 !important; }
        .ql-snow .ql-tooltip a.ql-remove::before {
            color: var(--danger) !important;
            font-weight: 500 !important;
            margin-left: 8px !important;
        }

	/* 🎯 [Pro 통합 버전] 제미나이 UI & 표 깨짐 철통 방어 CSS */
	.ql-editor {
	    padding: 24px 24px;
	    line-height: 1.65 !important; /* 제미나이 특유의 시원한 줄간격(1.65) */
	    color: var(--text-main);
	    letter-spacing: -0.01em;
	    font-weight: 400;
	    font-size: 16px;
	    max-width: 800px;
	    margin: 0 auto;
	    width: 100%;
	    position: relative;
	    word-break: keep-all; /* 한국어 단어 잘림 방지 ( image_0.png 문제 해결 ) */
	    overflow-wrap: break-word;
	    overflow-x: auto !important; /* 표나 긴 코드블록이 모바일 화면을 뚫고 나가는 현상 방지 */
	}

	/* 문단(P) 및 제목(H1, H2, H3) 하단 여백 일괄 설정(문단간격) */
    	.ql-editor p, .ql-editor h1, .ql-editor h2, .ql-editor h3 { 
        margin-bottom: 8px !important; /* 🎯 이 숫자를 바꾸면 모든 간격이 한꺼번에 바뀝니다 */
	}
	/* 문서의 맨 마지막 줄은 불필요한 하단 여백 제거 */
        .ql-editor p:last-child, .ql-editor h1:last-child, .ql-editor h2:last-child, .ql-editor h3:last-child { 
            margin-bottom: 0 !important; 
        }
	.ql-editor li { margin-bottom: 8px !important; }
	.ql-editor ul, .ql-editor ol { margin-bottom: 20px !important; }

	/* 📊 [Pro의 표 최후 방어선] Quill 1.3.6은 네이티브 표를 지원하지 않지만, 
	   CSS로 최대한 '표처럼' 보이게 만드는 트릭입니다. */
	.ql-editor table {
	    border-collapse: collapse;
	    width: 100%;
	    margin: 20px 0 !important;
	    border: 1px solid var(--border);
	    table-layout: auto;
	}
	.ql-editor td, .ql-editor th {
	    border: 1px solid var(--border);
	    padding: 8px 12px;
	    font-size: 14px;
	    color: var(--text-main);
	    word-break: keep-all;
	}
	.ql-editor th {
	    background-color: var(--surface-hover);
	    font-weight: 600;
	}

	/* 기본 이미지 표시기 */
       .ql-editor img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 16px 0;
            border-radius: 8px;
        }

	/* 다른 기기에서 불러와서 소스가 빈 이미지의 자리 표시자 역할 */
	.ql-editor img[src=""][data-local-image="true"],
	.ql-editor img[src=""] {
	    min-height: 120px; /* 높이가 0이 되지 않도록 최소 공간 확보 */
	    width: 100%;
	    background-color: var(--surface-hover); /* 살짝 튀는 배경색 */
	    border: 2px dashed var(--border); /* 점선 테두리로 '비어있음' 강조 */
	    border-radius: 8px;
	    display: block;
	    position: relative;
	}

	/* (선택 사항) 최신 브라우저에서는 빈 이미지에 가상 요소를 허용하므로 안내 문구 추가 가능 */
	.ql-editor img[src=""]::after {
	    content: '이미지 (저장한 기기에만 표시됨)';
	    position: absolute;
	    top: 50%;
	    left: 50%;
	    transform: translate(-50%, -50%);
	    color: var(--text-muted);
	    font-size: 13px;
	}

        .ql-editor hr {
            border: none;
            border-bottom: 1px solid var(--border);
            margin: 20px 0;
            opacity: 1;
        }
        .ql-editor.ql-blank::before {
            color: #404040 !important;
            font-weight: 400 !important;
            position: absolute !important;
            left: 24px !important;
            top: 24px !important;
            pointer-events: none !important;
            opacity: 0.9;
        }
        .col-right {
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            height: 100svh;
            z-index: 1001;
            border-left: none;
            width: 285px;
            min-width: 285px;
            background: var(--surface);
            padding: 24px 20px calc(30px + env(safe-area-inset-bottom)) 20px;
            display: flex;
            flex-direction: column;
            gap: 36px;
            overflow-y: auto;
            transition: transform 0.25s ease-in-out;
        }
        .col-right.is-closed { transform: translateX(100%); }
        .trash-pane {
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            z-index: 1003;
            border-left: none;
            width: 285px;
            min-width: 285px;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease-in-out;
            transform: translateX(100%);
            box-shadow: -4px 0 24px rgba(0,0,0,0.4);
        }
        .trash-pane.is-open { transform: translateX(0); }
        .util-section { display: flex; flex-direction: column; gap: 8px; }
        .util-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 800;
            margin-bottom: 4px;
        }
        .util-btn {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }
        .util-btn:hover { background: var(--surface-hover); }

	/* 🎯 [디테일 교정] 우측 패널 메뉴 아이콘 칼각 정렬 (삐뚤어짐 완벽 해결) */
        .util-btn i {
            width: 20px; /* 넉넉한 고정 상자 크기 */
            display: flex;
            justify-content: center; /* 상자 안에서 가로 중앙 정렬 */

            </button>
            <button class="util-btn" onclick="exportHTML();">
                <i class="fa-brands fa-html5"></i> <span class="btn-text">HTML 저장</span>
            </button>
            <button class="util-btn" onclick="exportPDF();">
                <i class="fa-regular fa-file-pdf"></i> <span class="btn-text">PDF 저장</span>
            </button>
            <button class="util-btn" onclick="exportTXT();">
                <i class="fa-regular fa-file-lines"></i> <span class="btn-text">TXT 저장</span>
            </button>
            <button class="util-btn" onclick="exportJSON();">
                <i class="fa-solid fa-code"></i> <span class="btn-text">JSON 저장</span>
            </button>
            <button class="util-btn" onclick="handlePrint();">
                <i class="fa-solid fa-print"></i> <span class="btn-text">인쇄하기</span>
            </button>
        </div>

        <div class="util-section mt-auto">
            <div class="util-title">Data Management</div>
            <button class="util-btn" onclick="document.getElementById('import-file').click(); closeAllPanelsMobile();">
                <i class="fa-solid fa-file-import"></i> <span class="btn-text">불러오기</span>
            </button>
            <div style="display: flex; gap: 8px;">
                <button class="util-btn" style="flex: 1;" onclick="backupAllData();">
                    <i class="fa-solid fa-database"></i> <span class="btn-text">로컬 백업</span>
                </button>
                <button class="util-btn" style="flex: 1; justify-content: center;" onclick="toggleTrashPane();">
                    <i class="fa-solid fa-trash"></i> <span class="btn-text">휴지통</span>
                </button>
            </div>
            <input type="file" id="import-file" accept=".json, .txt, .html, .md, image/*, .pdf" style="display: none;" onchange="handleFileImport(event)">
        </div>

    <div class="trash-pane" id="trash-pane">
        <div class="nav-header">
            <button class="toggle-btn trash-hamburger" onclick="toggleTrashPane()">
                <i class="fa-solid fa-bars"></i>
            </button>            <button class="new-note-btn" onclick="emptyTrash()" style="color: var(--text-main); font-weight: 600;">
                <i class="fa-solid fa-trash-can"></i> <span class="btn-text">비우기 (30일 이후 영구 삭제)</span>
            </button>
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass" style="font-size: 12px;"></i>
                <input type="text" id="trash-search-input" placeholder="바탕 화면 휴지통 검색..." oninput="triggerTrashSearch()">
            </div>
        </div>
        <ul id="trash-list" class="memo-list"></ul>
    </div>

    <script>
        function generateSyncId() {
            return Date.now().toString(36) + Math.random().toString(36).substring(2);
        }

        function toggleMemoMenu(e) {
            e.stopPropagation();
            const currentWrap = e.target.closest('.memo-actions-wrap');
            const isCurrentlyOpen = currentWrap.classList.contains('is-menu-open');
            closeAllMemoMenus();
            if (!isCurrentlyOpen) currentWrap.classList.add('is-menu-open');
        }

        function closeAllMemoMenus() {
            document.querySelectorAll('.memo-actions-wrap.is-menu-open').forEach(wrap => {
                wrap.classList.remove('is-menu-open');
            });
        }

        // 🎯 [교정] 핀 아이콘 클릭 시 즉시 고정/해제 실행
        function handlePinClick(id, isPinned, e) {
            e.stopPropagation();
            // 복잡한 메뉴 체크 없이 바로 토글 함수 호출
            togglePin(id, e);
        }

        function toggleRightPane() {
	    if (document.activeElement) document.activeElement.blur(); // 👈 추가
            const rp = document.getElementById('col-right');
            const gb = document.getElementById('global-menu-btn');

            document.getElementById('trash-pane').classList.remove('is-open');

            if (rp.classList.contains('is-closed')) {
                rp.classList.remove('is-closed');
                gb.style.display = 'none';
                // [수정된 부분] 모바일에서 우측 패널 열 때 투명 방어막(오버레이) 켜기
                if (window.innerWidth <= 768) {
                    document.getElementById('mobile-overlay').classList.add('is-active');
                }
                history.pushState({ panel: 'right' }, ''); // 🎯 PC 환경도 브라우저 뒤로가기 기록을 남깁니다!
            } else {
                rp.classList.add('is-closed');
                gb.style.display = 'flex';
                // [수정된 부분] 모바일에서 우측 패널 닫을 때 방어막 끄기
                if (window.innerWidth <= 768) document.getElementById('mobile-overlay').classList.remove('is-active');
            }
        }

        function toggleTrashPane() {
	    if (document.activeElement) document.activeElement.blur(); // 👈 추가
            const tp = document.getElementById('trash-pane');
            if (tp.classList.contains('is-open')) {
                tp.classList.remove('is-open');
                // [수정된 부분] 휴지통만 닫았는데 우측 패널마저 닫혀있다면 방어막 끄기
                if (window.innerWidth <= 768 && document.getElementById('col-right').classList.contains('is-closed')) {
                    document.getElementById('mobile-overlay').classList.remove('is-active');
                }
            } else {
                tp.classList.add('is-open');
                loadTrashList(); 
                // [수정된 부분] 모바일에서 휴지통 열 때 투명 방어막(오버레이) 켜기
                // [수정된 부분] 모바일에서 휴지통 열 때 투명 방어막(오버레이) 켜기
                if (window.innerWidth <= 768) {
                    document.getElementById('mobile-overlay').classList.add('is-active');
                }
                history.pushState({ panel: 'trash' }, ''); // 🎯 PC 환경도 브라우저 뒤로가기 기록을 남깁니다!
            }
        }

        // [추가] 다중 선택 모드 방어막 (캡처링 단계)
        // 화면의 다른 버튼이 눌리기 직전에 가장 먼저 가로채서 이벤트를 소멸시킵니다.
        document.addEventListener('click', e => {
            const inMainMulti = isMultiSelectMode || selectedMemos.size > 1;
            const inTrashMulti = isTrashMultiSelectMode || selectedTrashMemos.size > 1;
            
            // 다중 선택 중일 때, 리스트나 메뉴가 아닌 다른 곳(새 노트, 검색창, 중앙 에디터 등)을 클릭했다면
            if ((inMainMulti || inTrashMulti) && !e.target.closest('.memo-item') && !e.target.closest('.memo-actions-wrap')) {
                e.preventDefault();  // 원래 하려던 동작(텍스트박스 포커스 등) 취소
                e.stopPropagation(); // 클릭 이벤트가 버튼(새 노트 작성 등)으로 전달되는 것을 완벽히 차단
                
                if (inMainMulti) {
                    isMultiSelectMode = false;
                    selectedMemos.clear();
                    if (currentMemoId) selectedMemos.add(currentMemoId);
                    loadMemoList(false);
                }
                if (inTrashMulti) {
                    isTrashMultiSelectMode = false;
                    selectedTrashMemos.clear();
                    loadTrashList();
                }
            }
        }, true); // <-- true: 캡처링 활성화. 자바스크립트에서 이벤트를 가장 먼저 낚아챕니다.

        // 기존 화면 닫기 및 메뉴 닫기용 클릭 이벤트 (버블링 단계)
        document.addEventListener('click', e => {
            closeAllMemoMenus();
            // 🎯 파일 관리창 팝업 메뉴 닫기 로직
            const fmItemMenu = document.getElementById('fm-item-menu');
            const fmGlobalMenu = document.getElementById('fm-global-menu');
            if (fmItemMenu) fmItemMenu.classList.remove('is-active');
            if (fmGlobalMenu) fmGlobalMenu.classList.remove('is-active');
            const rp = document.getElementById('col-right');
            const tp = document.getElementById('trash-pane');
            const gb = document.getElementById('global-menu-btn');
            
            if (!rp.classList.contains('is-closed') && !rp.contains(e.target) && !tp.contains(e.target) && !gb.contains(e.target)) {
                rp.classList.add('is-closed');
                gb.style.display = 'flex';
            }
            if (tp.classList.contains('is-open') && !tp.contains(e.target) && !rp.contains(e.target) && !gb.contains(e.target)) {
                tp.classList.remove('is-open');
            }
        });

        hljs.configure({ languages:['javascript', 'python', 'html', 'css', 'typescript', 'bash'] });

        const Link = Quill.import('formats/link');
        class CustomLink extends Link {
            static create(v) {
                return super.create(v && !/^https?:\/\//i.test(v) && !/^mailto:/i.test(v) ? 'http://' + v : v);
            }
        }
        Quill.register(CustomLink, true);

        const BlockEmbed = Quill.import('blots/block/embed');
        class DividerBlot extends BlockEmbed { }
        DividerBlot.blotName = 'divider';
        DividerBlot.tagName = 'hr';
        Quill.register(DividerBlot);

        // 🎯 [추가] 노션 스타일의 '링크 카드' 커스텀 블록 등록
        class LinkCardBlot extends BlockEmbed {
            static create(data) {
                const node = super.create();
                node.setAttribute('contenteditable', 'false'); // 카드 안쪽은 타이핑 방지
                node.dataset.url = data.url;
                node.dataset.title = data.title;
                node.dataset.description = data.description;
                node.dataset.image = data.image;

                // 클릭 시 새 창으로 열리게 설정
                node.addEventListener('click', () => window.open(data.url, '_blank'));

                // 카드의 예쁜 CSS 디자인 (다크 테마에 찰떡같이 맞춤)
                node.style.cssText = 'display: flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin: 16px 0; background: var(--surface); cursor: pointer; transition: background 0.2s;';
                node.onmouseover = () => node.style.background = 'var(--surface-hover)';
                node.onmouseout = () => node.style.background = 'var(--surface)';

                let imgHTML = data.image ? `<img src="${data.image}" style="width: 75px; height: 75px; object-fit: cover; border-radius: 6px; margin: 0 16px 0 0; flex-shrink: 0; display: block;" alt="thumbnail">` : '';

                node.innerHTML = `
                    ${imgHTML}
                    <div style="flex: 1; min-width: 0;">
                        <div style="font-size: 15px; font-weight: 600; color: var(--text-main); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${data.title}</div>
                        <div style="font-size: 13px; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4;">${data.description}</div>
                        <div style="font-size: 11px; color: var(--accent); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${data.url}</div>
                    </div>
                `;
                return node;
            }

            static value(node) {
                return {
                    url: node.dataset.url,
                    title: node.dataset.title,
                    description: node.dataset.description,
                    image: node.dataset.image
                };
            }
        }
        LinkCardBlot.blotName = 'link-card';
        LinkCardBlot.tagName = 'div';
        LinkCardBlot.className = 'ql-link-card';
        Quill.register(LinkCardBlot);

	// 🎯 [사용자님 통찰력 적용] 취소선 단위를 문단이 아닌 일반 글자(Inline)로 변경!
        const Parchment = Quill.import('parchment');
        const StrikeLineStyle = new Parchment.Attributor.Class('strike-line', 'ql-strike-line', {
            scope: Parchment.Scope.INLINE // 👈 BLOCK에서 INLINE으로 수정!
        });
        Quill.register(StrikeLineStyle, true);

	// [2] 에디터 본체 설정 (조절 기능 포함)
        const quill = new Quill('#editor', {
            theme: 'snow',
            bounds: '.col-center',
            placeholder: '여기에 지식을 기록하세요...',
            modules: {
                syntax: true,
		history: { delay: 1000, maxStack: 100, userOnly: true }, // 🎯 1. 에디터 뇌(기억력) 활성화
                toolbar: {
                    container: [
			['undo', 'redo'], // 🎯 2. 맨 앞줄에 취소/복구 버튼 신설
                        // 1. 제목 그룹
                        [{ 'header':[1, 2, 3, false] }],
                        // 2. 글자 서식 그룹
                        ['bold', 'italic', 'underline', 'strike'],
                        // 3. 블록 서식 그룹 (인용구, 코드, 구분선, 완료선 추가!)
                        ['blockquote', 'code-block', 'divider', 'strike-line'],
                        // 4. 리스트 그룹
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                        // 5. 서식 지우기
                        ['clean'],
                        // 6. 미디어 삽입 그룹 (링크, 이미지를 가장 오른쪽으로 독립!)
                        ['link', 'image'] 
                    ],
                    handlers: {
			// 🎯 3. 취소/복구 버튼 눌렀을 때 작동할 명령 연결
                        'undo': function() { this.quill.history.undo(); },
                        'redo': function() { this.quill.history.redo(); },
                        'image': function() {
                            const input = document.createElement('input');
                            input.setAttribute('type', 'file');
                            input.setAttribute('accept', 'image/*');
                            input.click();
                            input.onchange = () => {
                                if (input.files[0]) handleImageFiles([input.files[0]]);
                            };
                        },

			// 🎯 [완벽 교정] 줄 전체 글자(Inline)에 취소선을 긋고 투명 방어막 전개
                        'strike-line': function() {
                            const range = this.quill.getSelection();
                            if (!range) return;

                            // 1. 현재 커서가 있는 '줄'의 시작점과 글자수를 알아냅니다.
                            const [line, offset] = this.quill.getLine(range.index);
                            const lineIndex = this.quill.getIndex(line);
                            const lineLength = line.length() - 1; // 엔터 제외

                            // 2. 현재 줄의 첫 글자가 속성을 가졌는지 확인
                            const isStruck = lineLength === 0 ? this.quill.getFormat(range)['strike-line'] : this.quill.getFormat(lineIndex, 1)['strike-line'];

                            if (isStruck) {
                                // 끄기: 줄 전체 글자의 취소선 속성 제거
                                if (lineLength > 0) this.quill.formatText(lineIndex, lineLength, 'strike-line', false, Quill.sources.USER);
                                this.quill.format('strike-line', false, Quill.sources.USER);
                            } else {
                                // 켜기:
                                if (lineLength > 0) {
                                    // 1) 글자가 있으면 줄 전체 글자에 속성을 쫙 바르고
                                    this.quill.formatText(lineIndex, lineLength, 'strike-line', true, Quill.sources.USER);
                                    
                                    // 2) 🎯 사용자님의 K-마크다운 방어막 전개!
                                    const lineEnd = lineIndex + lineLength;
                                    this.quill.insertText(lineEnd, '\u200B', Quill.sources.USER); // 끝에 투명 문자 삽입
                                    this.quill.setSelection(lineEnd + 1, Quill.sources.SILENT);   // 그 뒤로 커서 피신
                                    this.quill.format('strike-line', false, Quill.sources.USER);  // 서식 강제 해제!
                                } else {
                                    // 빈 줄이면 그냥 커서에만 켬
                                    this.quill.format('strike-line', true, Quill.sources.USER);
                                }
                            }
                        },

                        'divider': function() {
                            const range = this.quill.getSelection(true);
                            this.quill.insertEmbed(range.index, 'divider', true, Quill.sources.USER);
                            this.quill.setSelection(range.index + 1, Quill.sources.SILENT);
                            this.quill.removeFormat(range.index + 1, 1, Quill.sources.USER);
                        }
                    }
                }
            }
        });
	
	// 🎯 [Pro 통합 버전] 마크다운 자동 변환 엔진 (밑줄, 취소선, 코드블록 추가)
	quill.on('text-change', function(delta, oldDelta, source) {
	    if (source !== 'user') return;

	    const ops = delta.ops;
	    if (!ops || ops.length < 2) return;
	    const lastOp = ops[ops.length - 1];

	    if (lastOp.insert === ' ') {
	        const range = quill.getSelection();
	        if (!range) return;

	        const [line, offset] = quill.getLine(range.index);
	        if (!line || !line.domNode) return;
        
	        const text = line.domNode.textContent.substring(0, offset);
	        const lineStart = quill.getIndex(line);

	        // --- [A. 블록 포맷 감지: H1-H3, 인용구, 리스트, 구분선, 코드블록] ---
	        // 정규식 매칭 ( `{3} 즉, 백틱 3개 조건 추가)
	        const blockMatch = text.match(/^(#{1,3}|>|\*|-|1\.|\-{3}|`{3})\s$/);
        
	        if (blockMatch) {
	            const prefix = blockMatch[1];
	            const deleteLength = prefix.length + 1; 
	            const formatIndex = range.index - deleteLength;

	            quill.deleteText(formatIndex, deleteLength, Quill.sources.USER);

	            if (prefix === '#') quill.formatLine(formatIndex, 1, 'header', 1, Quill.sources.USER);
	            else if (prefix === '##') quill.formatLine(formatIndex, 1, 'header', 2, Quill.sources.USER);
	            else if (prefix === '###') quill.formatLine(formatIndex, 1, 'header', 3, Quill.sources.USER);
	            else if (prefix === '>') quill.formatLine(formatIndex, 1, 'blockquote', true, Quill.sources.USER);
	            else if (prefix === '*' || prefix === '-') quill.formatLine(formatIndex, 1, 'list', 'bullet', Quill.sources.USER);
	            else if (prefix === '1.') quill.formatLine(formatIndex, 1, 'list', 'ordered', Quill.sources.USER);
	            else if (prefix === '---') {
	                quill.insertEmbed(formatIndex, 'divider', true, Quill.sources.USER);
	                quill.setSelection(formatIndex + 1, Quill.sources.SILENT);
	                quill.removeFormat(formatIndex + 1, 1, Quill.sources.USER);
	            }
	            // 🎯 코드블록 추가
	            else if (prefix === '```') quill.formatLine(formatIndex, 1, 'code-block', true, Quill.sources.USER);
            
	            return; 
	        }

	        // --- [B. 인라인 포맷 감지: 굵게, 밑줄, 취소선, 기울임] ---
	        const fullText = quill.getText(lineStart, offset);

	        // 🎯 [K-마크다운 하이브리드 엔진] 스페이스 역주행 및 커서 튕김 완벽 해결 버전
	        function applyInlineFormat(matchText, content, formatName) {
	            const start = lineStart + offset - matchText.length;
	            const hasKorean = /[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(content);

	            // 비동기 처리(10ms)를 통해 브라우저가 한글 조합을 끝낼 시간을 줍니다.
	            setTimeout(() => {
	                // 1. 기존 마크다운 기호 및 트리거 공백 삭제
	                quill.deleteText(start, matchText.length, Quill.sources.USER);
                
	                // 2. 본문 삽입 및 서식 적용
	                quill.insertText(start, content, { [formatName]: true }, Quill.sources.USER);

	                if (hasKorean) {
	                    // [한국어 전용 로직]
	                    // 역주행 방지용 투명 방어막(\u200B) 삽입 (서식은 끔)
	                    quill.insertText(start + content.length, '\u200B', { [formatName]: false }, Quill.sources.USER);
                    
	                    // 커서를 투명 방어막 바로 뒤로 이동
	                    const newCursorPos = start + content.length + 1;
	                    quill.setSelection(newCursorPos, Quill.sources.SILENT);
                    
	                    // 다음 입력(조사 등)에 서식이 전염되지 않도록 강제 해제
	                    quill.format(formatName, false, Quill.sources.USER);
	                } else {
	                    // [영어/글로벌 로직] 상용 앱 표준(공백 한 칸 유지)
	                    quill.insertText(start + content.length, ' ', { [formatName]: false }, Quill.sources.USER);
	                    const newCursorPos = start + content.length + 1;
	                    quill.setSelection(newCursorPos, Quill.sources.SILENT);
	                }
	            }, 10);
	        }

	        // 1. 굵게 (**내용**)
	        const boldMatch = fullText.match(/\*\*(.+?)\*\* $/);
	        if (boldMatch) { applyInlineFormat(boldMatch[0], boldMatch[1], 'bold'); return; }

	        // 2. 취소선 (~~내용~~)
	        const strikeMatch = fullText.match(/~~(.+?)~~ $/);
	        if (strikeMatch) { applyInlineFormat(strikeMatch[0], strikeMatch[1], 'strike'); return; }

	        // 3. 밑줄 (__내용__)
	        const underMatch = fullText.match(/__(.+?)__ $/);
	        if (underMatch) { applyInlineFormat(underMatch[0], underMatch[1], 'underline'); return; }

	        // 4. 기울임 (*내용* 또는 _내용_)
	        const italicMatch = fullText.match(/(\*|_)(.+?)\1 $/);
	        if (italicMatch) { applyInlineFormat(italicMatch[0], italicMatch[2], 'italic'); return; }
	    }
	});

        async function initFileSystem() {

                            if (item.isSystem === 'security' && item.syncId !== 'sys_security') { item.syncId = 'sys_security'; needsUpdate = true; }
                            if (item.isSystem === 'trash' && item.syncId !== 'sys_trash') { item.syncId = 'sys_trash'; needsUpdate = true; }
                            if (item.isSystem === 'backup' && item.syncId !== 'sys_backup') { item.syncId = 'sys_backup'; needsUpdate = true; }
                            
                            if (needsUpdate) store.put(item); // 수정한 내용은 즉시 DB에 덮어쓰기
                        }
                    });
                    
                    // 1. 고정 시스템 폴더 존재 여부 확인

                    if (desktopFolder) globalDesktopFolderId = desktopFolder.id;

        function healDatabase(callback) {
            if (!db) { if (callback) callback(); return; }
            
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');
            
            store.getAll().onsuccess = e => {
                const allData = e.target.result;
                let needsUpdate = false;
                
                // 1. 4대장(시스템 폴더) 종류별로 줄 세우기
                const sysGroups = { desktop: [], security: [], trash: [], backup: [] };
                allData.forEach(m => {
                    if (m.isSystem && sysGroups[m.isSystem]) sysGroups[m.isSystem].push(m);
                });

                const dupToMasterMap = new Map();
                const duplicateIds = new Set();
                const validIds = new Set();

                // 2. 중복 폴더 색출 및 파괴
                Object.keys(sysGroups).forEach(sysType => {
                    const group = sysGroups[sysType];
                    if (group.length > 1) { 
                        group.sort((a, b) => a.id - b.id); // 가장 먼저 만들어진 '진짜 원본'을 찾음
                        const masterId = group[0].id;
                        
                        // 🚀 [신규: 2차 방어막] 가짜 폴더를 폭파시켰을 때, 앱의 '글로벌 기억 장치'가 가짜를 가리키고 있다면 즉시 진짜 원본으로 교정!
                        if (sysType === 'desktop') globalDesktopFolderId = masterId;
                        if (sysType === 'security') globalSecurityFolderId = masterId;
                        if (sysType === 'trash') globalTrashFolderId = masterId;
                        if (sysType === 'backup') globalBackupFolderId = masterId;

                        for (let i = 1; i < group.length; i++) {
                            const dupId = group[i].id;
                            dupToMasterMap.set(dupId, masterId); // 가짜 ID가 진짜 ID를 찾아갈 수 있게 지도 작성
                            duplicateIds.add(dupId);
                            store.delete(dupId); // 가짜 폴더 껍데기 통쾌하게 폭파!
                            needsUpdate = true;
                        }
                    }
                });

                // 3. 살아남은 정상적인 ID 목록 작성
                allData.forEach(m => {
                    if (!duplicateIds.has(m.id)) validIds.add(m.id);
                });

                // 4. 가짜 폴더에 갇혀있던 파일이나 부모를 잃어버린 파일 구출 작전
                allData.forEach(m => {
                    if (duplicateIds.has(m.id)) return; // 폭파된 가짜 폴더는 무시

                    let currentParent = m.parentId;
                    let changed = false;

                    // 작전 A: 가짜 폴더에 들어있던 파일들을 진짜 폴더(원본)로 무사히 이동

                    }

                    }

		let syncStartTime = 0;

		// 🎯 [수정] 듀얼 상태점(에디터/파일관리창) 동시 제어 및 '미동기' 텍스트 적용
        function updateUIState(state) {
            if (statusTextTimer) {
                clearTimeout(statusTextTimer);
                statusTextTimer = null;
            }
            const statusDots = document.querySelectorAll('.status-dot');
            const statusTexts = document.querySelectorAll('.status-text');

                applyState('unsaved pulse-fast', 'saving', '1');
            } else if (state === 'saved') {
                const elapsed = Date.now() - typingStartTime;
                const remain = typingStartTime > 0 ? Math.max(0, 2000 - elapsed) : 0;
                statusTextTimer = setTimeout(() => {
                    if (saveTimer || isSaving) return;

                    applyState('saved pulse-slow', 'saved', '1');
                    statusTextTimer = setTimeout(() => {

            } else if (state === 'syncing') {

            } else if (state === 'synced') {
                const elapsed = Date.now() - syncStartTime;

            } else if (state === 'sync-error') {
                applyState('unsaved', 'sync error', '1');
            } else {
                typingStartTime = 0;
                syncStartTime = 0;
                applyState('saved', 'default', '1');
            }
        }

        // [기존 유지] 인용구/코드블록 탈출 (공백 추가 로직)
        function escapeFormattingBlock() {
            const range = quill.getSelection(true);
            if (!range) return false;
            const formats = quill.getFormat(range.index);
            if (formats.blockquote || formats['code-block']) {
                let [line, offset] = quill.getLine(range.index);
                while (line && line.next) {
                    let nextIdx = quill.getIndex(line.next);
                    let nextFmt = quill.getFormat(nextIdx);
                    if (!nextFmt.blockquote && !nextFmt['code-block']) break;
                    line = line.next;
                }
                if (line && line.next) {
                    quill.setSelection(quill.getIndex(line.next), 0, Quill.sources.USER);
                } else {
                    let escapeIndex = quill.getIndex(line) + line.length();
                    quill.insertText(escapeIndex, '\n', Quill.sources.USER);
                    quill.setSelection(escapeIndex, Quill.sources.SILENT);
                    quill.removeFormat(escapeIndex, 1);
                }
                return true;
            }
            return false;
        }

	// ✅ 추가할 함수: 동기화되지 않은 노트(ns) 개수 계산
	function updateUnsyncedCount() {
	    if (!db) return;
	    const lastSync = parseInt(localStorage.getItem('zen_last_sync_time') || '0', 10);
    
	    db.transaction(['memos'], 'readonly').objectStore('memos').getAll().onsuccess = e => {
		const memos = e.target.result;
		const unsyncedCount = memos.filter(m => m.updatedAt > lastSync).length;
        
		// 🎯 [수정] 모든 상태 텍스트에 '미동기: X' 적용
		const statusTexts = document.querySelectorAll('.status-text');
		statusTexts.forEach(t => {
		    t.dataset.nsText = `미동기: ${unsyncedCount}`;
		    if (t.innerText.startsWith('미동기:') || t.innerText.startsWith('ns:') || t.innerText === 'offline') {
                        t.innerText = `미동기: ${unsyncedCount}`;
                        t.style.opacity = '1';
                    }
        	});
	    };
	}

	// 🎯 [보안] 전역 변수: 암호화 엔진 동작을 위한 휘발성 열쇠 및 상태 플래그
        let currentSecKey = null; 
        let isEditingSecureMemo = false;

        // 🎯 헬퍼 함수: DB에서 특정 메모의 parentId를 꺼내옵니다.
        function getMemoParentIdDB(id) {
            return new Promise(resolve => {
                db.transaction(['memos'], 'readonly').objectStore('memos').get(id).onsuccess = e => {
                    resolve(e.target.result ? e.target.result.parentId : null);
                };
            });
        }

        // 🎯 헬퍼 함수: 특정 폴더가 '보안 폴더' 소속인지 족보를 무한 추적하여 검증합니다.
        async function checkIsUnderSecurity(folderId) {
            if (!folderId) return false;
            if (folderId === globalSecurityFolderId) return true;
            return new Promise(resolve => {
                db.transaction(['memos'], 'readonly').objectStore('memos').getAll().onsuccess = e => {
                    const allData = e.target.result;
                    const fMap = new Map();
                    allData.forEach(m => { if (m.type === 'folder') fMap.set(m.id, m); });
                    let curr = folderId;
                    while (curr) {
                        if (curr === globalSecurityFolderId) { resolve(true); return; }
                        const parent = fMap.get(curr);
                        if (!parent) break;
                        curr = parent.parentId;
                    }
                    resolve(false);
                };
            });
        }

        async function executeSave() {
            if (isSaving || isLoading) {
                pendingSave = true;
                return;
            } 
            const title = document.getElementById('memo-title-input').value.trim() || '제목 없는 노트';
            const content = quill.root.innerHTML, plainText = quill.getText();
            const hasNoText = plainText.trim() === '';
            const hasNoImage = !content.includes('<img');

            // 신규 노트인데 내용이 아무것도 없으면 저장하지 않음
            if (!currentMemoId && !document.getElementById('memo-title-input').value && hasNoText && hasNoImage) {
                updateUIState('saved');
                saveTimer = null;
                return;
            }

            isSaving = true;
            updateUIState('saving');

            // 🎯 1. 현재 편집 중인 노트가 암호화 대상(보안 폴더 소속)인지 검증합니다.
            const targetParentId = currentMemoId ? (await getMemoParentIdDB(currentMemoId)) : targetNewMemoFolderId;
            const isSecure = await checkIsUnderSecurity(targetParentId);

            let finalContent = content;
            let finalPlainText = plainText;

            // 🎯 2. 보안 구역일 경우 암호화 수행
            if (isSecure) {
                if (!currentSecKey) {
                    showToast("보안 세션이 만료되어 변경 사항을 저장할 수 없습니다.");
                    isSaving = false;
                    updateUIState('saved');
                    return; // 열쇠가 없으면 평문 유출 방지를 위해 저장을 차단
                }
                // 본문과 순수 텍스트를 모두 AES-GCM 외계어로 변환
                finalContent = await encryptData(content, currentSecKey);
                finalPlainText = await encryptData(plainText, currentSecKey);
            }

            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');

            if (currentMemoId) {
                // 🎯 기존 노트 수정 시
                store.get(currentMemoId).onsuccess = e => {
                    const m = e.target.result;
                    if (m) {
                        m.title = title; // 📌 제목은 검색을 위해 무조건 평문 유지!
                        m.content = finalContent;
                        m.plainText = finalPlainText;
                        m.updatedAt = Date.now();
                        store.put(m);
                    }
                };
            } else {
                // 🎯 신규 노트 작성 시
                const memoData = {
                    title, content: finalContent, plainText: finalPlainText,
                    updatedAt: Date.now(),
                    isDeleted: false,
                    type: 'file',
                    syncId: generateSyncId(),
                    parentId: targetNewMemoFolderId !== null ? targetNewMemoFolderId : globalDesktopFolderId
                };
                store.add(memoData).onsuccess = e => {
                    currentMemoId = e.target.result;
                };
            }

            tx.oncomplete = () => {
                isSaving = false;
                saveTimer = null;
                updateUIState('saved');
                loadMemoList(true);
                updateUnsyncedCount();
                if (pendingSave) {
                    pendingSave = false;
                    executeSave();
                }
            };
        }

        function forceSaveImmediate() {
            if (saveTimer) {
                clearTimeout(saveTimer);
                executeSave();
            }
        }

        async function syncDataToCloud() {
            if (!gapiInited || !gapi.client || gapi.client.getToken() === null) return;

            db.transaction(['memos'], 'readonly').objectStore('memos').getAll().onsuccess = async e => {
                const allData = e.target.result;
                
                if (allData.length === 0 && !hasLoadedFromCloud) {
                    console.warn(">>> [보호장치] 로컬이 비어있어 클라우드에 빈 파일을 올리지 않습니다.");
                    return;
                }

                const cloudOptimizedData = allData.map(m => {
                    let clone = Object.assign({}, m);
                    if (clone.content) clone.content = clone.content.replace(/src="data:image[^"]+"/gi, 'src="" data-local-image="true"');
                    return clone;
                });

                try {
                    const token = gapi.client.getToken().access_token;
                    const res = await gapi.client.drive.files.list({
                        q: "name = 'ZenNotes_Backup.json' and trashed = false",
                        fields: 'files(id)'
                    });

                    const file = res.result.files[0];

            const content = JSON.stringify({ type: 'ZenBackup', data: cloudOptimizedData });

                    updateUIState('syncing');

                    if (file) {                        
                        await fetch(`https://www.googleapis.com/upload/drive/v3/files/${file.id}?uploadType=media`, {
                            method: 'PATCH',
                            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                            body: content
                        });
                    } else {
                        const metadata = { name: 'ZenNotes_Backup.json', mimeType: 'application/json', parents: ['root'] };
                        const boundary = '-------314159265358979323846';
                        const delimiter = `\r\n--${boundary}\r\n`;
                        const close_delim = `\r\n--${boundary}--`;

                        const body = delimiter +
                            'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
                            JSON.stringify(metadata) +
                            delimiter +
                            'Content-Type: application/json\r\n\r\n' +
                            content +
                            close_delim;

                        await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': `multipart/related; boundary=${boundary}`
                            },
                            body: body
                        });
                    }

					console.log("✅ 클라우드 동기화 완료");
					localStorage.setItem('zen_last_sync_time', Date.now()); // 👈 현재 시간을 '마지막 동기화 시간'으로 기록
					updateUnsyncedCount(); // ns: 0 으로 즉시 초기화
					updateUIState('synced'); 
					setTimeout(() => {
						if (gapi.client && gapi.client.getToken() !== null) {
							gapi.client.setToken(null); 
							localStorage.removeItem('zen_logged_in'); 
							checkAuthState(); 
						}
					}, 10000); // 10초 뒤 조용히 권한 해제
                } catch (err) {
                    console.error("❌ 전송 실패:", err);
                    updateUIState('sync-error'); 
                }
            };
        }

        window.addEventListener('beforeunload', () => {
            purgeEmptyMemos(); // 브라우저 종료 전 쓰레기 메모 청소
            forceSaveImmediate();
