	function createNewMemo(folderId = null) {
            forceSaveImmediate(); 
            targetNewMemoFolderId = folderId; // 🎯 새 노트가 저장될 특정 폴더 위치 기억
            
            const previousMemoId = currentMemoId; 
            if (previousMemoId) purgeMemoIfEmpty(previousMemoId);
            
            currentMemoId = null;
            selectedMemos.clear();
            lastSelectedId = null;
            document.getElementById('memo-title-input').value = '';
            document.title = "새 노트";
            
            isLoading = true; 
            quill.root.innerHTML = '';
            updateUIState('idle'); 
            
            loadMemoList(false); 
            closeAllPanelsMobile();
            
            // 🎯 [추가] 새 노트를 열 때 기존 노트의 Ctrl+Z 수정 기록을 완벽히 지움
            setTimeout(() => quill.history.clear(), 10);
            setTimeout(() => { isLoading = false; }, 10); 
        }

        function loadMemoList(queryDB = true) {
            const query = document.getElementById('list-search-input').value.toLowerCase();
            const list = document.getElementById('memo-list');
            const savedScroll = list.scrollTop;
            
        if (queryDB) {
                const tx = db.transaction(['memos'], 'readonly');
                
                tx.objectStore('memos').getAll().onsuccess = e => {
                    const allData = e.target.result;
                    let pinnedMemos = [], normalMemos = [];
                    
                    // 🎯 폴더 가계도 파악 (바탕화면 아래에 있는 모든 하위 폴더 찾기)
                    const folderMap = new Map();
                    allData.forEach(m => { if (m.type === 'folder') folderMap.set(m.id, m); });
                    
                    // 🎯 유령 파일 퇴마: 조상 폴더가 휴지통에 가 있는지 꼼꼼히 확인
                    function isUnderDesktop(parentId) {
                        let curr = parentId;
                        while (curr) {
                            if (curr === globalDesktopFolderId) return true;
                            const parentFolder = folderMap.get(curr);
                            // 🎯 조상 폴더가 없거나, 지워졌거나, 휴지통이면 바탕화면 출입 금지!
                            if (!parentFolder || parentFolder.isDeleted || parentFolder.isSystem === 'trash') return false;
                            curr = parentFolder.parentId;
                        }
                        return false;
                    }

                    allData.forEach(m => {
                        // 🎯 바탕화면 소속(직접+간접) 파일만 싹 다 평탄화(Flatten)해서 가져옴
                        if (m.type === 'folder' || m.isDeleted || m.isPermanentlyDeleted) return;
                        if (!isUnderDesktop(m.parentId)) return;

                        const matchQuery = m.title.toLowerCase().includes(query) || (m.plainText && m.plainText.toLowerCase().includes(query));
                        if (matchQuery) {
                            if (m.pinnedAt) pinnedMemos.push(m);
                            else normalMemos.push(m);
                        }
                    });

                    // 🎯 최신순 정렬
                    pinnedMemos.sort((a, b) => a.pinnedAt - b.pinnedAt);
                    normalMemos.sort((a, b) => b.updatedAt - a.updatedAt); 
                    
                    displayedMemos = [...pinnedMemos, ...normalMemos];
                    list.innerHTML = '';
                    displayedMemos.forEach(m => list.appendChild(createMemoElement(m)));
                    list.scrollTop = savedScroll; 
                };
            } else {
                // 🎯 [버그 복구] DB 조회 없이 UI(체크박스)만 즉시 새로고침하는 기능 부활!
                list.innerHTML = '';
                displayedMemos.forEach(m => list.appendChild(createMemoElement(m)));
                list.scrollTop = savedScroll;
            }
        }

        function loadTrashList() {
            const query = document.getElementById('trash-search-input').value.toLowerCase();
            const list = document.getElementById('trash-list');
            const savedScroll = list.scrollTop;
            
            const tx = db.transaction(['memos'], 'readonly');
            displayedTrashMemos = [];
            
            tx.objectStore('memos').index('updatedAt').openCursor(null, 'prev').onsuccess = e => {
                const cursor = e.target.result;
                if (cursor) {
                    const m = cursor.value;
                    
                    // 🎯 [수정] 삭제된 항목 중 시스템이 생성한 '폴더'는 휴지통에 표시하지 않음
                    const isFile = m.type === 'file' || m.type === undefined;
                    const matchQuery = m.title.toLowerCase().includes(query) || (m.plainText && m.plainText.toLowerCase().includes(query));

                    if (m.isDeleted && !m.isPermanentlyDeleted && isFile && matchQuery) {
                        displayedTrashMemos.push(m);
                    }
                    cursor.continue();
                }
            };
            
            tx.oncomplete = () => { 
                list.innerHTML = '';
                displayedTrashMemos.forEach(m => list.appendChild(createTrashElement(m)));
                list.scrollTop = savedScroll; 
            };
        }

        // 🎯 [수정] 날짜 형식 변경 (줄 맞춤을 위해 0을 채워 넣음)
        function formatDateTime(timestamp) {
            const d = new Date(timestamp);
            const yr = d.getFullYear();
            const mo = String(d.getMonth() + 1).padStart(2, '0');
            const da = String(d.getDate()).padStart(2, '0');
            const hr = String(d.getHours()).padStart(2, '0');
            const mi = String(d.getMinutes()).padStart(2, '0');
            return `${yr}.${mo}.${da}. ${hr}:${mi}`;
        }

        function createMemoElement(memo) {
            const li = document.createElement('li');
            
            const isActive = isMultiSelectMode ? selectedMemos.has(memo.id) : (currentMemoId === memo.id || selectedMemos.has(memo.id));
            li.className = `memo-item ${isActive ? 'active' : ''}`;

            li.innerHTML = `
                <div class="memo-info">
                    <span class="memo-title">${memo.title}</span>
                    <span class="memo-date">${formatDateTime(memo.updatedAt)}</span>
                </div>
                <div class="memo-actions-wrap ${memo.pinnedAt ? 'is-pinned-state' : ''}">
                    <div class="memo-actions">
                        <i class="fa-solid fa-thumbtack btn-pin ${memo.pinnedAt ? 'is-pinned' : ''}" onclick="handlePinClick(${memo.id}, ${!!memo.pinnedAt}, event)"></i>
                        <i class="fa-solid fa-trash-can btn-delete" onclick="deleteMemo(${memo.id}, event)"></i>
                    </div>
                    <i class="fa-solid fa-ellipsis-vertical btn-more mobile-only" onclick="toggleMemoMenu(event)"></i>
                </div>`;

            li.addEventListener('mousedown', e => startPress(e, memo.id, false));
            li.addEventListener('touchstart', e => startPress(e, memo.id, false), {passive: true});
            li.addEventListener('mouseup', cancelPress);
            li.addEventListener('mouseleave', cancelPress);
            li.addEventListener('touchend', cancelPress);
            li.addEventListener('touchmove', cancelPress, {passive: true});

            li.onclick = e => {
                if (document.querySelector('.memo-actions-wrap.is-menu-open')) {
                    closeAllMemoMenus();
                    return;
                }
                if (e.target.closest('.memo-actions-wrap')) return; 

                if (isPressTriggered) {
                    isPressTriggered = false;
                    return;
                }

                const isCtrl = e.ctrlKey || e.metaKey;
                const isShift = e.shiftKey;

                if (isMultiSelectMode && !isCtrl && !isShift) {
                    if (selectedMemos.has(memo.id)) {
                        selectedMemos.delete(memo.id);
                        if (selectedMemos.size === 0) isMultiSelectMode = false; 
                    } else {
                        selectedMemos.add(memo.id);
                        lastSelectedId = memo.id;
                    }
                    loadMemoList(false);
                    return; 
                }

                forceSaveImmediate();
                
                if (isShift && lastSelectedId !== null) {
                    const cIdx = displayedMemos.findIndex(m => m.id === memo.id);
                    const lIdx = displayedMemos.findIndex(m => m.id === lastSelectedId);
                    
                    if (cIdx !== -1 && lIdx !== -1) {
                        const start = Math.min(cIdx, lIdx);
                        const end = Math.max(cIdx, lIdx);
                        if (!isCtrl) selectedMemos.clear();
                        for (let i = start; i <= end; i++) selectedMemos.add(displayedMemos[i].id);
                    }
                    loadMemoList(false);
                } else if (isCtrl) {
                    if (selectedMemos.has(memo.id)) selectedMemos.delete(memo.id);
                    else selectedMemos.add(memo.id);
                    lastSelectedId = memo.id;
                    loadMemoList(false);
                } else {
                    selectedMemos.clear();
                    selectedMemos.add(memo.id);
                    lastSelectedId = memo.id;
                    isMultiSelectMode = false; 
                    loadMemo(memo.id);
                }
            };
            return li;

        }

        function createTrashElement(memo) {
            const li = document.createElement('li');
            li.className = `memo-item ${selectedTrashMemos.has(memo.id) ? 'active' : ''}`;
            li.innerHTML = `
                <div class="memo-info">
                    <span class="memo-title">${memo.title}</span>
                    <span class="memo-date">${formatDateTime(memo.deletedAt || memo.updatedAt)}</span>
                </div>
                <div class="memo-actions-wrap">
                    <div class="memo-actions">
                        <i class="fa-solid fa-rotate-left btn-restore" onclick="restoreMemo(${memo.id}, event)"></i>
                        <i class="fa-solid fa-xmark btn-hard-delete" onclick="hardDeleteMemo(${memo.id}, event)"></i>
                    </div>
                    <i class="fa-solid fa-ellipsis-vertical btn-more mobile-only" onclick="toggleMemoMenu(event)"></i>
                </div>`;

            li.addEventListener('mousedown', e => startPress(e, memo.id, true));
            li.addEventListener('touchstart', e => startPress(e, memo.id, true), {passive: true});
            li.addEventListener('mouseup', cancelPress);
            li.addEventListener('mouseleave', cancelPress);
            li.addEventListener('touchend', cancelPress);
            li.addEventListener('touchmove', cancelPress, {passive: true});

            li.onclick = e => {
                if (e.target.closest('.memo-actions-wrap')) return; 

                if (isPressTriggered) {
                    isPressTriggered = false;
                    return;
                }

                const isCtrl = e.ctrlKey || e.metaKey;
                const isShift = e.shiftKey;

                if (isTrashMultiSelectMode && !isCtrl && !isShift) {
                    if (selectedTrashMemos.has(memo.id)) {
                        selectedTrashMemos.delete(memo.id);
                        if (selectedTrashMemos.size === 0) isTrashMultiSelectMode = false;
                    } else {
                        selectedTrashMemos.add(memo.id);
                        lastSelectedTrashId = memo.id;
                    }
                    loadTrashList();
                    return;
                }
                
                if (isShift && lastSelectedTrashId !== null) {
                    const cIdx = displayedTrashMemos.findIndex(m => m.id === memo.id);
                    const lIdx = displayedTrashMemos.findIndex(m => m.id === lastSelectedTrashId);
                    
                    if (cIdx !== -1 && lIdx !== -1) {
                        const start = Math.min(cIdx, lIdx);
                        const end = Math.max(cIdx, lIdx);
                        if (!isCtrl) selectedTrashMemos.clear();
                        for (let i = start; i <= end; i++) selectedTrashMemos.add(displayedTrashMemos[i].id);
                    }
                    loadTrashList();
                } else if (isCtrl) {
                    if (selectedTrashMemos.has(memo.id)) selectedTrashMemos.delete(memo.id);
                    else selectedTrashMemos.add(memo.id);
                    lastSelectedTrashId = memo.id;
                    loadTrashList();
                } else {
                    selectedTrashMemos.clear();
                    selectedTrashMemos.add(memo.id);
                    lastSelectedTrashId = memo.id;
                    isTrashMultiSelectMode = false; 
                    loadTrashList();
                }
            };
            return li;

        }

        // 🎯 [교정] 데이터 기반 핀 토글 (다중 선택 대응)
        function togglePin(id, e) {
            if (e) e.stopPropagation();
            forceSaveImmediate(); 

            // 다중 선택 중이면 선택된 모든 항목, 아니면 클릭한 항목 하나만 대상
            const targets = (selectedMemos.has(id) && selectedMemos.size > 1) ? Array.from(selectedMemos) : [id];
            
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');

            targets.forEach(targetId => {
                store.get(targetId).onsuccess = ev => {
                    const memo = ev.target.result;
                    if (memo) {
                        // 🎯 핵심 교정: CSS 클래스가 아니라 데이터의 pinnedAt 존재 여부로 판단
                        if (memo.pinnedAt) {
                            delete memo.pinnedAt; // 이미 고정되어 있으면 해제
                        } else {
                            memo.pinnedAt = Date.now(); // 고정되어 있지 않으면 현재 시간으로 고정
                        }
                        store.put(memo);
                    }
                };
            });

            tx.oncomplete = () => {
                loadMemoList(true); // 목록 새로고침
            };
        }

	function loadMemo(id) {
	    targetNewMemoFolderId = null; // 🎯 기존 노트를 열 때는 저장 타겟 폴더를 초기화합니다.
            if (currentMemoId === id) return; // 이미 열려있는 노트면 무시 (속도 향상)
            
            forceSaveImmediate(); // 이동 전 안전하게 저장
            const previousMemoId = currentMemoId; 
            
            isLoading = true; 
            db.transaction(['memos'], 'readonly').objectStore('memos').get(id).onsuccess = e => {
                const m = e.target.result;
                if (m) {
                    currentMemoId = m.id;
                    document.getElementById('memo-title-input').value = m.title;
                    document.title = m.title; 
                    quill.root.innerHTML = m.content;
                    
                    updateUIState('idle'); // 조용히 대기 상태 유지
                    
                    if (previousMemoId) purgeMemoIfEmpty(previousMemoId);
                    
                    loadMemoList(false); // 목록 하이라이트 변경용 (가볍게)
                    
                    // 🎯 [추가] 다른 노트를 열 때 이전 노트의 Ctrl+Z 수정 기록을 완벽히 지움
                    setTimeout(() => quill.history.clear(), 10);
                    setTimeout(() => { isLoading = false; }, 10); 
                }
            };
            closeAllPanelsMobile();
        }

        function deleteMemo(id, e) {
            e.stopPropagation();
            const targets = (selectedMemos.has(id) && selectedMemos.size > 1) ? Array.from(selectedMemos) : [id];
            
            if (!confirm(targets.length > 1 ? `선택한 ${targets.length}개의 노트를 휴지통으로 보냅니다.` : '휴지통으로 보내시겠습니까?')) return;
            
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');
            
            targets.forEach(targetId => {
                store.get(targetId).onsuccess = ev => {
                    const memo = ev.target.result;
                    if (memo) {
                        memo.isDeleted = true;
                        memo.deletedAt = Date.now(); 
                        memo.updatedAt = Date.now();
                        store.put(memo);
                    }
                };
            });
            
            tx.oncomplete = () => {
                // 🎯 버그 수정: 다중 선택 모드 확실히 끄기
                isMultiSelectMode = false;
                targets.forEach(targetId => selectedMemos.delete(targetId));

                if (targets.includes(currentMemoId)) {
                    createNewMemo();
                    loadMemoList(true); // 🎯 버그 수정: 잔상이 남지 않도록 무조건 DB 강제 새로고침
                } else {
                    loadMemoList(true);
                }
                updateUnsyncedCount();
            };
        }

        function restoreMemo(id, e) {
            e.stopPropagation();
            const targets = (selectedTrashMemos.has(id) && selectedTrashMemos.size > 1) ? Array.from(selectedTrashMemos) : [id];
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');
            
            targets.forEach(targetId => {
                store.get(targetId).onsuccess = ev => {
                    const memo = ev.target.result;
                    if (memo) {
                        memo.isDeleted = false;
                        delete memo.deletedAt;
                        memo.updatedAt = Date.now();
                        store.put(memo);
                    }
                };
            });
            
            tx.oncomplete = () => {
                // 🎯 버그 수정: 다중 선택 모드 확실히 끄기
                isTrashMultiSelectMode = false;
                targets.forEach(targetId => selectedTrashMemos.delete(targetId));
                
                loadTrashList();
                loadMemoList(true); // 🎯 버그 수정: 제가 함부로 지웠던 메인 목록 새로고침 부활!
                updateUnsyncedCount();
            };
        }

        function hardDeleteMemo(id, e) {
            e.stopPropagation();
            const targets = (selectedTrashMemos.has(id) && selectedTrashMemos.size > 1) ? Array.from(selectedTrashMemos) : [id];
            if (!confirm(targets.length > 1 ? `선택한 ${targets.length}개의 노트를 삭제하시겠습니까?` : '이 노트를 삭제하시겠습니까?')) return;
            
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos'); // 🎯 추가됨
            
            // 🎯 삭제(delete) 대신 영구삭제 꼬리표(isPermanentlyDeleted)를 달아둠
            targets.forEach(targetId => {
                store.get(targetId).onsuccess = ev => {
                    const memo = ev.target.result;
                    if (memo) {
                        memo.isPermanentlyDeleted = true;
                        memo.updatedAt = Date.now();
                        store.put(memo);
                    }
                };
            });
            
            tx.oncomplete = () => {
                targets.forEach(targetId => selectedTrashMemos.delete(targetId));
                loadTrashList();
                updateUnsyncedCount(); // 🎯 삭제했다는 사실도 동기화해야 하므로 카운트 업데이트
            };
        }

	// 🎯 [교정] 휴지통 비우기 (DB 직접 조회로 깡통 버그 완벽 해결)
        function emptyTrash() {
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');

            store.getAll().onsuccess = e => {
                const allData = e.target.result;
                const trashItems = allData.filter(m => m.isDeleted && !m.isPermanentlyDeleted);
                
                // DB를 직접 뒤져서 지울 게 하나도 없으면 그때 토스트를 띄웁니다.
                if (trashItems.length === 0) { 
                    showToast('휴지통이 이미 비어있습니다.'); 
                    return; 
                }
                
                if (!confirm('휴지통의 모든 메모를 삭제합니다. 계속하시겠습니까?')) return;
                
                trashItems.forEach(memo => {
                    memo.isPermanentlyDeleted = true;
                    memo.updatedAt = Date.now();
                    store.put(memo);
                });
                
                tx.oncomplete = () => {
                    selectedTrashMemos.clear();
                    loadTrashList();
                    updateUnsyncedCount();
                    showToast('휴지통이 완전히 비워졌습니다.');
                    // 🎯 현재 휴지통 폴더 안이라면 리스트를 즉시 새로고침합니다.
                    loadFileManager(currentFmFolderId); 
                };
            };
        }

        // 🎯 [교정] 일괄 복구 처리 (개수가 0개로 나오는 현상 해결)
        function fmBatchRestore() {
            if (fmSelectedItems.size === 0) { showToast("복구할 항목을 선택해주세요."); return; }
            
            const count = fmSelectedItems.size; // 🎯 선택 초기화 전에 개수를 미리 피신시킵니다!
            
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');
            fmSelectedItems.forEach(id => {
                store.get(id).onsuccess = e => {
                    const m = e.target.result;
                    if (m) { m.isDeleted = false; delete m.deletedAt; m.updatedAt = Date.now(); store.put(m); }
                };
            });
            tx.oncomplete = () => { 
                cancelFmMultiSelect(); 
                loadTrashList(); 
                loadMemoList(true); 
                updateUnsyncedCount(); 
                showToast(`${count}개 항목이 복구되었습니다.`); 
            };
        }

        // 🎯 [신규] 바탕 화면 일괄 백업 함수
        function backupDesktop() {
            if (!confirm('바탕 화면의 모든 폴더와 파일을 백업 폴더로 이동하시겠습니까?')) return;

            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');

            // 1. 현재 일시로 새로운 백업 폴더 생성
            const folderName = formatDateTime(Date.now()); 
            const newFolder = {
                title: folderName,
                type: 'folder',
                parentId: globalBackupFolderId, // 백업 시스템 폴더 아래에 생성
                updatedAt: Date.now(),
                isDeleted: false
            };

            store.add(newFolder).onsuccess = e => {
                const newBackupFolderId = e.target.result;

                // 2. 바탕 화면에 있는 모든 항목을 방금 만든 폴더로 이동
                store.getAll().onsuccess = ev => {
                    const allData = ev.target.result;
                    allData.forEach(m => {
                        if (m.parentId === globalDesktopFolderId && !m.isDeleted && !m.isPermanentlyDeleted) {
                             m.parentId = newBackupFolderId;
                             m.updatedAt = Date.now();
                             store.put(m);
                        }
                    });
                };
            };

            tx.oncomplete = () => {
                showToast("바탕 화면이 깨끗하게 백업되었습니다.");
                loadFileManager(currentFmFolderId); // 현재 바탕화면이면 깨끗해진 화면 렌더링
                loadMemoList(true); // 왼쪽 메인 창도 깨끗하게 동기화
            };
        }

        const getTitle = () => document.getElementById('memo-title-input').value || 'Untitled';

	// 🎯 공통: 패널을 스르륵 닫은 뒤, 0.3초 여유를 주고 무거운 작업을 실행하여 화면 멈춤(프리징) 방지

        // 🎯 인쇄하기도 화면이 멈추지 않도록 시간차 적용
        function handlePrint() {
            closeAllPanelsMobile();
            setTimeout(() => { window.print(); }, 300);
        }

        // 단일 메모 및 전체 저장 복구 로직 완벽 통합 + 영리한 중복 방지
        function handleFileImport(e) {
            const file = e.target.files[0];
            if(!file) return;
            
            const reader = new FileReader();
            const isTxt = file.name.toLowerCase().endsWith('.txt');
            
            reader.onload = ev => {
                const fileContent = ev.target.result;
		// 1. TXT 파일 불러오기
                if (isTxt) {
                    createNewMemo();
                    isLoading = false; // 🎯 방어막 즉시 강제 해제!
                    document.getElementById('memo-title-input').value = file.name.replace(/\.[^/.]+$/, "");
                    quill.setText(fileContent);
                    executeSave(); // 🎯 1.2초 기다리지 않고 즉시 DB 저장 + 왼쪽 목록 자동 갱신!
                    e.target.value = '';
                    return;
                }
                try {
                    const parsed = JSON.parse(fileContent);
                    
                    if (parsed.type === 'ZenBackup') {
                        const tx = db.transaction(['memos'], 'readwrite');
                        const store = tx.objectStore('memos');

                        let restoredCount = 0;
                        let skippedCount = 0;

                        store.getAll().onsuccess = (ev) => {
                            const currentMemos = ev.target.result;
                            
                            const existingMap = new Map();
                            currentMemos.forEach(m => {
                                if (m.syncId) existingMap.set(m.syncId, m);
                            });

                            parsed.data.forEach(m => {
                                if (m.syncId && existingMap.has(m.syncId)) {
                                    const localMemo = existingMap.get(m.syncId);
                                    
                                    if (localMemo.isDeleted) {
                                        localMemo.isDeleted = false;
                                        delete localMemo.deletedAt;
                                        localMemo.updatedAt = Date.now();
                                        store.put(localMemo);
                                        restoredCount++; 
                                    } else {
                                        skippedCount++; 
                                    }
                                    return; 
                                }

                                const isDuplicateContent = currentMemos.some(existing => 
                                    existing.title === m.title && existing.content === m.content
                                );
                                if (isDuplicateContent) {
                                    skippedCount++; 
                                    return;
                                }

                                delete m.id;
                                if (!m.syncId) m.syncId = generateSyncId();
                                store.add(m);
                                restoredCount++; 
                            });
                        };

                        tx.oncomplete = () => {
                            loadMemoList();
                            alert(`복원이 완료되었습니다.\n(복원노트: ${restoredCount}개 / 중복제외: ${skippedCount}개)`);
                        };
                    // 2. JSON 단일 파일 불러오기
                    } else if (parsed.type === 'ZenMemo') {
                        createNewMemo();
                        isLoading = false; // 🎯 방어막 즉시 강제 해제!
                        document.getElementById('memo-title-input').value = parsed.title || file.name.replace(/\.[^/.]+$/, "");
                        quill.root.innerHTML = parsed.content || '';
                        executeSave(); // 🎯 즉시 DB 저장 + 왼쪽 목록 자동 갱신!
                    } else {
                        alert('지원하지 않는 JSON 형식입니다.');
                    }
                } catch(err) {
                    alert('파일 읽기 오류가 발생했습니다.');
                }
                e.target.value = ''; 
            };
            reader.readAsText(file);
        }

        function toggleLeftPaneMobile() {
	    if (document.activeElement) document.activeElement.blur(); // 👈 브라우저의 포커스를 뺏어 키보드를 강제로 숨깁니다.
            const lp = document.getElementById('col-left');
            const ov = document.getElementById('mobile-overlay');
            lp.classList.toggle('is-mobile-open');
            if (lp.classList.contains('is-mobile-open')) {
                ov.classList.add('is-active');
		history.pushState({ panel: 'left' }, ''); // 👈 이 줄을 추가하세요!
                document.getElementById('col-right').classList.add('is-closed');
                document.getElementById('trash-pane').classList.remove('is-open');
                document.getElementById('global-menu-btn').style.display = 'flex';
            } else {
                ov.classList.remove('is-active');
            }
        }

        function closeAllPanelsMobile() {
            closeAllMemoMenus();
            if (window.innerWidth <= 768) {
                document.getElementById('col-left').classList.remove('is-mobile-open');
                document.getElementById('col-right').classList.add('is-closed');
                document.getElementById('trash-pane').classList.remove('is-open');
                document.getElementById('mobile-overlay').classList.remove('is-active');
                document.getElementById('global-menu-btn').style.display = 'flex';
            }
        }
        
        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                document.getElementById('col-left').classList.remove('is-mobile-open');
                document.getElementById('mobile-overlay').classList.remove('is-active');
                if(document.getElementById('col-right').classList.contains('is-closed') && !document.getElementById('trash-pane').classList.contains('is-open')) {
                    document.getElementById('global-menu-btn').style.display = 'flex';
                }
            }
        });

        let isReading = false;
        document.getElementById('btn-read-memo').addEventListener('click', function() {
            closeAllPanelsMobile(); 
            const synth = window.speechSynthesis;
            const btnIcon = this.querySelector('i');
            const btnText = this.querySelector('.btn-text');
            
            if (isReading || synth.speaking) {
                synth.cancel();
                isReading = false;
                btnIcon.className = 'fa-solid fa-volume-high';
                btnText.innerText = '음성으로 읽기';
                return;
            }
            
            const textToRead = quill.getText().trim();
            if (!textToRead) return;
            
            const utterance = new SpeechSynthesisUtterance(textToRead);
            utterance.lang = /[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(textToRead.substring(0, 50)) ? 'ko-KR' : 'en-US';
            utterance.rate = 1.0; 
            
            utterance.onend = function() {
                isReading = false;
                btnIcon.className = 'fa-solid fa-volume-high';
                btnText.innerText = '음성으로 읽기';
            };
            
            utterance.onerror = function() {
                console.warn('>>> 음성 읽기 중단');
                isReading = false;
                btnIcon.className = 'fa-solid fa-volume-high';
                btnText.innerText = '음성으로 읽기';
            };
            
            synth.cancel();
            synth.speak(utterance);
            isReading = true;
            btnIcon.className = 'fa-solid fa-stop';
            btnText.innerText = '읽기 중지';
        });

        function checkAuthState() {
            const hasToken = gapiInited && gisInited && gapi.client && gapi.client.getToken() !== null;
            const authBtnIcon = document.querySelector('#btn-auth i');
            
            if (authBtnIcon) authBtnIcon.style.color = hasToken ? 'var(--accent)' : '';
            
            if (hasToken) {
                updateUIState('online-idle');
            } else {
                updateUIState('offline-idle');
            }
        }
        
        window.addEventListener('DOMContentLoaded', () => {
            checkAuthState(); 
        });

		document.getElementById('btn-auth').addEventListener('click', () => {
			if (!gapiInited || !gisInited) {
				alert('구글 서비스 준비 중입니다. 잠시 후 다시 시도해주세요.');
				return;
			}
			closeAllPanelsMobile(); 
    
			// 만약 5초가 안 지나서 권한(토큰)이 살아있을 때 또 눌렀다면 바로 동기화 진행
			if (gapi.client.getToken() !== null) {
				smartSync();
				return; 
			}
    
			// 권한이 없다면 구글에 조용히 토큰 요청
			tokenClient.callback = async (resp) => {
				if (resp.error !== undefined) {
					console.warn(">>> 동기화 취소 또는 에러", resp.error);
					return;
				}

				// 아이콘 깜빡임 효과
				const icon = document.querySelector('#btn-auth i');
				icon.classList.add('blink-active');
				setTimeout(() => icon.classList.remove('blink-active'), 1500);
        
				smartSync(); // 권한을 받아왔으니 즉시 백업(동기화) 시작
			};
    
			// prompt: 'consent'를 지웠기 때문에, 최초 1회 이후엔 동의 창 없이 스무스하게 넘어갑니다.
			tokenClient.requestAccessToken(); 
		});

        async function smartSync() {
            if (!gapi.client.getToken() || !db) return;
            console.log(">>> [데이터 우선 복구] 클라우드 확인 시작...");
            try {
                const res = await gapi.client.drive.files.list({
                    q: "name = 'ZenNotes_Backup.json' and trashed = false",
                    fields: 'files(id, name)'
                });

                if (!res.result.files || res.result.files.length === 0) {
                    console.warn(">>> 클라우드에 백업 파일이 없습니다. 로컬 데이터를 업로드합니다.");
                    hasLoadedFromCloud = true;
                    syncDataToCloud(); 
                    return;
                }

                const fileId = res.result.files[0].id;
                const fileRes = await gapi.client.drive.files.get({ fileId: fileId, alt: 'media' });
                
                let cloudData = fileRes.result;
                if (typeof cloudData === 'string') {
                    try { 
                        cloudData = JSON.parse(cloudData).data || []; 
                    } catch(e) { 
                        cloudData = []; 
                    }
                } else {
                    cloudData = cloudData.data || [];
                }

                const tx = db.transaction(['memos'], 'readwrite');
                const store = tx.objectStore('memos');
                
                store.getAll().onsuccess = (e) => {
                    const localData = e.target.result;
                    let needUIUpdate = false;
                    const localMap = new Map(localData.map(m => [m.syncId || m.id.toString(), m]));

                    cloudData.forEach(cloudMemo => {
                        const syncKey = cloudMemo.syncId || cloudMemo.id.toString();
                        const localMemo = localMap.get(syncKey);

                        if (!localMemo) {
                            delete cloudMemo.id; 
                            cloudMemo.syncId = syncKey;
                            store.add(cloudMemo); 
                            needUIUpdate = true;
                        } else if (cloudMemo.updatedAt > localMemo.updatedAt) {
                            let mergedContent = cloudMemo.content;
                            if (localMemo.content) {
                                const localSrcs = [];
                                localMemo.content.replace(/<img[^>]+src="(data:image[^"]+)"/gi, (match, src) => {
                                    localSrcs.push(src);
                                });
                                let imgIndex = 0;
                                mergedContent = mergedContent.replace(/<img[^>]+data-local-image="true"[^>]*>/gi, (match) => {
                                    if (imgIndex < localSrcs.length) {
                                        let restored = match.replace(/src=""/i, `src="${localSrcs[imgIndex]}"`).replace(/ data-local-image="true"/i, '');
                                        imgIndex++;
                                        return restored;
                                    }
                                    return match;
                                });
                            }
                            cloudMemo.content = mergedContent;
                            cloudMemo.id = localMemo.id; 
                            cloudMemo.syncId = syncKey;
                            store.put(cloudMemo); 
                            needUIUpdate = true;
                        }
                    });

                    tx.oncomplete = () => {
                        console.log(">>> [동기화 병합 완료] 클라우드 로드 성공");
                        hasLoadedFromCloud = true;
                        if (needUIUpdate) loadMemoList();
                        checkAuthState();
                        syncDataToCloud(); 
                    };
                };
            } catch (err) { 
                console.error(">>> [스마트 동기화 오류] 통신 실패:", err); 
                document.getElementById('status-dot').className = 'status-dot unsaved';
            }
        }

        // ============================================================================
        // 모바일 하드웨어 '뒤로가기' 완벽 제어 및 앱 종료 방어(토스트) 로직
        // ============================================================================
        let backPressTimer = 0;

        window.addEventListener('load', () => {
            if (window.innerWidth <= 768) {
                // 1. 진짜 첫 화면을 'base'로 못 박아둡니다.
                history.replaceState({ page: 'base' }, ''); 
                // 2. 그 위에 'main'을 얹어 완벽한 이중 방어막을 칩니다.
                history.pushState({ page: 'main' }, ''); 
            }
        });

        function showToast(msg) {
            let toast = document.getElementById('zen-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'zen-toast';
                toast.style.cssText = 'position:fixed; bottom:120px; left:50%; transform:translateX(-50%); background:rgba(30,30,32,0.9); color:var(--text-main); border:1px solid var(--border); padding:12px 24px; border-radius:12px; font-size:14px; font-weight:500; z-index:10005; opacity:0; transition:opacity 0.3s ease-in-out; pointer-events:none; white-space:pre-wrap; text-align:center; line-height:1.4; box-shadow:0 8px 24px rgba(0,0,0,0.6); width:max-content; max-width:90vw; word-break:keep-all;';
                document.body.appendChild(toast);
            }
            toast.innerText = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2000);
        }

	let refreshing = false;

	if ('serviceWorker' in navigator) {
	    window.addEventListener('load', () => {
	        navigator.serviceWorker.register('./sw.js').then(registration => {
	            console.log('✅ 서비스 워커 등록 완료! Scope:', registration.scope);

	            // 🎯 새 버전의 서비스 워커가 발견되었을 때의 처리
	            registration.addEventListener('updatefound', () => {
	                const newWorker = registration.installing;
                
	                newWorker.addEventListener('statechange', () => {
	                    // 새 워커가 다운로드 완료되었고, 기존에 작동 중인 워커가 있다면 (즉, 최초 설치가 아닌 '업데이트'라면)
	                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
	                        const updateToast = document.getElementById('update-toast');
	                        updateToast.style.display = 'flex';

	                        // 새로고침 버튼을 누르면 대기 중인 워커에게 강제 적용(SKIP_WAITING) 명령 전송
	                        document.getElementById('update-btn').addEventListener('click', () => {
	                            updateToast.style.display = 'none';
	                            newWorker.postMessage({ type: 'SKIP_WAITING' });
	                        });
	                    }
	                });
	            });
	        }).catch(error => {
	            console.error('❌ 서비스 워커 등록 실패:', error);
	        });

	        // 🎯 대기 중이던 새 워커가 권한을 넘겨받고 활성화되면 페이지를 1회 새로고침하여 새 화면 표시
	        navigator.serviceWorker.addEventListener('controllerchange', () => {
	            if (!refreshing) {
	                refreshing = true;
	                window.location.reload();
	            }
	        });
	    });
	}

	// 🎯 [추가] URL을 받아 예쁜 링크 카드로 변환하는 엔진 (Microlink API)
        async function insertRichLinkCard(url, fallbackTitle, fallbackText) {
            try {
                showToast("링크 정보를 분석 중입니다...\n(잠시만 기다려주세요)");
                
                // Microlink API 호출 (서버 없이 프론트엔드에서 무료 CORS 우회)
                const response = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`);
                const data = await response.json();

                let cardData = { url: url, title: fallbackTitle || url, description: fallbackText || '', image: '' };

                if (data.status === 'success') {
                    cardData.title = data.data.title || cardData.title;
                    cardData.description = data.data.description || cardData.description;
                    // 메인 이미지가 없으면 사이트 로고라도 가져옴
                    cardData.image = (data.data.image && data.data.image.url) ? data.data.image.url : 
                                     ((data.data.logo && data.data.logo.url) ? data.data.logo.url : '');
                }

                // 에디터 맨 끝에 예쁜 카드 블록(Blot) 삽입
                const range = quill.getLength(); 
                quill.insertEmbed(range, 'link-card', cardData, Quill.sources.USER);
                quill.insertText(range + 1, '\n', Quill.sources.USER); // 카드 밑에 커서용 엔터 1칸
                
                triggerAutoSave();
                showToast("링크 카드가 저장되었습니다.");

            } catch (error) {
                console.error("❌ 링크 분석 실패:", error);
                // API 통신 실패 시, 아쉽지만 일반 텍스트 링크로 대체
                const range = quill.getLength();
                quill.insertText(range, url + '\n', Quill.sources.USER);
                triggerAutoSave();
            }
        }

	// 👇 추가: 앱 숏컷 & 공유 타겟 처리 함수
	function handleLaunchParams() {
	    const urlParams = new URLSearchParams(window.location.search);

            // 1. 앱 숏컷(새 노트 작성)으로 앱을 켰을 때
            if (urlParams.get('action') === 'new') {
                createNewMemo();
                // 새로고침 시 다시 새 노트가 켜지지 않도록 URL에서 ?action=new 를 조용히 지웁니다.
                window.history.replaceState({}, document.title, window.location.pathname);
                return;
            }

	    // 2. 다른 앱(유튜브, 웹브라우저 등)에서 '공유하기'로 ZenNotes를 선택했을 때
            const sharedTitle = urlParams.get('title');
            const sharedText = urlParams.get('text');
            const sharedUrl = urlParams.get('url');

            if (sharedTitle || sharedText || sharedUrl) {
                createNewMemo(); // 빈 노트를 하나 열고
                
                if (sharedTitle) document.getElementById('memo-title-input').value = sharedTitle;

                if (sharedUrl) {
                    // 🎯 단순 텍스트 링크 삽입 대신, 예쁜 '리치 링크 카드' 생성 엔진 가동!
                    insertRichLinkCard(sharedUrl, sharedTitle, sharedText);
                } else if (sharedText) {
                    quill.root.innerHTML = sharedText + '<br><br>';
                    triggerAutoSave();
                }

                // 새로고침 방지를 위해 URL을 깔끔하게 정리합니다.
                window.history.replaceState({}, document.title, window.location.pathname);
            }

        }

    </script>

    <div id="update-toast" style="display: none; position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--surface-hover); color: var(--text-main); padding: 12px 20px; border-radius: 8px; border: 1px solid var(--accent); box-shadow: 0 10px 25px rgba(0,0,0,0.8); z-index: 10000; align-items: center; gap: 16px;">
        <span style="font-size: 14px; font-weight: 500;">새로운 버전이 준비되었습니다!</span>
        <button id="update-btn" style="background: var(--accent); color: #000; padding: 8px 12px; border-radius: 6px; font-weight: 700; font-size: 13px;">새로고침</button>
    </div>
