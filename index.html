        // 단일 메모 및 전체 저장 복구 로직 완벽 통합 + 영리한 중복 방지
        // 🎯 [올인원 수입 엔진] 파일 하나로 모든 형식을 판단하여 처리합니다.
        function handleFileImport(e) {
            const file = e.target.files[0];
            if (!file) return;

            const fileName = file.name;
            const fileExt = fileName.split('.').pop().toLowerCase();
            const isImage = file.type.startsWith('image/');
            const isPdf = fileExt === 'pdf';

            // --- [Case 1] 이미지 파일일 때: 현재 편집 중인 노트 본문에 바로 삽입 ---
            if (isImage) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const range = quill.getSelection(true);
                    quill.insertEmbed(range.index, 'image', ev.target.result, Quill.sources.USER);
                    quill.insertText(range.index + 1, '\n', Quill.sources.USER);
                    quill.setSelection(range.index + 2, Quill.sources.SILENT);
                    triggerAutoSave();
                    showToast("이미지를 노트에 삽입했습니다.");
                };
                reader.readAsDataURL(file);
                e.target.value = ''; return;
            }

            // --- [Case 2] PDF 파일일 때: 우선 안내 메시지 출력 ---
            if (isPdf) {
                alert("PDF는 현재 '이미지로 변환'하여 삽입하는 엔진을 준비 중입니다.\n텍스트를 직접 넣으시려면 PDF에서 복사해서 붙여넣어 주세요!");
                e.target.value = ''; return;
            }

            // --- [Case 3] 텍스트 기반 파일들 (JSON, TXT, HTML, MD) ---
            const reader = new FileReader();
            reader.onload = ev => {
                const fileContent = ev.target.result;

                // 📌 A. 기존 로직 완벽 보존: JSON 전체 백업 및 단일 노트 불러오기
                if (fileExt === 'json') {
                    try {
                        const parsed = JSON.parse(fileContent);
                        
                        if (parsed.type === 'ZenBackup') {
                            const tx = db.transaction(['memos'], 'readwrite');
                            const store = tx.objectStore('memos');
                            let restoredCount = 0;
                            let skippedCount = 0;

                            store.getAll().onsuccess = (event) => {
                                const currentMemos = event.target.result;
                                const existingMap = new Map();
                                currentMemos.forEach(m => {
                                    if (m.syncId) existingMap.set(m.syncId, m);
                                });

                                parsed.data.forEach(m => {
                                    if (m.syncId && existingMap.has(m.syncId)) {
                                        const localMemo = existingMap.get(m.syncId);
                                        if (localMemo.isDeleted) {
                                            localMemo.isDeleted = false;
                                            delete localMemo.deletedAt;
                                            localMemo.updatedAt = Date.now();
                                            store.put(localMemo);
                                            restoredCount++; 
                                        } else {
                                            skippedCount++; 
                                        }
                                        return; 
                                    }

                                    const isDuplicateContent = currentMemos.some(existing => 
                                        existing.title === m.title && existing.content === m.content
                                    );
                                    if (isDuplicateContent) {
                                        skippedCount++; 
                                        return;
                                    }

                                    delete m.id;
                                    if (!m.syncId) m.syncId = generateSyncId();
                                    store.add(m);
                                    restoredCount++; 
                                });
                            };

                            tx.oncomplete = () => {
                                // 🎯 자가 치유 엔진 유지
                                healDatabase(() => {
                                    loadMemoList();
                                    alert(`복원이 완료되었습니다.\n(복원노트: ${restoredCount}개 / 중복제외: ${skippedCount}개)`);
                                });
                            };

                        } else if (parsed.type === 'ZenMemo') {
                            createNewMemo();
                            isLoading = false; 
                            document.getElementById('memo-title-input').value = parsed.title || fileName.replace(/\.[^/.]+$/, "");
                            quill.root.innerHTML = parsed.content || '';
                            executeSave(); 
                        } else {
                            alert('지원하지 않는 JSON 형식입니다.');
                        }
                    } catch(err) {
                        alert('파일 읽기 오류가 발생했습니다.');
                    }
                } 
                // 📌 B. HTML 파일: 서식을 유지하며 새 노트로 생성
                else if (fileExt === 'html') {
                    createNewMemo();
                    isLoading = false;
                    document.getElementById('memo-title-input').value = fileName.replace('.html', '');
                    quill.root.innerHTML = fileContent; // HTML 서식 그대로 주입
                    executeSave();
                    showToast("HTML 파일을 새 노트로 불러왔습니다.");
                }
                // 📌 C. TXT 및 마크다운(MD) 파일
                else if (fileExt === 'txt' || fileExt === 'md') {
                    createNewMemo();
                    isLoading = false; 
                    document.getElementById('memo-title-input').value = fileName.replace(/\.(txt|md)$/i, "");
                    quill.setText(fileContent); // 일반 텍스트로 주입
                    executeSave(); 
                    showToast("텍스트 문서를 불러왔습니다.");
                }
                e.target.value = ''; 
            };

            // 텍스트 기반 파일 읽기 실행
            if (fileExt === 'json' || fileExt === 'txt' || fileExt === 'html' || fileExt === 'md') {
                reader.readAsText(file);
            } else if (!isImage && !isPdf) {
                // 그 외 알 수 없는 파일일 경우
                alert("지원하지 않는 파일 형식입니다.");
                e.target.value = '';
            }
        }

        async function smartSync() {
            if (!gapi.client.getToken() || !db) return;
            console.log(">>> [데이터 우선 복구] 클라우드 확인 시작...");
            try {
                const res = await gapi.client.drive.files.list({
                    q: "name = 'ZenNotes_Backup.json' and trashed = false",
                    fields: 'files(id, name)'
                });

                if (!res.result.files || res.result.files.length === 0) {
                    console.warn(">>> 클라우드에 백업 파일이 없습니다. 로컬 데이터를 업로드합니다.");
                    hasLoadedFromCloud = true;
                    syncDataToCloud(); 
                    return;
                }

                const fileId = res.result.files[0].id;
                const fileRes = await gapi.client.drive.files.get({ fileId: fileId, alt: 'media' });
                
                let cloudData = fileRes.result;
                if (typeof cloudData === 'string') {
                    try { 
                        cloudData = JSON.parse(cloudData).data || []; 
                    } catch(e) { 
                        cloudData = []; 
                    }
                } else {
                    cloudData = cloudData.data || [];
                }

                const tx = db.transaction(['memos'], 'readwrite');
                const store = tx.objectStore('memos');
                
                store.getAll().onsuccess = (e) => {
                    const localData = e.target.result;
                    let needUIUpdate = false;
                    const localMap = new Map(localData.map(m => [m.syncId || m.id.toString(), m]));

                    cloudData.forEach(cloudMemo => {
                        const syncKey = cloudMemo.syncId || cloudMemo.id.toString();
                        const localMemo = localMap.get(syncKey);

                        if (!localMemo) {
                            delete cloudMemo.id; 
                            cloudMemo.syncId = syncKey;
                            store.add(cloudMemo); 
                            needUIUpdate = true;
                        } else if (cloudMemo.updatedAt > localMemo.updatedAt) {
                            let mergedContent = cloudMemo.content;
                            if (localMemo.content) {
                                const localSrcs = [];
                                localMemo.content.replace(/<img[^>]+src="(data:image[^"]+)"/gi, (match, src) => {
                                    localSrcs.push(src);
                                });
                                let imgIndex = 0;
                                mergedContent = mergedContent.replace(/<img[^>]+data-local-image="true"[^>]*>/gi, (match) => {
                                    if (imgIndex < localSrcs.length) {
                                        let restored = match.replace(/src=""/i, `src="${localSrcs[imgIndex]}"`).replace(/ data-local-image="true"/i, '');
                                        imgIndex++;
                                        return restored;
                                    }
                                    return match;
                                });
                            }
                            cloudMemo.content = mergedContent;
                            cloudMemo.id = localMemo.id; 
                            cloudMemo.syncId = syncKey;
                            store.put(cloudMemo); 
                            needUIUpdate = true;
                        }
                    });

                    tx.oncomplete = () => {
                        console.log(">>> [동기화 병합 완료] 클라우드 로드 성공");
                        hasLoadedFromCloud = true;
                        
                        // 🎯 [수정] 동기화 직후 자가 치유 엔진으로 중복 폴더 싹쓸이 병합
                        healDatabase(() => {
                            if (needUIUpdate) loadMemoList();
                            checkAuthState();
                            syncDataToCloud(); 
                        });
		    };
                };
            } catch (err) { 
                console.error(">>> [스마트 동기화 오류] 통신 실패:", err); 
                document.getElementById('status-dot').className = 'status-dot unsaved';
            }
        }

        // 🎯 [실행 취소] 핵심 DB 롤백 엔진
        function executeUndo() {
            if (!lastUndoData || !db) return;
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');

            lastUndoData.forEach(item => {
                store.get(item.id).onsuccess = e => {
                    const m = e.target.result;
                    if (m) {
                        if (item.action === 'restore') {
                            m.isDeleted = false; // 휴지통에서 다시 살려냄
                            delete m.deletedAt;
                        } else if (item.action === 'moveBack') {
                            m.parentId = item.oldParentId; // 원래 있던 방으로 되돌림
                        }
                        m.updatedAt = Date.now();
                        store.put(m);
                    }
                };
            });

            tx.oncomplete = () => {
                showToast("작업이 실행 취소되었습니다.");
                lastUndoData = null; // 기억 비우기
                loadFileManager(currentFmFolderId); // 현재 창 새로고침
                loadMemoList(true); // 메인 목록 새로고침
                updateUnsyncedCount();
            };
        }

	let refreshing = false;

	if ('serviceWorker' in navigator) {
	    window.addEventListener('load', () => {
	        navigator.serviceWorker.register('./sw.js').then(registration => {
	            console.log('✅ 서비스 워커 등록 완료! Scope:', registration.scope);

	            // 🎯 새 버전의 서비스 워커가 발견되었을 때의 처리
	            registration.addEventListener('updatefound', () => {
	                const newWorker = registration.installing;
                
	                newWorker.addEventListener('statechange', () => {
	                    // 새 워커가 다운로드 완료되었고, 기존에 작동 중인 워커가 있다면 (즉, 최초 설치가 아닌 '업데이트'라면)
	                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
	                        const updateToast = document.getElementById('update-toast');
	                        updateToast.style.display = 'flex';

	                        // 새로고침 버튼을 누르면 대기 중인 워커에게 강제 적용(SKIP_WAITING) 명령 전송
	                        document.getElementById('update-btn').addEventListener('click', () => {
	                            updateToast.style.display = 'none';
	                            newWorker.postMessage({ type: 'SKIP_WAITING' });
	                        });
	                    }
	                });
	            });
	        }).catch(error => {
	            console.error('❌ 서비스 워커 등록 실패:', error);
	        });

	        // 🎯 대기 중이던 새 워커가 권한을 넘겨받고 활성화되면 페이지를 1회 새로고침하여 새 화면 표시
	        navigator.serviceWorker.addEventListener('controllerchange', () => {
	            if (!refreshing) {
	                refreshing = true;
	                window.location.reload();
	            }
	        });
	    });
	}

	// 🎯 [추가] URL을 받아 예쁜 링크 카드로 변환하는 엔진 (Microlink API)
        async function insertRichLinkCard(url, fallbackTitle, fallbackText) {
            try {
                showToast("링크 정보를 분석 중입니다...\n(잠시만 기다려주세요)");
                
                // Microlink API 호출 (서버 없이 프론트엔드에서 무료 CORS 우회)
                const response = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`);
                const data = await response.json();

                let cardData = { url: url, title: fallbackTitle || url, description: fallbackText || '', image: '' };

                if (data.status === 'success') {
                    cardData.title = data.data.title || cardData.title;
                    cardData.description = data.data.description || cardData.description;
                    // 메인 이미지가 없으면 사이트 로고라도 가져옴
                    cardData.image = (data.data.image && data.data.image.url) ? data.data.image.url : 
                                     ((data.data.logo && data.data.logo.url) ? data.data.logo.url : '');
                }

                // 에디터 맨 끝에 예쁜 카드 블록(Blot) 삽입
                const range = quill.getLength(); 
                quill.insertEmbed(range, 'link-card', cardData, Quill.sources.USER);
                quill.insertText(range + 1, '\n', Quill.sources.USER); // 카드 밑에 커서용 엔터 1칸
                
                triggerAutoSave();
                showToast("링크 카드가 저장되었습니다.");

            } catch (error) {
                console.error("❌ 링크 분석 실패:", error);
                // API 통신 실패 시, 아쉽지만 일반 텍스트 링크로 대체
                const range = quill.getLength();
                quill.insertText(range, url + '\n', Quill.sources.USER);
                triggerAutoSave();
            }
        }

	// 👇 추가: 앱 숏컷 & 공유 타겟 처리 함수
	function handleLaunchParams() {
	    const urlParams = new URLSearchParams(window.location.search);

            // 1. 앱 숏컷(새 노트 작성)으로 앱을 켰을 때
            if (urlParams.get('action') === 'new') {
                createNewMemo();
                // 새로고침 시 다시 새 노트가 켜지지 않도록 URL에서 ?action=new 를 조용히 지웁니다.
                window.history.replaceState({}, document.title, window.location.pathname);
                return;
            }

	    // 2. 다른 앱(유튜브, 웹브라우저 등)에서 '공유하기'로 ZenNotes를 선택했을 때
            const sharedTitle = urlParams.get('title');
            const sharedText = urlParams.get('text');
            const sharedUrl = urlParams.get('url');

            if (sharedTitle || sharedText || sharedUrl) {
                createNewMemo(); // 빈 노트를 하나 열고
                
                if (sharedTitle) document.getElementById('memo-title-input').value = sharedTitle;

                if (sharedUrl) {
                    // 🎯 단순 텍스트 링크 삽입 대신, 예쁜 '리치 링크 카드' 생성 엔진 가동!
                    insertRichLinkCard(sharedUrl, sharedTitle, sharedText);
                } else if (sharedText) {
                    quill.root.innerHTML = sharedText + '<br><br>';
                    triggerAutoSave();
                }

                // 새로고침 방지를 위해 URL을 깔끔하게 정리합니다.
                window.history.replaceState({}, document.title, window.location.pathname);
            }

        }

		// 🎯 [신규] 현재 폴더 복원 (부모 폴더로 바운스)
        function restoreCurrentFolder() {
            if (!confirm('이 폴더를 복원하시겠습니까?')) return;
            
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');
            
            // 폴더 껍데기만 복원하면, 그 안에 있는 자식들은 족보가 회복되어 자동으로 모두 복원됩니다!
            store.get(currentFmFolderId).onsuccess = e => {
                const m = e.target.result;
                if (m) {
                    m.isDeleted = false;
                    delete m.deletedAt;
                    m.updatedAt = Date.now();
                    store.put(m);
                }
            };
            
            tx.oncomplete = () => {
                showToast("폴더가 복원되었습니다.");
                document.getElementById('fm-global-menu').classList.remove('is-active');
                updateUnsyncedCount();
                history.back(); // 🎯 작업 완료 후 안전하게 부모 폴더로 되돌아갑니다.
            };
        }

        // 🎯 [신규] 현재 폴더 비우기 (영구 삭제 및 부모 폴더로 바운스)
        function emptyCurrentFolder() {
            if (!confirm('이 폴더를 비우시겠습니까? 폴더와 내부의 모든 항목이 영구 삭제됩니다.')) return;
            
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');
            
            store.getAll().onsuccess = e => {
                const allData = e.target.result;
                const folderMap = new Map();
                allData.forEach(m => { if (m.type === 'folder') folderMap.set(m.id, m); });
                
                function isDescendant(parentId) {
                    let curr = parentId;
                    while (curr) {
                        if (curr === currentFmFolderId) return true;
                        const pf = folderMap.get(curr);
                        if (!pf) break;
                        curr = pf.parentId;
                    }
                    return false;
                }

                // 1. 해당 폴더 영구 삭제
                const f = allData.find(m => m.id === currentFmFolderId);
                if (f) {
                    f.isPermanentlyDeleted = true;
                    f.updatedAt = Date.now();
                    store.put(f);
                }

                // 2. 내부 모든 자손 항목들 일괄 영구 삭제 (DB 찌꺼기 방지)
                allData.forEach(m => {
                    if (isDescendant(m.parentId) && !m.isPermanentlyDeleted) {
                        m.isPermanentlyDeleted = true;
                        m.updatedAt = Date.now();
                        store.put(m);
                    }
                });
            };
            
            tx.oncomplete = () => {
                showToast("폴더가 완전히 삭제되었습니다.");
                document.getElementById('fm-global-menu').classList.remove('is-active');
                updateUnsyncedCount();
                history.back(); // 🎯 작업 완료 후 안전하게 부모 폴더로 되돌아갑니다.
            };
        }

		// ============================================================================
        // 🎯 [모바일 마스터피스] 가상 키보드 툴바 도킹 (Visual Viewport API)
        // 안드로이드와 아이폰(iOS)의 제멋대로인 키보드 동작을 완벽하게 계산하여 통제합니다.
        // ============================================================================
        if (window.visualViewport) {
            const toolbar = document.querySelector('.ql-toolbar.ql-snow');
            let isDocked = false;

            // 🎯 [추가] 프레임 동기화 타이머 (울렁거림 방지용)
            let viewportHandler = null;

            const updateToolbarPosition = () => {
                // 🎯 애니메이션 프레임 동기화: 브라우저 주사율(60Hz/120Hz)에 맞춰 부드럽게 렌더링
                if (viewportHandler) cancelAnimationFrame(viewportHandler);
                viewportHandler = requestAnimationFrame(() => {
                    
                    if (window.innerWidth > 768 || !toolbar) {
                        if (isDocked) { 
                            toolbar.style.cssText = ''; 
                            isDocked = false; 
                        }
                        return;
                    }

                    const isTyping = quill.hasFocus() || document.activeElement === document.getElementById('memo-title-input');
                    const isKeyboardUp = isTyping && (window.visualViewport.height < window.screen.height * 0.75);

                    if (isKeyboardUp) {
                        // 🚀 [틈새 방어 마법] 계산된 위치에 '+ 2'를 더해 키보드 안쪽으로 2px 밀어 넣습니다.
                        // (OS 가상 키보드가 웹 브라우저보다 무조건 위에 뜨기 때문에 깔끔하게 틈새만 밀봉됩니다!)
                        const topPosition = window.visualViewport.offsetTop + window.visualViewport.height - toolbar.offsetHeight + 2;
                        
                        toolbar.style.setProperty('position', 'fixed', 'important');
                        toolbar.style.setProperty('top', `${topPosition}px`, 'important');
                        toolbar.style.setProperty('bottom', 'auto', 'important');
                        toolbar.style.setProperty('z-index', '9999', 'important');
                        
                        // 🚀 [울렁거림 방어 마법] GPU 하드웨어 가속 강제 가동 & 틈새 메꿈용 그림자
                        toolbar.style.setProperty('box-shadow', '0 4px 0 var(--bg)', 'important'); // 밑단에 배경색 그림자를 덧대어 철통 방어
                        toolbar.style.setProperty('transform', 'translateZ(0)', 'important'); // GPU 가동!
                        toolbar.style.setProperty('transition', 'none', 'important'); 
                        
                        isDocked = true;
                    } else {
                        if (isDocked) {
                            toolbar.style.cssText = ''; 
                            isDocked = false;
                        }
                    }
                });
            };

            // 화면 줌, 텍스트 스크롤, 키보드 애니메이션 등 '시야'가 변하는 모든 순간을 1밀리초 단위로 감지
            window.visualViewport.addEventListener('resize', updateToolbarPosition);
            window.visualViewport.addEventListener('scroll', updateToolbarPosition);
            
            // 사용자가 글씨를 쓰려고 화면을 터치하는 순간 즉각 반응
            quill.root.addEventListener('focus', updateToolbarPosition);
            document.getElementById('memo-title-input').addEventListener('focus', updateToolbarPosition);
            
            // 키보드가 닫히는 애니메이션 시간을 고려해 0.1초 뒤에 복귀(천장에 다시 붙임) 계산
            quill.root.addEventListener('blur', () => setTimeout(updateToolbarPosition, 100)); 
            document.getElementById('memo-title-input').addEventListener('blur', () => setTimeout(updateToolbarPosition, 100));
        }

        // ============================================================================
        // 🚀 [군사급 암호화 엔진] Web Crypto API (AES-GCM 256bit)
        // 상용 보안 앱에 사용되는 최상위 레벨의 브라우저 내장 암호화 시스템입니다.
        // ============================================================================
        
        // 1. 사용자의 비밀번호(문자열)를 강력한 AES-GCM 256비트 암호화 키로 변환하는 해시 공장
        async function getCryptoKey(password) {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveBits", "deriveKey"]
            );
            // 소금(Salt)은 로컬 DB 특성상 기기 간 동기화 후에도 복호화할 수 있도록 강력한 고정값을 사용합니다.
            const salt = enc.encode("ZenNotes_Ultimate_Crypto_Salt_2026"); 
            
            return crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
                keyMaterial, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]
            );
        }

        // 2. 평문 텍스트(Base64 이미지 포함) -> 복호화 불가능한 외계어(암호문)로 변환
        async function encryptData(plainText, cryptoKey) {
            if (!plainText) return '';
            
            const iv = crypto.getRandomValues(new Uint8Array(12)); // 12바이트 랜덤 IV (초기화 벡터) 생성
            const enc = new TextEncoder();
            
            // 본문을 완전히 갈아엎어 암호화 버퍼로 변환합니다.
            const encryptedBuffer = await crypto.subtle.encrypt(
                { name: "AES-GCM", iv: iv }, cryptoKey, enc.encode(plainText)
            );
            
            // IV와 암호문을 한 덩어리로 합쳐서 Base64 텍스트로 인코딩합니다.
            const combined = new Uint8Array(iv.length + encryptedBuffer.byteLength);
            combined.set(iv, 0);
            combined.set(new Uint8Array(encryptedBuffer), iv.length);
            
            // 🎯 대용량 데이터(사진 등) 처리를 위해 Call Stack 크래시를 방지하는 Blob FileReader 기법 적용!
            return new Promise((resolve) => {
                const blob = new Blob([combined]);
                const reader = new FileReader();
                reader.onload = (e) => {
                    const base64 = e.target.result.split(',')[1];
                    // 외계어 앞에 '이건 암호화된 노트다!'라는 꼬리표(ZENENC::)를 붙여줍니다.
                    resolve('ZENENC::' + base64); 
                };
                reader.readAsDataURL(blob);
            });
        }

        // 3. 외계어(암호문) -> 사람이 읽을 수 있는 평문으로 변환 (해독기)
        async function decryptData(encryptedText, cryptoKey) {
            // 우리가 만든 암호문 형태가 아니면 그냥 그대로 반환(패스)합니다.
            if (!encryptedText || !encryptedText.startsWith('ZENENC::')) return encryptedText;
            
            // 꼬리표를 떼어내고 순수 암호문만 분리
            const base64 = encryptedText.replace('ZENENC::', '');
            const binaryStr = atob(base64);
            const bytes = new Uint8Array(binaryStr.length);
            
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
            
            // 합쳐놨던 IV(12바이트)와 실제 암호 데이터를 다시 분리
            const iv = bytes.slice(0, 12);
            const data = bytes.slice(12);
            
            // 열쇠(cryptoKey)를 넣고 자물쇠를 풉니다!
            const decryptedBuffer = await crypto.subtle.decrypt(
                { name: "AES-GCM", iv: iv }, cryptoKey, data
            );
            
            // 한국어/영어로 완벽하게 복원!
            return new TextDecoder().decode(decryptedBuffer);
        }

    </script>

    <div id="update-toast" style="display: none; position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--surface-hover); color: var(--text-main); padding: 12px 20px; border-radius: 8px; border: 1px solid var(--accent); box-shadow: 0 10px 25px rgba(0,0,0,0.8); z-index: 10000; align-items: center; gap: 16px;">
        <span style="font-size: 14px; font-weight: 500;">새로운 버전이 준비되었습니다!</span>
        <button id="update-btn" style="background: var(--accent); color: #000; padding: 8px 12px; border-radius: 6px; font-weight: 700; font-size: 13px;">새로고침</button>
    </div>
