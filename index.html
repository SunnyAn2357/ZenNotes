    <style>
        :root {
            --bg: #131314;
            --surface: #1e1e20;
            --surface-hover: #2e2e32;
            --border: #444746;
            --text-main: #e3e3e3;
            --text-muted: #c4c7c5;
            --accent: #78a9ff;
            --danger: #ff6b6b;
            --font-family: 'Pretendard', -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overscroll-behavior-y: none; /* 당겨서 새로고침 완벽 차단 */
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-family);
            display: flex;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
        }
        
        input::placeholder { color: var(--text-muted); }
        
        button {
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

            }

            /* 2. 우측 창 내부 (삼선, 로그인): 사방으로 15px 확장 (기준점 추가) */
            #col-right .toggle-btn { position: relative; }
            #col-right .toggle-btn::after {
                content: ''; position: absolute;
                top: -15px; left: -15px; right: -15px; bottom: -12px;
            }

            /* 3. 좌측 창 '새 노트 작성': 상하로만 5px 확장 (기준점 추가) */
            .col-left .new-note-btn { position: relative; }
            .col-left .new-note-btn::after {
                content: ''; position: absolute;
                top: -8px; bottom: -8px; left: 0; right: 0;
            }

            .trash-pane .nav-header .trash-hamburger { display: none; }

            /* 1. 모바일 액션 메뉴 기준점 */
            .memo-actions-wrap {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: flex-end;
                min-height: 30px;
            }

            /* 2. 삼점(더보기) 버튼: 기본 애니메이션 원천 차단 */
            .btn-more {
                position: absolute;
                right: 0;
                padding: 8px 10px;
                color: var(--text-muted);
                font-size: 14px;
                transition: none; /* 빛의 속도로 반응하기 위해 transition 제거 */
            }

            /* 3. 메뉴 그룹(핀/휴지통): 스르륵 애니메이션 기본 설정 */
            .memo-actions {
                display: flex !important;
                gap: 6px !important;
                align-items: center;
                /* padding-right: 0px; */
                margin-right: -2px !important;
                opacity: 0;
                visibility: hidden;
                transform: translateX(10px);
                transition: opacity 0.25s ease-out, transform 0.25s ease-out, visibility 0.25s ease-out;
            }

            /* 휴지통 패널 전용: 메뉴 위치 왼쪽으로 조정 */
            #trash-list .memo-actions {
                margin-right: -2px !important;
            }

            /* =========================================
               [일반 노트] 메뉴 닫힘 상태
               - 메뉴가 스르륵 사라지고 난 뒤(0.25초 후)에 삼점이 짠! 나타남
            ========================================= */
            .memo-actions-wrap:not(.is-pinned-state):not(.is-menu-open) .btn-more {
                visibility: visible;
                transition: visibility 0s linear 0.25s; /* 메뉴 퇴장 완료까지 대기 */
            }
            .memo-actions-wrap:not(.is-pinned-state):not(.is-menu-open) .memo-actions {
                pointer-events: none;
            }

            /* =========================================
               [일반 노트] 메뉴 열림 상태
               - 삼점은 빛의 속도로(0초) 즉시 투명화 (방해 금지)
               - 삼점 사라진 빈자리에 메뉴가 스르륵 등장
            ========================================= */
            .memo-actions-wrap:not(.is-pinned-state).is-menu-open .btn-more {
                visibility: hidden;
                transition: none; /* 딜레이 없이 즉각 소멸 */
            }
            .memo-actions-wrap:not(.is-pinned-state).is-menu-open .memo-actions {
                opacity: 1;
                visibility: visible;
                transform: translateX(0);
                pointer-events: auto;
            }

            /* =========================================
               [고정된 노트] 공통 (클릭 경쟁 완전 차단)
               - 삼점은 물리적으로 완전 삭제 (display: none)
               - 스르륵 애니메이션 일절 금지 (transition: none)
            ========================================= */
            .memo-actions-wrap.is-pinned-state .btn-more {
                display: none !important; 
            }
            .memo-actions-wrap.is-pinned-state .memo-actions {
                opacity: 1;
                visibility: visible;
                transform: translateX(0);
                transition: none !important; /* 압정은 움직이지 않음 */
                pointer-events: auto;
            }

            /* 고정 닫힘: 휴지통 숨김, 핀만 보임 */
            .memo-actions-wrap.is-pinned-state:not(.is-menu-open) .btn-delete {

                display: none !important;   /* <--- 핀을 밀려나게 해서 삼점자리로 보냄 */

                /* 고정 닫힘: 휴지통 투명화 (자리 유지), 핀 절대 고정
                visibility: hidden !important; 
                pointer-events: none; */

            }
            /* 고정 열림: 핀 옆에 휴지통이 퍽! 나타남 */
            .memo-actions-wrap.is-pinned-state.is-menu-open .btn-delete {
                display: block !important; 
            }

            /* 4. 공통: 모바일 터치 영역 확보 */
            .btn-delete, .btn-pin, .btn-restore, .btn-hard-delete {
                opacity: 0.9 !important;
                padding: 8px !important;	/* 👈 터치 영역 - 기본 8px */
                font-size: 14px !important;	/* 👈 아이콘 크기 - 기본 14px*/
            }
        }

        /* 이미지 조절 핸들 스타일 */
        .ql-image-resize-module .handler {
            background-color: #78a9ff !important;
            border: 1px solid white !important;
            width: 10px !important;
            height: 10px !important;
        }

        /* [추가] 헤더 스마트 붙여넣기 버튼 스타일 */
        .status-container .btn-paste {
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            color: var(--text-muted); /* 기본 색상 */
            transition: color 0.2s ease; /* 부드러운 색상 변화 */
            opacity: 0.8; /* 기본 투명도 */
            /* 👇 이 숫자를 조절해서 왼쪽으로 얼마나 밀지 결정하세요 (예: 15px, 20px 등) */
            margin-right: 16px;
        }

        /* [추가] 마우스 올렸을 때 툴박스처럼 푸른색 효과 */
        .status-container .btn-paste:hover i {
            color: var(--accent) !important;
            opacity: 1;
        }

        /* [추가] 붙여넣기 아이콘 크기 (조절 가능) */
        .status-container .btn-paste i {
            font-size: 12px; /* 기본 크기: status-text보다 살짝 크게 */
        }

        /* [추가] 모바일 화면에서의 버튼 크기 (조절 가능) */
        @media screen and (max-width: 768px) {
            .status-container .btn-paste i {
                font-size: 14px; /* 모바일: 터치 영역 확보를 위해 살짝 크게 */
            }
        }

    </style>
</head>
<body>

    <button id="mobile-left-menu-btn" class="toggle-btn mobile-only" style="position: fixed; top: 24px; left: 10px; z-index: 1000;" onclick="toggleLeftPaneMobile()">
        <i class="fa-solid fa-bars"></i>
    </button>
    
    <div id="mobile-overlay" class="mobile-overlay" onclick="closeAllPanelsMobile()"></div>

    <button id="global-menu-btn" class="toggle-btn" style="position: fixed; top: 24px; right: 20px; z-index: 1000;" onclick="toggleRightPane()">
        <i class="fa-solid fa-ellipsis-vertical"></i>
    </button>

    <div class="col-left" id="col-left">
        <div class="nav-header">
            <button class="toggle-btn" onclick="document.getElementById('col-left').classList.toggle('collapsed')">
                <i class="fa-solid fa-bars"></i>
            </button>
            <button class="new-note-btn" onclick="createNewMemo()" style="color: var(--text-main); font-weight: 600;">
                <i class="fa-solid fa-pen-to-square"></i> <span class="btn-text">새 노트 작성</span>
            </button>
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass" style="font-size: 12px;"></i>
                <input type="text" id="list-search-input" placeholder="노트 검색..." oninput="loadMemoList()">
            </div>
        </div>
        <ul id="memo-list" class="memo-list"></ul>
    </div>

    <div class="col-center">
        <div class="editor-header">
            <input type="text" id="memo-title-input" placeholder="제목 없는 노트">
            <div class="editor-actions">
                <div class="status-container">
                    <button id="btn-paste" class="btn-paste">
                        <i class="fa-solid fa-paste"></i>
                    </button>
                    <span id="status-text" class="status-text">offline</span>
                    <div id="status-dot" class="status-dot logged-out"></div>
                </div>
            </div>
        </div>
        <hr class="print-hr">
        <div class="quill-wrapper">
            <div id="editor"></div>
        </div>
    </div>

    <div class="col-right is-closed" id="col-right">
        <div style="margin-bottom: -16px; display: flex; justify-content: space-between; align-items: center;">
            <button class="toggle-btn" onclick="toggleRightPane()">
                <i class="fa-solid fa-bars"></i>
            </button>
            <button class="toggle-btn" id="btn-auth">
                <i class="fa-brands fa-google"></i>
            </button>
        </div>

        <div class="util-section">
            <div class="util-title">Export & Print</div>
            <button class="util-btn" id="btn-read-memo">
                <i class="fa-solid fa-volume-high"></i> <span class="btn-text">음성으로 읽기</span>
            </button>
            <button class="util-btn" onclick="exportHTML(); closeAllPanelsMobile();">
                <i class="fa-brands fa-html5"></i> <span class="btn-text">HTML 저장</span>
            </button>
            <button class="util-btn" onclick="exportPDF(); closeAllPanelsMobile();">
                <i class="fa-regular fa-file-pdf"></i> <span class="btn-text">PDF 저장</span>
            </button>
            <button class="util-btn" onclick="exportTXT(); closeAllPanelsMobile();">
                <i class="fa-regular fa-file-lines"></i> <span class="btn-text">TXT 저장</span>
            </button>
            <button class="util-btn" onclick="exportJSON(); closeAllPanelsMobile();">
                <i class="fa-solid fa-code"></i> <span class="btn-text">JSON 저장</span>
            </button>
            <button class="util-btn" onclick="window.print(); closeAllPanelsMobile();">
                <i class="fa-solid fa-print"></i> <span class="btn-text">인쇄하기</span>
            </button>
        </div>

        <div class="util-section mt-auto">
            <div class="util-title">Data Management</div>
            <button class="util-btn" onclick="document.getElementById('import-file').click(); closeAllPanelsMobile();">
                <i class="fa-solid fa-file-import"></i> <span class="btn-text">파일 불러오기</span>
            </button>
            <div style="display: flex; gap: 8px;">
                <button class="util-btn" style="flex: 1;" onclick="backupAllData(); closeAllPanelsMobile();">
                    <i class="fa-solid fa-database"></i> <span class="btn-text">전체 백업</span>
                </button>
                <button class="util-btn" style="flex: 1; justify-content: center;" onclick="toggleTrashPane();">
                    <i class="fa-solid fa-trash"></i> <span class="btn-text">휴지통</span>
                </button>
            </div>
            <input type="file" id="import-file" accept=".json, .txt" style="display: none;" onchange="handleFileImport(event)">
        </div>
    </div>

    <div class="trash-pane" id="trash-pane">
        <div class="nav-header">
            <button class="toggle-btn trash-hamburger" onclick="toggleTrashPane()">
                <i class="fa-solid fa-bars"></i>
            </button>            <button class="new-note-btn" onclick="emptyTrash()" style="color: var(--text-main); font-weight: 600;">
                <i class="fa-solid fa-trash-can"></i> <span class="btn-text">비우기(30일이후 영구삭제)</span>
            </button>
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass" style="font-size: 12px;"></i>
                <input type="text" id="trash-search-input" placeholder="휴지통 검색..." oninput="loadTrashList()">
            </div>
        </div>
        <ul id="trash-list" class="memo-list"></ul>
    </div>

    <script>
        function generateSyncId() {
            return Date.now().toString(36) + Math.random().toString(36).substring(2);
        }

        function toggleMemoMenu(e) {
            e.stopPropagation();
            const currentWrap = e.target.closest('.memo-actions-wrap');
            const isCurrentlyOpen = currentWrap.classList.contains('is-menu-open');
            closeAllMemoMenus();
            if (!isCurrentlyOpen) currentWrap.classList.add('is-menu-open');
        }

        function closeAllMemoMenus() {
            document.querySelectorAll('.memo-actions-wrap.is-menu-open').forEach(wrap => {
                wrap.classList.remove('is-menu-open');
            });
        }

        function handlePinClick(id, isPinned, e) {
            e.stopPropagation();
            const wrap = e.target.closest('.memo-actions-wrap');
        
            if (isPinned) {
                if (wrap.classList.contains('is-menu-open')) {
                    togglePin(id, e); 
                } else {
                    closeAllMemoMenus();
                    wrap.classList.add('is-menu-open'); 
        }
            } else {
                togglePin(id, e);
            }
        }

        let tokenRefreshTimer = null;

        function silentTokenRefresh() {
            if (localStorage.getItem('zen_logged_in') === 'true' && tokenClient) {
                console.log(">>> [3단계] 토큰 만료 임박(45분): 백그라운드 갱신 시도");
                tokenClient.requestAccessToken({ prompt: '' });
            }
        }

        function toggleRightPane() {
            const rp = document.getElementById('col-right');
            const gb = document.getElementById('global-menu-btn');

            document.getElementById('trash-pane').classList.remove('is-open');

            if (rp.classList.contains('is-closed')) {
                rp.classList.remove('is-closed');
                gb.style.display = 'none';
                // [수정된 부분] 모바일에서 우측 패널 열 때 투명 방어막(오버레이) 켜기
                if (window.innerWidth <= 768) document.getElementById('mobile-overlay').classList.add('is-active');
            } else {
                rp.classList.add('is-closed');
                gb.style.display = 'flex';
                // [수정된 부분] 모바일에서 우측 패널 닫을 때 방어막 끄기
                if (window.innerWidth <= 768) document.getElementById('mobile-overlay').classList.remove('is-active');
            }
        }

        function toggleTrashPane() {
            const tp = document.getElementById('trash-pane');
            if (tp.classList.contains('is-open')) {
                tp.classList.remove('is-open');
                // [수정된 부분] 휴지통만 닫았는데 우측 패널마저 닫혀있다면 방어막 끄기
                if (window.innerWidth <= 768 && document.getElementById('col-right').classList.contains('is-closed')) {
                    document.getElementById('mobile-overlay').classList.remove('is-active');
                }
            } else {
                tp.classList.add('is-open');
                loadTrashList(); 
                // [수정된 부분] 모바일에서 휴지통 열 때 투명 방어막(오버레이) 켜기
                if (window.innerWidth <= 768) document.getElementById('mobile-overlay').classList.add('is-active');
            }
        }

        // [추가] 다중 선택 모드 방어막 (캡처링 단계)
        // 화면의 다른 버튼이 눌리기 직전에 가장 먼저 가로채서 이벤트를 소멸시킵니다.
        document.addEventListener('click', e => {
            const inMainMulti = isMultiSelectMode || selectedMemos.size > 1;
            const inTrashMulti = isTrashMultiSelectMode || selectedTrashMemos.size > 1;
            
            // 다중 선택 중일 때, 리스트나 메뉴가 아닌 다른 곳(새 노트, 검색창, 중앙 에디터 등)을 클릭했다면
            if ((inMainMulti || inTrashMulti) && !e.target.closest('.memo-item') && !e.target.closest('.memo-actions-wrap')) {
                e.preventDefault();  // 원래 하려던 동작(텍스트박스 포커스 등) 취소
                e.stopPropagation(); // 클릭 이벤트가 버튼(새 노트 작성 등)으로 전달되는 것을 완벽히 차단
                
                if (inMainMulti) {
                    isMultiSelectMode = false;
                    selectedMemos.clear();
                    if (currentMemoId) selectedMemos.add(currentMemoId);
                    loadMemoList(false);
                }
                if (inTrashMulti) {
                    isTrashMultiSelectMode = false;
                    selectedTrashMemos.clear();
                    loadTrashList();
                }
            }
        }, true); // <-- true: 캡처링 활성화. 자바스크립트에서 이벤트를 가장 먼저 낚아챕니다.

        // 기존 화면 닫기 및 메뉴 닫기용 클릭 이벤트 (버블링 단계)
        document.addEventListener('click', e => {
            closeAllMemoMenus();
            const rp = document.getElementById('col-right');
            const tp = document.getElementById('trash-pane');
            const gb = document.getElementById('global-menu-btn');
            
            if (!rp.classList.contains('is-closed') && !rp.contains(e.target) && !tp.contains(e.target) && !gb.contains(e.target)) {
                rp.classList.add('is-closed');
                gb.style.display = 'flex';
            }
            if (tp.classList.contains('is-open') && !tp.contains(e.target) && !rp.contains(e.target) && !gb.contains(e.target)) {
                tp.classList.remove('is-open');
            }
        });

        hljs.configure({ languages:['javascript', 'python', 'html', 'css', 'typescript', 'bash'] });

        const Link = Quill.import('formats/link');
        class CustomLink extends Link {
            static create(v) {
                return super.create(v && !/^https?:\/\//i.test(v) && !/^mailto:/i.test(v) ? 'http://' + v : v);
            }
        }
        Quill.register(CustomLink, true);

        const BlockEmbed = Quill.import('blots/block/embed');
        class DividerBlot extends BlockEmbed { }
        DividerBlot.blotName = 'divider';
        DividerBlot.tagName = 'hr';
        Quill.register(DividerBlot);

        // [1] 이미지 조절 라이브러리를 위한 전역 설정
        window.Quill = Quill;

        // [2] 에디터 본체 설정 (조절 기능 포함)
        const quill = new Quill('#editor', {
            theme: 'snow',
            bounds: '.col-center',
            placeholder: '여기에 지식을 기록하세요...',
            modules: {
                syntax: true,
                imageResize: { displaySize: true }, // 8방향 핸들 활성화
                toolbar: {
                    container: [
                        [{ 'header':[1, 2, 3, false] }],
                        ['bold', 'italic', 'underline', 'strike'],
                        ['blockquote', 'code-block', 'link', 'divider', 'image'],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                        ['clean']
                    ],
                    handlers: {
                        'divider': function() {
                            const r = this.quill.getSelection(true);
                            this.quill.insertText(r.index, '\n', Quill.sources.USER);
                            this.quill.insertEmbed(r.index + 1, 'divider', true, Quill.sources.USER);
                            this.quill.setSelection(r.index + 2, Quill.sources.SILENT);
                        }
                    }
                }
            }
        });

        // [수정] 모바일 툴바 헤더 드롭다운 메뉴 잘림 방지 로직 (MutationObserver 적용)
        const toolbarElement = document.querySelector('.ql-toolbar.ql-snow');
        const headerPicker = document.querySelector('.ql-header.ql-picker');

        if (headerPicker && toolbarElement) {
            const observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    if (mutation.attributeName === 'class') {
                        if (window.innerWidth <= 768) {
                            if (headerPicker.classList.contains('ql-expanded')) {
                                toolbarElement.classList.add('ql-toolbar-dropdown-open');
                            } else {
                                toolbarElement.classList.remove('ql-toolbar-dropdown-open');
                            }
                        }
                    }
                });
            });
            // 헤더 픽커의 클래스 변화만 조용히 감시합니다.
            observer.observe(headerPicker, { attributes: true });
        }

        // [3] 이미지 파일 처리 함수
        const handleImageFiles = (files) => {
            Array.from(files).forEach(file => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const range = quill.getSelection(true);
                        quill.insertEmbed(range.index, 'image', e.target.result);
                        quill.setSelection(range.index + 1);
                    };
                    reader.readAsDataURL(file);
                }
            });
        };

        // [4] 붙여넣기(Ctrl+V/모바일) 핸들러
        quill.root.addEventListener('paste', (e) => {
            const data = (e.clipboardData || e.originalEvent.clipboardData);
            if (!data) return;
            const items = data.items;
            for (const item of items) {
                if (item.type.indexOf('image') !== -1) {
                    handleImageFiles([item.getAsFile()]);
                }
            }
        });

        // [5] 드래그 앤 드롭 핸들러
        ['dragover', 'drop'].forEach(ev => {
            quill.root.addEventListener(ev, (e) => {
                e.preventDefault();
                e.stopPropagation();
            });
        });

        quill.root.addEventListener('drop', (e) => {
            if (e.dataTransfer && e.dataTransfer.files.length > 0) {
                handleImageFiles(e.dataTransfer.files);
            }
        });

        document.getElementById('memo-title-input').addEventListener('keydown', e => {
            if (e.key === 'Tab') {
                e.preventDefault();
                quill.focus();
            }
        });

        const dividerBtn = document.querySelector('.ql-divider');
        if (dividerBtn) {

        };

        function runAutoPurge() {
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');
            store.getAll().onsuccess = e => {
                const now = Date.now();
                const THIRTY_DAYS = 30 * 24 * 60 * 60 * 1000;
                e.target.result.forEach(m => {
                    if (m.isDeleted && m.deletedAt && (now - m.deletedAt > THIRTY_DAYS)) {
                        store.delete(m.id);
                    }
                });
            };

        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        let statusTextTimer = null; // [추가] 상태 문자 증발 방지용 중앙 제어 타이머

        // [수정] UI 상태 중앙 통제실 완벽 개조 (5초 자동 동기화 타이머 완전 삭제)
        function updateUIState(state) {
            const hasToken = gapiInited && gapi.client && gapi.client.getToken() !== null;
            
            // 기존에 돌고 있던 타이머가 있다면 즉시 취소 (상태 꼬임 원천 차단)
            if (statusTextTimer) {
                clearTimeout(statusTextTimer);
                statusTextTimer = null;
            }

            if (state === 'typing' || state === 'saving') {
                if (typingStartTime === 0) typingStartTime = Date.now();
                statusDot.className = 'status-dot unsaved pulse-fast'; 
                statusText.innerText = 'saving'; // [유지] 사용자님의 하드코딩 반영
                statusText.style.opacity = '1';
                
            } else if (state === 'syncing') {
                // [추가] 클라우드 동기화 진행 중 (푸른 점 두근거림)
                statusDot.className = 'status-dot saved pulse-fast'; 
                statusText.innerText = 'syncing'; // [유지] 사용자님의 하드코딩 반영
                statusText.style.opacity = '1';
                
            } else if (state === 'sync-error') {
                // [추가] 클라우드 동기화 실패 (멈춘 붉은 점)
                statusDot.className = 'status-dot unsaved'; 
                statusText.innerText = 'sync error';
                statusText.style.opacity = '1';
                
            } else if (state === 'saved') {
                const elapsed = Date.now() - typingStartTime;
                const remain = typingStartTime > 0 ? Math.max(0, 2000 - elapsed) : 0;
                
                statusTextTimer = setTimeout(() => {
                    if (saveTimer || isSaving) return;
                    typingStartTime = 0; 
                    
                    if (hasToken) {
                        statusDot.className = 'status-dot saved pulse-slow'; 
                        statusText.innerText = 'saved';
                        statusText.style.opacity = '1';
                    } else {
                        statusDot.className = 'status-dot logged-out';
                        statusText.innerText = 'offline';
                        statusText.style.opacity = '1';
                    }
                    
                    // [핵심 변경사항] 5초 자동 동기화 타이머 삭제 완료
                    
                    // 2초 뒤 글자 숨기기 (이 역시 중앙 타이머에 등록하여 통제)
                    statusTextTimer = setTimeout(() => { 
                        if (!saveTimer && !isSaving) {
                            if (hasToken) {
                                statusText.style.opacity = '0';
                                statusDot.className = 'status-dot saved';
                            } else {
                                statusText.innerText = 'offline';
                                statusText.style.opacity = '1';
                                statusDot.className = 'status-dot logged-out';
                            }
                        }
                    }, 2000);
                }, remain);
                
            } else if (state === 'offline-idle') {
                statusDot.className = 'status-dot logged-out';
                statusText.innerText = 'offline';
                statusText.style.opacity = '1';
                typingStartTime = 0;
                
            } else if (state === 'online-idle') {
                // [추가] 온라인 대기 상태 (문자 숨김 처리)
                if (!isSaving && !saveTimer) {
                    statusText.style.opacity = '0';
                    statusDot.className = 'status-dot saved';
                }
            }
        }

        // [기존 유지] 인용구/코드블록 탈출 (공백 추가 로직)
        function escapeFormattingBlock() {
            const range = quill.getSelection(true);
            if (!range) return false;
            const formats = quill.getFormat(range.index);
            if (formats.blockquote || formats['code-block']) {
                let [line, offset] = quill.getLine(range.index);
                while (line && line.next) {
                    let nextIdx = quill.getIndex(line.next);
                    let nextFmt = quill.getFormat(nextIdx);
                    if (!nextFmt.blockquote && !nextFmt['code-block']) break;
                    line = line.next;
                }
                if (line && line.next) {
                    quill.setSelection(quill.getIndex(line.next), 0, Quill.sources.USER);
                } else {
                    let escapeIndex = quill.getIndex(line) + line.length();
                    quill.insertText(escapeIndex, '\n', Quill.sources.USER);
                    quill.setSelection(escapeIndex, Quill.sources.SILENT);
                    quill.removeFormat(escapeIndex, 1);
                }
                return true;
            }
            return false;
        }

        let lastSelection = null;

        /* ==========================================

        document.addEventListener('keydown', (e) => {

                // [1순위] 검색창 처리 (글자 유무에 따라 똑똑하게 분기)
                if (activeId.includes('search-input')) {

                        document.activeElement.dispatchEvent(new Event('input')); 
                        return; // 글자만 지우고 커서 유지 (창 안 닫힘)
                    } else {
                        document.activeElement.blur(); // 빈칸이면 커서 빼고 창 닫기로 직행
                    }
                }

                // [2순위] 다중 선택 모드 해제 (실제 상태 변수 기반)
                const inMainMulti = isMultiSelectMode || selectedMemos.size > 1;
                const inTrashMulti = isTrashMultiSelectMode || selectedTrashMemos.size > 1;

                if (inMainMulti || inTrashMulti) {
                    if (inMainMulti) {

                    }
                    if (document.activeElement) document.activeElement.blur();
                    return; // ★ 방패 작동: 여기서 정확히 멈추므로 창이 닫히지 않습니다.
                }

                // [3순위] 패널 닫기 (휴지통 -> 우측 -> 좌측)
                if (trashPane.classList.contains('is-open')) {
                    toggleTrashPane();
                } else if (!rightPane.classList.contains('is-closed')) {
                    toggleRightPane();
                } else if (leftPane.classList.contains('is-mobile-open')) {
                    toggleLeftPaneMobile();
                } 
            
                // [4순위] 이미지 선택 해제 또는 서식 블록(인용구 등) 탈출
                else {
                    if (!escapeFormattingBlock()) {
                        const selectedImg = document.querySelector('.ql-editor img.ql-selected');
                        if (selectedImg) selectedImg.classList.remove('ql-selected');
                        document.activeElement.blur();

            }

        /* ==========================================
           3. 모바일 환경: 뒤로가기(popstate) 통합 제어
           ========================================== */
        window.addEventListener('popstate', (e) => {
            if (window.innerWidth > 768) return;

            const trashPane = document.getElementById('trash-pane');
            const rightPane = document.getElementById('col-right');
            const leftPane = document.getElementById('col-left');
            const activeId = document.activeElement ? document.activeElement.id : '';

            // [0순위] 에디터 내부 팝업 닫기
            const tooltip = document.querySelector('.ql-tooltip');
            if (tooltip && !tooltip.classList.contains('ql-hidden')) {
                tooltip.classList.add('ql-hidden');
                history.pushState({ page: 'main' }, '');
                return;
            }

            // [1순위] 검색창 처리 (글자 유무에 따라 똑똑하게 분기)
            if (activeId.includes('search-input')) {
                if (document.activeElement.value !== '') {
                    document.activeElement.value = '';
                    document.activeElement.dispatchEvent(new Event('input'));
                    history.pushState({ page: 'main' }, '');
                    return; 
                } else {
                    document.activeElement.blur();
                }
            }

            // [2순위] 다중 선택 모드 해제 (실제 상태 변수 기반)
            const inMainMulti = isMultiSelectMode || selectedMemos.size > 1;
            const inTrashMulti = isTrashMultiSelectMode || selectedTrashMemos.size > 1;

            if (inMainMulti || inTrashMulti) {
                if (inMainMulti) {
                    isMultiSelectMode = false;
                    selectedMemos.clear();
                    if (currentMemoId) selectedMemos.add(currentMemoId);
                    loadMemoList(false);
                }
                if (inTrashMulti) {
                    isTrashMultiSelectMode = false;
                    selectedTrashMemos.clear();
                    loadTrashList();
                }
                if (document.activeElement) document.activeElement.blur();
                history.pushState({ page: 'main' }, '');
                return; // ★ 방패 작동: 창 닫힘 방지
            }

            // [3순위] 패널 닫기 (휴지통 -> 우측/좌측)
            if (trashPane.classList.contains('is-open')) {
                trashPane.classList.remove('is-open');
                if (rightPane.classList.contains('is-closed')) {
                    document.getElementById('mobile-overlay').classList.remove('is-active');
                }
                history.pushState({ page: 'main' }, '');
                return;
            }
            if (!rightPane.classList.contains('is-closed') || leftPane.classList.contains('is-mobile-open')) {
                closeAllPanelsMobile();
                history.pushState({ page: 'main' }, '');
                return;
            }

            // [4순위] 이미지 선택 해제 또는 서식 블록 탈출
            const selectedImg = document.querySelector('.ql-editor img.ql-selected');
            if (selectedImg) {
                selectedImg.classList.remove('ql-selected');
                history.pushState({ page: 'main' }, '');
                return;
            }
            if (escapeFormattingBlock()) {
                history.pushState({ page: 'main' }, '');
                return;
            }

            // [5순위] 앱 종료 방어 및 최종 정리 (가비지 컬렉션 + 최종 저장)
            const now = Date.now();
            if (now - backPressTimer < 2000) {
                if (typeof purgeEmptyMemos === 'function') purgeEmptyMemos(); 
                if (typeof executeSave === 'function') executeSave();
                history.back(); 
            } else {
                backPressTimer = now;
                // [핵심 변경사항] 사용자 요청 문구 적용 완료!
                showExitToast("뒤로가기 버튼을 한 번 더 누르면 종료됩니다.\n(온라인 동기화 → 다음 로그인 시)");
                history.pushState({ page: 'main' }, '');
            }
        });

        function executeSave() {
            if (isSaving || isLoading) {
                pendingSave = true;
                return;
            } 
            const title = document.getElementById('memo-title-input').value.trim() || '제목 없는 노트';
            document.title = title;
            const content = quill.root.innerHTML, plainText = quill.getText();
            
            if (!currentMemoId && !document.getElementById('memo-title-input').value && plainText.trim() === '') {
                updateUIState('saved');
                saveTimer = null;
                return;
            }
            
            isSaving = true;
            updateUIState('saving');
            
            const memoData = { title, content, plainText, updatedAt: Date.now(), isDeleted: false };
            
            if (currentMemoId) {
                memoData.id = currentMemoId;
                const existingMemo = displayedMemos.find(m => m.id === currentMemoId);
                memoData.syncId = (existingMemo && existingMemo.syncId) ? existingMemo.syncId : generateSyncId();
                if (existingMemo && existingMemo.pinnedAt) memoData.pinnedAt = existingMemo.pinnedAt;
            } else {
                memoData.syncId = generateSyncId();
            }

            const tx = db.transaction(['memos'], 'readwrite');
            const req = currentMemoId ? tx.objectStore('memos').put(memoData) : tx.objectStore('memos').add(memoData);
            
            req.onsuccess = e => {
                if (!currentMemoId) currentMemoId = e.target.result;
            };
            
            tx.oncomplete = () => {
                isSaving = false;
                saveTimer = null;
                updateUIState('saved');
                loadMemoList(true);
                if (pendingSave) {
                    pendingSave = false;
                    executeSave();
                }
            };
        }

        function forceSaveImmediate() {
            if (saveTimer) {
                clearTimeout(saveTimer);
                executeSave();
            }
        }

        async function syncDataToCloud() {
            if (!gapiInited || !gapi.client || gapi.client.getToken() === null) return;

            db.transaction(['memos'], 'readonly').objectStore('memos').getAll().onsuccess = async e => {
                const allData = e.target.result;
                
                if (allData.length === 0 && !hasLoadedFromCloud) {
                    console.warn(">>> [보호장치] 로컬이 비어있어 클라우드에 빈 파일을 올리지 않습니다.");
                    return;
                }

                const cloudOptimizedData = allData.map(m => {
                    let clone = Object.assign({}, m);
                    if (clone.content) clone.content = clone.content.replace(/src="data:image[^"]+"/gi, 'src="" data-local-image="true"');
                    return clone;
                });

                try {
                    const token = gapi.client.getToken().access_token;
                    const res = await gapi.client.drive.files.list({
                        q: "name = 'ZenNotes_Backup.json' and trashed = false",
                        fields: 'files(id)'
                    });

                    const file = res.result.files[0];

            const content = JSON.stringify({ type: 'ZenBackup', data: cloudOptimizedData });

                    updateUIState('syncing');

                    if (file) {                        
                        await fetch(`https://www.googleapis.com/upload/drive/v3/files/${file.id}?uploadType=media`, {
                            method: 'PATCH',
                            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                            body: content
                        });
                    } else {
                        const metadata = { name: 'ZenNotes_Backup.json', mimeType: 'application/json', parents: ['root'] };
                        const boundary = '-------314159265358979323846';
                        const delimiter = `\r\n--${boundary}\r\n`;
                        const close_delim = `\r\n--${boundary}--`;

                        const body = delimiter +
                            'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
                            JSON.stringify(metadata) +
                            delimiter +
                            'Content-Type: application/json\r\n\r\n' +
                            content +
                            close_delim;

                        await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': `multipart/related; boundary=${boundary}`
                            },
                            body: body
                        });
                    }

                    console.log("✅ 클라우드 동기화 완료 (이제 확실히 보입니다)");
                    updateUIState('saved'); 
                } catch (err) {
                    console.error("❌ 전송 실패:", err);
                    updateUIState('sync-error'); 
                }
            };
        }

        window.addEventListener('beforeunload', () => {
            purgeEmptyMemos(); // 브라우저 종료 전 쓰레기 메모 청소
            forceSaveImmediate();
            // [핵심 변경사항] PC 종료 시 동기화(syncDataToCloud) 삭제 완료
        });

        // DB 전체를 스캔하여 빈 껍데기 메모를 일괄 영구 삭제하는 함수
        function purgeEmptyMemos() {
            if (!db) return;
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');
            let isPurged = false;

            store.openCursor().onsuccess = e => {
                const cursor = e.target.result;
                if (cursor) {
                    const m = cursor.value;
                    const title = (m.title || '').trim();
                    const isTitleEmptyOrAuto = (title === '' || title === '제목 없는 노트' || title === 'Untitled');
                    
                    const plainText = (m.plainText || '').trim();
                    const contentHTML = m.content || '';
                    const hasNoContent = (plainText === '' && !contentHTML.includes('<img'));

                    if (isTitleEmptyOrAuto && hasNoContent) {
                        cursor.delete(); // 조건에 맞으면 DB에서 즉각 삭제
                        isPurged = true;
                    }
                    cursor.continue();
                }
            };

            tx.oncomplete = () => {
                if (isPurged) {
                    loadMemoList(true); // 폭파된 메모가 있다면 목록 즉시 갱신
                }
            };
        }

        function createNewMemo() {
            forceSaveImmediate(); 
            purgeEmptyMemos(); 
            currentMemoId = null;
            selectedMemos.clear();
            lastSelectedId = null;
            document.getElementById('memo-title-input').value = '';
            document.title = "새 노트";
            quill.root.innerHTML = '';
            updateUIState('saved');
            loadMemoList();
            closeAllPanelsMobile();
        }

        function loadMemoList(queryDB = true) {
            const query = document.getElementById('list-search-input').value.toLowerCase();
            const list = document.getElementById('memo-list');
            const savedScroll = list.scrollTop;
            
            if (queryDB) {
                const tx = db.transaction(['memos'], 'readonly');
                let pinnedMemos = [], normalMemos = [];
                
                tx.objectStore('memos').index('updatedAt').openCursor(null, 'prev').onsuccess = e => {
                    const cursor = e.target.result;
                    if (cursor) {
                        const m = cursor.value;
                        if (!m.isDeleted && (m.title.toLowerCase().includes(query) || (m.plainText && m.plainText.toLowerCase().includes(query)))) {
                            if (m.pinnedAt) pinnedMemos.push(m);
                            else normalMemos.push(m);
                        }
                        cursor.continue();
                    }
                };
                
                tx.oncomplete = () => { 
                    pinnedMemos.sort((a, b) => a.pinnedAt - b.pinnedAt);
                    displayedMemos = [...pinnedMemos, ...normalMemos];
                    list.innerHTML = '';
                    displayedMemos.forEach(m => list.appendChild(createMemoElement(m)));
                    list.scrollTop = savedScroll; 
                };
            } else {
                list.innerHTML = '';
                displayedMemos.forEach(m => list.appendChild(createMemoElement(m)));
                list.scrollTop = savedScroll;
            }
        }

        function loadTrashList() {
            const query = document.getElementById('trash-search-input').value.toLowerCase();
            const list = document.getElementById('trash-list');
            const savedScroll = list.scrollTop;
            
            const tx = db.transaction(['memos'], 'readonly');
            displayedTrashMemos = [];
            
            tx.objectStore('memos').index('updatedAt').openCursor(null, 'prev').onsuccess = e => {
                const cursor = e.target.result;
                if (cursor) {
                    const m = cursor.value;
                    if (m.isDeleted && (m.title.toLowerCase().includes(query) || (m.plainText && m.plainText.toLowerCase().includes(query)))) {
                        displayedTrashMemos.push(m);
                    }
                    cursor.continue();
                }
            };
            
            tx.oncomplete = () => { 
                list.innerHTML = '';
                displayedTrashMemos.forEach(m => list.appendChild(createTrashElement(m)));
                list.scrollTop = savedScroll; 
            };
        }

        function formatDateTime(timestamp) {
            const d = new Date(timestamp);
            const hours = d.getHours().toString().padStart(2, '0');
            const minutes = d.getMinutes().toString().padStart(2, '0');
            return `${d.toLocaleDateString()} ${hours}:${minutes}`;
        }

        function createMemoElement(memo) {
            const li = document.createElement('li');
            
            const isActive = isMultiSelectMode ? selectedMemos.has(memo.id) : (currentMemoId === memo.id || selectedMemos.has(memo.id));
            li.className = `memo-item ${isActive ? 'active' : ''}`;

            li.innerHTML = `
                <div class="memo-info">
                    <span class="memo-title">${memo.title}</span>
                    <span class="memo-date">${formatDateTime(memo.updatedAt)}</span>
                </div>
                <div class="memo-actions-wrap ${memo.pinnedAt ? 'is-pinned-state' : ''}">
                    <div class="memo-actions">
                        <i class="fa-solid fa-thumbtack btn-pin ${memo.pinnedAt ? 'is-pinned' : ''}" onclick="handlePinClick(${memo.id}, ${!!memo.pinnedAt}, event)"></i>
                        <i class="fa-solid fa-trash-can btn-delete" onclick="deleteMemo(${memo.id}, event)"></i>
                    </div>
                    <i class="fa-solid fa-ellipsis-vertical btn-more mobile-only" onclick="toggleMemoMenu(event)"></i>
                </div>`;

            li.addEventListener('mousedown', e => startPress(e, memo.id, false));
            li.addEventListener('touchstart', e => startPress(e, memo.id, false), {passive: true});
            li.addEventListener('mouseup', cancelPress);
            li.addEventListener('mouseleave', cancelPress);
            li.addEventListener('touchend', cancelPress);
            li.addEventListener('touchmove', cancelPress);

            li.onclick = e => {
                if (document.querySelector('.memo-actions-wrap.is-menu-open')) {
                    closeAllMemoMenus();
                    return;
                }
                if (e.target.closest('.memo-actions-wrap')) return; 

                if (isPressTriggered) {
                    isPressTriggered = false;
                    return;
                }

                const isCtrl = e.ctrlKey || e.metaKey;
                const isShift = e.shiftKey;

                if (isMultiSelectMode && !isCtrl && !isShift) {
                    if (selectedMemos.has(memo.id)) {
                        selectedMemos.delete(memo.id);
                        if (selectedMemos.size === 0) isMultiSelectMode = false; 
                    } else {
                        selectedMemos.add(memo.id);
                        lastSelectedId = memo.id;
                    }
                    loadMemoList(false);
                    return; 
                }

                forceSaveImmediate();
                
                if (isShift && lastSelectedId !== null) {
                    const cIdx = displayedMemos.findIndex(m => m.id === memo.id);
                    const lIdx = displayedMemos.findIndex(m => m.id === lastSelectedId);
                    
                    if (cIdx !== -1 && lIdx !== -1) {
                        const start = Math.min(cIdx, lIdx);
                        const end = Math.max(cIdx, lIdx);
                        if (!isCtrl) selectedMemos.clear();
                        for (let i = start; i <= end; i++) selectedMemos.add(displayedMemos[i].id);
                    }
                    loadMemoList(false);
                } else if (isCtrl) {
                    if (selectedMemos.has(memo.id)) selectedMemos.delete(memo.id);
                    else selectedMemos.add(memo.id);
                    lastSelectedId = memo.id;
                    loadMemoList(false);
                } else {
                    selectedMemos.clear();
                    selectedMemos.add(memo.id);
                    lastSelectedId = memo.id;
                    isMultiSelectMode = false; 
                    loadMemo(memo.id);
                }
            };
            return li;

        }

                    return;

                const isCtrl = e.ctrlKey || e.metaKey;
                const isShift = e.shiftKey;

                if (isTrashMultiSelectMode && !isCtrl && !isShift) {
                    if (selectedTrashMemos.has(memo.id)) {
                        selectedTrashMemos.delete(memo.id);
                        if (selectedTrashMemos.size === 0) isTrashMultiSelectMode = false;
                    } else {
                        selectedTrashMemos.add(memo.id);
                        lastSelectedTrashId = memo.id;
                    }
                    loadTrashList();
                    return;
                }
                
                if (isShift && lastSelectedTrashId !== null) {
                    const cIdx = displayedTrashMemos.findIndex(m => m.id === memo.id);
                    const lIdx = displayedTrashMemos.findIndex(m => m.id === lastSelectedTrashId);
                    
                    if (cIdx !== -1 && lIdx !== -1) {
                        const start = Math.min(cIdx, lIdx);
                        const end = Math.max(cIdx, lIdx);
                        if (!isCtrl) selectedTrashMemos.clear();
                        for (let i = start; i <= end; i++) selectedTrashMemos.add(displayedTrashMemos[i].id);
                    }
                    loadTrashList();
                } else if (isCtrl) {
                    if (selectedTrashMemos.has(memo.id)) selectedTrashMemos.delete(memo.id);
                    else selectedTrashMemos.add(memo.id);
                    lastSelectedTrashId = memo.id;
                    loadTrashList();
                } else {
                    selectedTrashMemos.clear();
                    selectedTrashMemos.add(memo.id);
                    lastSelectedTrashId = memo.id;
                    isTrashMultiSelectMode = false; 
                    loadTrashList();
                }

        function togglePin(id, e) {
            e.stopPropagation();
            forceSaveImmediate(); 
            
            const targets = (selectedMemos.has(id) && selectedMemos.size > 1) ? Array.from(selectedMemos) : [id];
            const btn = e.target.closest('.btn-pin');
            const isTargetPinned = btn ? btn.classList.contains('is-pinned') : false;
            
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');
            
            targets.forEach(targetId => {
                store.get(targetId).onsuccess = ev => {
                    const memo = ev.target.result;
                    if (memo) {
                        if (isTargetPinned) delete memo.pinnedAt;
                        else memo.pinnedAt = Date.now();
                        store.put(memo);
                    }
                };
            });
            
            tx.oncomplete = () => {
                loadMemoList(true);
            };
        }

        function loadMemo(id) {

            db.transaction(['memos'], 'readonly').objectStore('memos').get(id).onsuccess = e => {
                const m = e.target.result;
                if (m) {

                    document.getElementById('memo-title-input').value = m.title;
                    document.title = m.title;

        function deleteMemo(id, e) {
            e.stopPropagation();
            const targets = (selectedMemos.has(id) && selectedMemos.size > 1) ? Array.from(selectedMemos) : [id];
            
            if (!confirm(targets.length > 1 ? `선택한 ${targets.length}개의 노트를 휴지통으로 보냅니다.` : '휴지통으로 보내시겠습니까?')) return;
            
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');
            
            targets.forEach(targetId => {
                store.get(targetId).onsuccess = ev => {
                    const memo = ev.target.result;
                    if (memo) {
                        memo.isDeleted = true;
                        memo.deletedAt = Date.now(); 
                        memo.updatedAt = Date.now();
                        store.put(memo);
                    }
                };
            });
            
            tx.oncomplete = () => {
                if (targets.includes(currentMemoId)) createNewMemo();
                else loadMemoList();
                targets.forEach(targetId => selectedMemos.delete(targetId));
            };
        }

        function restoreMemo(id, e) {
            e.stopPropagation();
            const targets = (selectedTrashMemos.has(id) && selectedTrashMemos.size > 1) ? Array.from(selectedTrashMemos) : [id];
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');
            
            targets.forEach(targetId => {
                store.get(targetId).onsuccess = ev => {
                    const memo = ev.target.result;
                    if (memo) {
                        memo.isDeleted = false;
                        delete memo.deletedAt;
                        memo.updatedAt = Date.now();
                        store.put(memo);
                    }
                };
            });
            
            tx.oncomplete = () => {
                targets.forEach(targetId => selectedTrashMemos.delete(targetId));
                loadTrashList();
                loadMemoList();
            };
        }

        function hardDeleteMemo(id, e) {
            e.stopPropagation();
            const targets = (selectedTrashMemos.has(id) && selectedTrashMemos.size > 1) ? Array.from(selectedTrashMemos) : [id];
            if (!confirm(targets.length > 1 ? `선택한 ${targets.length}개의 노트를 영구 삭제하시겠습니까?` : '이 노트를 영구 삭제하시겠습니까? (복구 불가)')) return;
            
            const tx = db.transaction(['memos'], 'readwrite');
            targets.forEach(targetId => tx.objectStore('memos').delete(targetId));
            
            tx.oncomplete = () => {
                targets.forEach(targetId => selectedTrashMemos.delete(targetId));
                loadTrashList();
            };
        }

            const tx = db.transaction(['memos'], 'readwrite');

        }

        // 단일 메모 및 전체 백업 복구 로직 완벽 통합 + 영리한 중복 방지
        function handleFileImport(e) {
            const file = e.target.files[0];
            if(!file) return;
            
            const reader = new FileReader();
            const isTxt = file.name.toLowerCase().endsWith('.txt');
            
            reader.onload = ev => {
                const fileContent = ev.target.result;
                if (isTxt) {
                    createNewMemo();
                    document.getElementById('memo-title-input').value = file.name.replace(/\.[^/.]+$/, "");
                    quill.setText(fileContent);
                    triggerAutoSave();
                    e.target.value = '';
                    return;
                }
                try {
                    const parsed = JSON.parse(fileContent);
                    
                    if (parsed.type === 'ZenBackup') {
                        const tx = db.transaction(['memos'], 'readwrite');
                        const store = tx.objectStore('memos');

                        let restoredCount = 0;
                        let skippedCount = 0;

                        store.getAll().onsuccess = (ev) => {
                            const currentMemos = ev.target.result;
                            
                            const existingMap = new Map();
                            currentMemos.forEach(m => {
                                if (m.syncId) existingMap.set(m.syncId, m);
                            });

                            parsed.data.forEach(m => {
                                if (m.syncId && existingMap.has(m.syncId)) {
                                    const localMemo = existingMap.get(m.syncId);
                                    
                                    if (localMemo.isDeleted) {
                                        localMemo.isDeleted = false;
                                        delete localMemo.deletedAt;
                                        localMemo.updatedAt = Date.now();
                                        store.put(localMemo);
                                        restoredCount++; 
                                    } else {
                                        skippedCount++; 
                                    }
                                    return; 
                                }

                                const isDuplicateContent = currentMemos.some(existing => 
                                    existing.title === m.title && existing.content === m.content
                                );
                                if (isDuplicateContent) {
                                    skippedCount++; 
                                    return;
                                }

                                delete m.id;
                                if (!m.syncId) m.syncId = generateSyncId();
                                store.add(m);
                                restoredCount++; 
                            });
                        };

                        tx.oncomplete = () => {
                            loadMemoList();
                            alert(`복원이 완료되었습니다.\n(복원노트: ${restoredCount}개 / 중복제외: ${skippedCount}개)`);
                        };
                    } else if (parsed.type === 'ZenMemo') {
                        createNewMemo();
                        document.getElementById('memo-title-input').value = parsed.title || file.name.replace(/\.[^/.]+$/, "");
                        quill.root.innerHTML = parsed.content || '';
                        triggerAutoSave();
                    } else {
                        alert('지원하지 않는 JSON 형식입니다.');
                    }
                } catch(err) {
                    alert('파일 읽기 오류가 발생했습니다.');
                }
                e.target.value = ''; 
            };
            reader.readAsText(file);
        }

        let isReading = false;
        document.getElementById('btn-read-memo').addEventListener('click', function() {
            closeAllPanelsMobile(); 
            const synth = window.speechSynthesis;
            const btnIcon = this.querySelector('i');
            const btnText = this.querySelector('.btn-text');
            
            if (isReading || synth.speaking) {
                synth.cancel();
                isReading = false;
                btnIcon.className = 'fa-solid fa-volume-high';
                btnText.innerText = '음성으로 읽기';
                return;
            }
            
            const textToRead = quill.getText().trim();
            if (!textToRead) return;
            
            const utterance = new SpeechSynthesisUtterance(textToRead);
            utterance.lang = /[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(textToRead.substring(0, 50)) ? 'ko-KR' : 'en-US';
            utterance.rate = 1.0; 
            
            utterance.onend = function() {
                isReading = false;
                btnIcon.className = 'fa-solid fa-volume-high';
                btnText.innerText = '음성으로 읽기';

            utterance.onerror = function() {

                btnIcon.className = 'fa-solid fa-volume-high';
                btnText.innerText = '음성으로 읽기';
            };
            
            synth.cancel();
            synth.speak(utterance);
            isReading = true;
            btnIcon.className = 'fa-solid fa-stop';

                    checkAuthState(); 
                }
                return; 
            }
            
            tokenClient.callback = async (resp) => {
                if (resp.error !== undefined) {
                    console.warn(">>> 로그인 실패/취소됨", resp.error);
                    localStorage.removeItem('zen_logged_in');
                    checkAuthState();

                localStorage.setItem('zen_logged_in', 'true');
                checkAuthState(); 
                
                const icon = document.querySelector('#btn-auth i');
                icon.classList.add('blink-active');
                setTimeout(() => icon.classList.remove('blink-active'), 1500);
                
                if (tokenRefreshTimer) clearTimeout(tokenRefreshTimer);
                tokenRefreshTimer = setTimeout(silentTokenRefresh, 45 * 60 * 1000);
                
                smartSync(); 
            };
            
            tokenClient.requestAccessToken({ prompt: 'consent' });
        });

        async function smartSync() {
            if (!gapi.client.getToken() || !db) return;
            console.log(">>> [데이터 우선 복구] 클라우드 확인 시작...");
            try {
                const res = await gapi.client.drive.files.list({
                    q: "name = 'ZenNotes_Backup.json' and trashed = false",
                    fields: 'files(id, name)'
                });

                if (!res.result.files || res.result.files.length === 0) {
                    console.warn(">>> 클라우드에 백업 파일이 없습니다. 로컬 데이터를 업로드합니다.");
                    hasLoadedFromCloud = true;
                    syncDataToCloud(); 
                    return;
                }

                const fileId = res.result.files[0].id;
                const fileRes = await gapi.client.drive.files.get({ fileId: fileId, alt: 'media' });
                
                let cloudData = fileRes.result;
                if (typeof cloudData === 'string') {
                    try { 
                        cloudData = JSON.parse(cloudData).data || []; 
                    } catch(e) { 
                        cloudData = []; 
                    }
                } else {
                    cloudData = cloudData.data || [];
                }

                const tx = db.transaction(['memos'], 'readwrite');
                const store = tx.objectStore('memos');
                
                store.getAll().onsuccess = (e) => {
                    const localData = e.target.result;
                    let needUIUpdate = false;
                    const localMap = new Map(localData.map(m => [m.syncId || m.id.toString(), m]));

                    cloudData.forEach(cloudMemo => {
                        const syncKey = cloudMemo.syncId || cloudMemo.id.toString();
                        const localMemo = localMap.get(syncKey);

                        if (!localMemo) {
                            delete cloudMemo.id; 
                            cloudMemo.syncId = syncKey;
                            store.add(cloudMemo); 
                            needUIUpdate = true;
                        } else if (cloudMemo.updatedAt > localMemo.updatedAt) {
                            let mergedContent = cloudMemo.content;
                            if (localMemo.content) {
                                const localSrcs = [];
                                localMemo.content.replace(/<img[^>]+src="(data:image[^"]+)"/gi, (match, src) => {
                                    localSrcs.push(src);
                                });
                                let imgIndex = 0;
                                mergedContent = mergedContent.replace(/<img[^>]+data-local-image="true"[^>]*>/gi, (match) => {
                                    if (imgIndex < localSrcs.length) {
                                        let restored = match.replace(/src=""/i, `src="${localSrcs[imgIndex]}"`).replace(/ data-local-image="true"/i, '');
                                        imgIndex++;
                                        return restored;
                                    }
                                    return match.replace(/src=""/i, 'src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MCIgaGVpZ2h0PSI1MCI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0iI2VlZSIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LXNpemU9IjEyIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBhbGlnbm1lbnQtYmFzZWxpbmU9Im1pZGRsZSIgZmlsbD0iI2FhYSI+WDwvdGV4dD48L3N2Zz4="');
                                });
                            }
                            cloudMemo.content = mergedContent;
                            cloudMemo.id = localMemo.id; 
                            cloudMemo.syncId = syncKey;
                            store.put(cloudMemo); 
                            needUIUpdate = true;
                        }
                    });

                    tx.oncomplete = () => {
                        console.log(">>> [동기화 병합 완료] 클라우드 로드 성공");
                        hasLoadedFromCloud = true;
                        if (needUIUpdate) loadMemoList();
                        checkAuthState();
                        syncDataToCloud(); 
                    };
                };
            } catch (err) { 
                console.error(">>> [스마트 동기화 오류] 통신 실패:", err); 
                document.getElementById('status-dot').className = 'status-dot unsaved';
            }
        }

        // ============================================================================
        // 모바일 하드웨어 '뒤로가기' 완벽 제어 및 앱 종료 방어(토스트) 로직
        // ============================================================================
        let backPressTimer = 0;

        window.addEventListener('load', () => {
            if (window.innerWidth <= 768) {
                history.pushState({ page: 'main' }, ''); 
            }
        });

        function showExitToast(msg) {
            let toast = document.getElementById('zen-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'zen-toast';
                toast.style.cssText = 'position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:rgba(30,30,32,0.9); color:var(--text-main); border:1px solid var(--border); padding:12px 24px; border-radius:24px; font-size:14px; font-weight:500; z-index:10005; opacity:0; transition:opacity 0.3s ease-in-out; pointer-events:none; white-space:nowrap; box-shadow:0 8px 24px rgba(0,0,0,0.6);';
                document.body.appendChild(toast);
            }
            toast.innerText = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2000); 
        }

    </script>
</body>
</html>
