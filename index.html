    <style>
        :root {
            --bg: #131314;
            --surface: #1e1e20;
            --surface-hover: #2e2e32;
            --border: #444746;
            --text-main: #e3e3e3;
            --text-muted: #c4c7c5;
            --accent: #78a9ff;
            --danger: #ff6b6b;
            --font-family: 'Pretendard', -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overscroll-behavior-y: none; /* 당겨서 새로고침 완벽 차단 */
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-family);
            display: flex;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
        }
        
        input::placeholder { color: var(--text-muted); }
        
        button {
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            color: var(--text-main);
            font-family: inherit;
            font-size: 15px;
            transition: all 0.2s ease;

	/* 🎯 [Pro 통합 버전] 제미나이 UI & 표 깨짐 철통 방어 CSS */

	/* 📊 [Pro의 표 최후 방어선] Quill 1.3.6은 네이티브 표를 지원하지 않지만,

	.ql-editor table {

	/* 다른 기기에서 불러와서 소스가 빈 이미지의 자리 표시자 역할 */

	.ql-editor img[src=""] {
	    min-height: 120px; /* 높이가 0이 되지 않도록 최소 공간 확보 */
	    width: 100%;

	/* 🎯 [No.006] 파일 관리창 리스트 & 경로(Breadcrumbs) 스타일 */
        .fm-breadcrumbs { display: flex; gap: 8px; margin-bottom: 16px; font-size: 14px; color: var(--text-muted); align-items: center; overflow-x: auto; white-space: nowrap; padding-bottom: 4px; }
        .fm-crumb { cursor: pointer; transition: color 0.2s; }
	.fm-crumb:hover i { color: var(--accent) !important; }

	/* 🎯 [수정] 현재 위치(active)여도 클릭할 수 있도록 방어막(pointer-events) 해제 */
        .fm-crumb.active { color: var(--text-main); font-weight: 600; cursor: pointer; }
        .fm-crumb-sep { font-size: 10px; opacity: 0.5; }

        .fm-list { list-style: none; padding: 0; margin: 0; }
	/* 🎯 [수정] 밑줄 제거, 여백 미세조정으로 간격 통일 */
        .fm-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: none; cursor: pointer; transition: background 0.2s; color: var(--text-main); border-radius: 8px; margin-bottom: 4px !important; }
        
        /* 🎯 [신규] 삼점 버튼 터치 반경 1.25배 확대 및 원형 호버 효과 */

        .fm-item-more:hover { background: var(--surface-hover); color: var(--accent) !important; }
        .fm-item:hover { background: var(--surface-hover); }
        
        .fm-item-info { display: flex; align-items: center; gap: 12px; flex: 1; overflow: hidden; }
        .fm-item-icon { font-size: 18px; width: 24px; text-align: center; color: var(--accent); }

        .fm-item-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; font-weight: 500; }
	.fm-item-date { font-size: 12px; color: var(--text-muted); width: 130px !important; text-align: right; flex-shrink: 0; margin-right: 24px; }

        @media screen and (max-width: 768px) {
            .fm-item-date { display: none; } /* 모바일에서는 화면이 좁으므로 날짜 숨김 */
        }
	
	/* 🎯 [No.012] 파일 관리창 팝업 메뉴 스타일 */
        .fm-dropdown { position: absolute; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px 0; box-shadow: 0 4px 16px rgba(0,0,0,0.6); z-index: 2100; min-width: 140px; display: none; }
        .fm-dropdown.is-active { display: block; }
        .fm-dropdown-item { padding: 10px 16px; font-size: 14px; color: var(--text-main); cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background 0.1s; }
        .fm-dropdown-item i { width: 16px; text-align: center; }
        .fm-dropdown-item:hover { background: var(--surface-hover); color: var(--accent); }
        .fm-dropdown-item.danger { color: var(--danger); }
        .fm-dropdown-item.danger:hover { color: #f43f5e; background: rgba(255, 107, 107, 0.1); }
	/* 🎯 [No.013] 이동 목적지 선택 팝업 스타일 */
        .fm-modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 3000; backdrop-filter: blur(4px); }
        .fm-modal { background: var(--surface); border: 1px solid var(--border); width: 90%; max-width: 400px; border-radius: 16px; display: flex; flex-direction: column; max-height: 80vh; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .fm-modal-header { padding: 20px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .fm-modal-body { flex: 1; overflow-y: auto; padding: 12px; }
        .fm-modal-footer { padding: 16px; border-top: 1px solid var(--border); display: flex; gap: 12px; }
        .fm-modal-footer button { flex: 1; justify-content: center; padding: 12px; border-radius: 8px; font-weight: 600; }
	/* 🎯 [No.020] 보안 폴더 비밀번호 팝업 전용 스타일 */
        .sec-input { width: 100%; background: var(--bg); border: 1px solid var(--border); padding: 14px; border-radius: 8px; color: var(--text-main); font-size: 20px; font-weight: 700; margin-bottom: 16px; text-align: center; letter-spacing: 4px; font-family: monospace; transition: border-color 0.2s; }
        .sec-input:focus { border-color: #f59e0b; outline: none; box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2); }
	.fm-dest-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 8px; cursor: pointer; transition: background 0.2s; margin-bottom: 4px; font-size: 13px; }
        .fm-dest-item:hover { background: var(--surface-hover); color: var(--accent); }
        .fm-dest-item.active { background: rgba(120, 169, 255, 0.1); color: var(--accent); border: 1px dashed var(--accent); }

	/* 🎯 [최종 교정] 다중 선택 바 다이어트 및 스크롤 숨김 애니메이션 */
        .fm-bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; max-width: 800px; margin: 0 auto; background: rgba(30, 30, 32, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--border); border-left: 1px solid var(--border); border-right: 1px solid var(--border); border-radius: 16px 16px 0 0; padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 2000; padding-bottom: calc(8px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
        .fm-bottom-bar.is-visible { transform: translateY(0); }
        .fm-bottom-bar.is-hidden-by-scroll { transform: translateY(120%) !important; }
        
        .fm-bottom-btn { background: transparent; color: var(--text-main); border: 1px solid var(--border); padding: 6px 12px; font-size: 13px; border-radius: 8px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
        .fm-bottom-btn:hover { background: var(--surface); }

        /* 🎯 파일 관리창 호버 톤 다운 & 아이콘 투명도 적용 */
        .fm-item.fm-selected { background: rgba(120, 169, 255, 0.15); border-left: 3px solid var(--accent); }
        .fm-item-icon { opacity: 0.6; transition: opacity 0.2s; }
        .fm-item:hover .fm-item-icon { opacity: 1; }
        .fm-item:hover { background: var(--surface); }

        /* 🎯 [전역] 모든 삼선, 삼점, Home 아이콘에 푸른색(Accent) 호버 적용 */
        .toggle-btn:hover, .toggle-btn:hover i { color: var(--accent) !important; }
        .fm-item-more:hover { background: var(--surface); color: var(--accent) !important; }
        .btn-more:hover { color: var(--accent) !important; }
        .fm-crumb { transition: color 0.2s; }
        .fm-crumb:hover, .fm-crumb:hover * { color: var(--accent) !important; }
        
        /* 🎯 파일 목록 칼각 정렬 유지 */
        .memo-actions-wrap { width: 32px !important; display: flex; justify-content: flex-end; flex-shrink: 0; margin-left: 16px; }

    </style>
</head>

    <script>
        function generateSyncId() {
            return Date.now().toString(36) + Math.random().toString(36).substring(2);
        }

        function toggleMemoMenu(e) {
            e.stopPropagation();
            const currentWrap = e.target.closest('.memo-actions-wrap');
            const isCurrentlyOpen = currentWrap.classList.contains('is-menu-open');
            closeAllMemoMenus();
            if (!isCurrentlyOpen) currentWrap.classList.add('is-menu-open');
        }

        function closeAllMemoMenus() {
            document.querySelectorAll('.memo-actions-wrap.is-menu-open').forEach(wrap => {
                wrap.classList.remove('is-menu-open');
            });
        }

        // 🎯 [교정] 핀 아이콘 클릭 시 즉시 고정/해제 실행
        function handlePinClick(id, isPinned, e) {
            e.stopPropagation();
            // 복잡한 메뉴 체크 없이 바로 토글 함수 호출
            togglePin(id, e);
        }

        function toggleRightPane() {
	    if (document.activeElement) document.activeElement.blur(); // 👈 추가
            const rp = document.getElementById('col-right');
            const gb = document.getElementById('global-menu-btn');

            document.getElementById('trash-pane').classList.remove('is-open');

            if (rp.classList.contains('is-closed')) {
                rp.classList.remove('is-closed');
                gb.style.display = 'none';
                // [수정된 부분] 모바일에서 우측 패널 열 때 투명 방어막(오버레이) 켜기
                if (window.innerWidth <= 768) {
		document.getElementById('mobile-overlay').classList.add('is-active');
		history.pushState({ panel: 'right' }, ''); // 👈 이 줄을 추가하세요!
		}
            } else {
                rp.classList.add('is-closed');
                gb.style.display = 'flex';
                // [수정된 부분] 모바일에서 우측 패널 닫을 때 방어막 끄기
                if (window.innerWidth <= 768) document.getElementById('mobile-overlay').classList.remove('is-active');
            }
        }

        function toggleTrashPane() {
	    if (document.activeElement) document.activeElement.blur(); // 👈 추가
            const tp = document.getElementById('trash-pane');
            if (tp.classList.contains('is-open')) {
                tp.classList.remove('is-open');
                // [수정된 부분] 휴지통만 닫았는데 우측 패널마저 닫혀있다면 방어막 끄기
                if (window.innerWidth <= 768 && document.getElementById('col-right').classList.contains('is-closed')) {
                    document.getElementById('mobile-overlay').classList.remove('is-active');
                }
            } else {
                tp.classList.add('is-open');
                loadTrashList(); 
                // [수정된 부분] 모바일에서 휴지통 열 때 투명 방어막(오버레이) 켜기
                if (window.innerWidth <= 768) {
		document.getElementById('mobile-overlay').classList.add('is-active');
		history.pushState({ panel: 'trash' }, ''); // 👈 이 줄을 추가하세요!
		}
            }
        }

        // [추가] 다중 선택 모드 방어막 (캡처링 단계)
        // 화면의 다른 버튼이 눌리기 직전에 가장 먼저 가로채서 이벤트를 소멸시킵니다.
        document.addEventListener('click', e => {
            const inMainMulti = isMultiSelectMode || selectedMemos.size > 1;
            const inTrashMulti = isTrashMultiSelectMode || selectedTrashMemos.size > 1;
            
            // 다중 선택 중일 때, 리스트나 메뉴가 아닌 다른 곳(새 노트, 검색창, 중앙 에디터 등)을 클릭했다면
            if ((inMainMulti || inTrashMulti) && !e.target.closest('.memo-item') && !e.target.closest('.memo-actions-wrap')) {
                e.preventDefault();  // 원래 하려던 동작(텍스트박스 포커스 등) 취소
                e.stopPropagation(); // 클릭 이벤트가 버튼(새 노트 작성 등)으로 전달되는 것을 완벽히 차단
                
                if (inMainMulti) {
                    isMultiSelectMode = false;
                    selectedMemos.clear();
                    if (currentMemoId) selectedMemos.add(currentMemoId);
                    loadMemoList(false);
                }
                if (inTrashMulti) {
                    isTrashMultiSelectMode = false;
                    selectedTrashMemos.clear();
                    loadTrashList();
                }

                            parentId: null, updatedAt: Date.now(), isDeleted: false
                        }).onsuccess = ev => {
                            globalDesktopFolderId = ev.target.result;
                            migrateFiles(globalDesktopFolderId);
                        };
                    } 
                    
                    // 4. 보안 폴더 생성
                    if (!globalSecurityFolderId) {
                        store.add({
                            title: '보안 폴더', type: 'folder', isSystem: 'security',
                            parentId: null, isLocked: true, updatedAt: Date.now(), isDeleted: false
                        }).onsuccess = ev => { globalSecurityFolderId = ev.target.result; };
                    }

                    // 5. 🎯 휴지통 폴더 생성
                    if (!globalTrashFolderId) {
                        store.add({

                            parentId: null, updatedAt: Date.now(), isDeleted: false

		    // 6. 🎯 바탕 화면 백업 폴더 생성 (4대장)

        function updateUIState(state) {

        // [기존 유지] 인용구/코드블록 탈출 (공백 추가 로직)
        function escapeFormattingBlock() {
            const range = quill.getSelection(true);
            if (!range) return false;
            const formats = quill.getFormat(range.index);
            if (formats.blockquote || formats['code-block']) {
                let [line, offset] = quill.getLine(range.index);
                while (line && line.next) {
                    let nextIdx = quill.getIndex(line.next);
                    let nextFmt = quill.getFormat(nextIdx);
                    if (!nextFmt.blockquote && !nextFmt['code-block']) break;
                    line = line.next;
                }
                if (line && line.next) {
                    quill.setSelection(quill.getIndex(line.next), 0, Quill.sources.USER);
                } else {
                    let escapeIndex = quill.getIndex(line) + line.length();
                    quill.insertText(escapeIndex, '\n', Quill.sources.USER);
                    quill.setSelection(escapeIndex, Quill.sources.SILENT);
                    quill.removeFormat(escapeIndex, 1);
                }
                return true;
            }
            return false;
        }

                        m.title = title;
                        m.content = content;
                        m.plainText = plainText;
                        m.updatedAt = Date.now();
                        // parentId와 type은 기존 것을 그대로 유지합니다.
                        store.put(m);
                    }
                };
            } else {
                // 🎯 2. 신규 노트 작성 시: 예약된 폴더가 있으면 거기로, 없으면 바탕화면으로!
                const memoData = {
                    title, content, plainText,
                    updatedAt: Date.now(),
                    isDeleted: false,
                    type: 'file',
                    syncId: generateSyncId(),
                    parentId: targetNewMemoFolderId !== null ? targetNewMemoFolderId : globalDesktopFolderId
                };
                store.add(memoData).onsuccess = e => {
                    currentMemoId = e.target.result;
                };
            }

            tx.oncomplete = () => {
                isSaving = false;
                saveTimer = null;
                updateUIState('saved');
                loadMemoList(true);
                updateUnsyncedCount();
                if (pendingSave) {
                    pendingSave = false;
                    executeSave();
                }
            };
        }

        function forceSaveImmediate() {
            if (saveTimer) {
                clearTimeout(saveTimer);
                executeSave();
            }
        }

        async function syncDataToCloud() {
            if (!gapiInited || !gapi.client || gapi.client.getToken() === null) return;

            db.transaction(['memos'], 'readonly').objectStore('memos').getAll().onsuccess = async e => {
                const allData = e.target.result;
                
                if (allData.length === 0 && !hasLoadedFromCloud) {
                    console.warn(">>> [보호장치] 로컬이 비어있어 클라우드에 빈 파일을 올리지 않습니다.");
                    return;
                }

                const cloudOptimizedData = allData.map(m => {
                    let clone = Object.assign({}, m);
                    if (clone.content) clone.content = clone.content.replace(/src="data:image[^"]+"/gi, 'src="" data-local-image="true"');
                    return clone;
                });

                try {
                    const token = gapi.client.getToken().access_token;
                    const res = await gapi.client.drive.files.list({
                        q: "name = 'ZenNotes_Backup.json' and trashed = false",
                        fields: 'files(id)'
                    });

                    const file = res.result.files[0];

            const content = JSON.stringify({ type: 'ZenBackup', data: cloudOptimizedData });

                    updateUIState('syncing');

                    if (file) {                        
                        await fetch(`https://www.googleapis.com/upload/drive/v3/files/${file.id}?uploadType=media`, {
                            method: 'PATCH',
                            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                            body: content
                        });
                    } else {
                        const metadata = { name: 'ZenNotes_Backup.json', mimeType: 'application/json', parents: ['root'] };
                        const boundary = '-------314159265358979323846';
                        const delimiter = `\r\n--${boundary}\r\n`;
                        const close_delim = `\r\n--${boundary}--`;

                        const body = delimiter +
                            'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
                            JSON.stringify(metadata) +
                            delimiter +
                            'Content-Type: application/json\r\n\r\n' +
                            content +
                            close_delim;

                        await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': `multipart/related; boundary=${boundary}`
                            },
                            body: body
                        });
                    }

					console.log("✅ 클라우드 동기화 완료");
					localStorage.setItem('zen_last_sync_time', Date.now()); // 👈 현재 시간을 '마지막 동기화 시간'으로 기록
					updateUnsyncedCount(); // ns: 0 으로 즉시 초기화
					updateUIState('synced'); 
					setTimeout(() => {
						if (gapi.client && gapi.client.getToken() !== null) {
							gapi.client.setToken(null); 
							localStorage.removeItem('zen_logged_in'); 
							checkAuthState(); 
						}
					}, 7000); // 10초 뒤 조용히 권한 해제
                } catch (err) {
                    console.error("❌ 전송 실패:", err);
                    updateUIState('sync-error'); 
                }
            };
        }

        window.addEventListener('beforeunload', () => {
            purgeEmptyMemos(); // 브라우저 종료 전 쓰레기 메모 청소
            forceSaveImmediate();
            // [핵심 변경사항] PC 종료 시 동기화(syncDataToCloud) 삭제 완료
        });

	// DB 전체를 스캔하여 빈 껍데기 메모를 '유령화(영구 숨김)' 처리하는 함수
	function purgeEmptyMemos() {
	    if (!db) return;
	    const tx = db.transaction(['memos'], 'readwrite');
	    const store = tx.objectStore('memos');
	    let isPurged = false;

	    store.openCursor().onsuccess = e => {
	        const cursor = e.target.result;
	        if (cursor) {
	            const m = cursor.value;
	            const title = (m.title || '').trim();
	            const isTitleEmptyOrAuto = (title === '' || title === '제목 없는 노트' || title === 'Untitled');
            
	            const plainText = (m.plainText || '').trim();
	            const contentHTML = m.content || '';
	            const hasNoContent = (plainText === '' && !contentHTML.includes('<img'));

	            if (isTitleEmptyOrAuto && hasNoContent) {
	                // 🎯 [수정] 즉각 삭제(cursor.delete) 대신 유령 꼬리표 부착!
	                m.isDeleted = true; // 30일 청소부 작동을 위한 조건 1
	                m.deletedAt = Date.now(); // 30일 청소부 작동을 위한 타이머
	                m.isPermanentlyDeleted = true; // 휴지통에서도 숨기기 위한 투명 망토
	                m.updatedAt = Date.now(); // 동기화 서버에 상태 변경 알림
	                cursor.update(m);
	                isPurged = true;
	            }
	            cursor.continue();
	        }
	    };

	    tx.oncomplete = () => {
	        if (isPurged) {
	            loadMemoList(true); // 유령화된 메모가 있다면 목록 즉시 갱신
	            if (typeof updateUnsyncedCount === 'function') updateUnsyncedCount(); // 동기화 카운트 반영
	        }
	    };
	}

	// 🎯 방금까지 편집하던 '현재 노트' 단 1개만 검사해서 빈 껍데기면 유령화시키는 핀셋 함수
	function purgeMemoIfEmpty(memoIdToEvict) {
	    if (!memoIdToEvict || !db) return; 
    
	    const tx = db.transaction(['memos'], 'readwrite');
	    const store = tx.objectStore('memos');
    
	    store.get(memoIdToEvict).onsuccess = e => {
	        const m = e.target.result;
	        if (!m) return;
        
	        const title = (m.title || '').trim();
	        const isTitleEmptyOrAuto = (title === '' || title === '제목 없는 노트' || title === 'Untitled');
	        const plainText = (m.plainText || '').trim();
	        const contentHTML = m.content || '';
	        const hasNoContent = (plainText === '' && !contentHTML.includes('<img'));

	        // 조건에 맞으면 해당 노트 딱 1개만 즉시 유령화
	        if (isTitleEmptyOrAuto && hasNoContent) {
	            // 🎯 [수정] 즉각 삭제(store.delete) 대신 유령 꼬리표 부착!
	            m.isDeleted = true;
	            m.deletedAt = Date.now();
	            m.isPermanentlyDeleted = true; 
	            m.updatedAt = Date.now();
	            store.put(m);
            
	            tx.oncomplete = () => {
	                loadMemoList(true); // 조용히 목록 새로고침
	                if (typeof updateUnsyncedCount === 'function') updateUnsyncedCount(); // 동기화 카운트 반영
	            };
	        }
	    };
	}

	// 🎯 [성능 최적화] 검색창 3종 디바운스(Debounce) 타이머
        let mainSearchTimer = null;
        function triggerMainSearch() {
            if (mainSearchTimer) clearTimeout(mainSearchTimer);
            mainSearchTimer = setTimeout(() => loadMemoList(true), 300);
        }

        let trashSearchTimer = null;
        function triggerTrashSearch() {
            if (trashSearchTimer) clearTimeout(trashSearchTimer);
            trashSearchTimer = setTimeout(() => loadTrashList(), 300);
        }

        let fmSearchTimer = null;
        function triggerFmSearch() {
            if (fmSearchTimer) clearTimeout(fmSearchTimer);
            fmSearchTimer = setTimeout(() => loadFileManager(currentFmFolderId), 300);
        }

	// 🎯 [신규] 스크롤 감지 시 다중 선택 하단 바 숨기기 / 멈추면 보이기
        let fmScrollTimer = null;
        document.querySelector('.fm-body').addEventListener('scroll', () => {
            if (!isFmMultiSelectMode) return; // 다중 선택 모드가 아니면 무시
            
            const bottomBar = document.getElementById('fm-bottom-bar');
            if (bottomBar) {
                bottomBar.classList.add('is-hidden-by-scroll'); // 스크롤 중에는 바닥으로 숨김
                
                if (fmScrollTimer) clearTimeout(fmScrollTimer);
                fmScrollTimer = setTimeout(() => {
                    bottomBar.classList.remove('is-hidden-by-scroll'); // 스크롤 멈추고 0.4초 뒤에 스르륵 등장
                }, 400); 
            }
        });

	// 🎯 [No.006] 파일 관리창 전역 변수 및 렌더링 함수
        let currentFmFolderId = null;
        let fmPath = [{ id: null, title: 'Home' }]; // 빵부스러기 경로 저장용 배열

	function loadFileManager(folderId = null) {
            currentFmFolderId = folderId;
	    // 🎯 오토-락: 빵부스러기나 뒤로가기로 보안 구역 밖으로 나가면 즉시 문을 걸어 잠금!
            if (isSecurityUnlocked && folderId !== globalSecurityFolderId && folderId !== null) {
                // 진입하려는 폴더가 보안 폴더의 하위 자손이 아니면 잠금
                // (isDescendantOf 함수가 아직 선언 전이므로 위치만 체크)
            }
            if (folderId === null) isSecurityUnlocked = false; // 홈으로 가면 무조건 잠금
            const list = document.getElementById('fm-list');
            // 🎯 비동기 버그 원인 제거: 여기서 화면을 지우지 않고 DB 로딩 끝난 뒤에 지웁니다.

            // 1. 경로(Breadcrumb) 업데이트 로직
            const crumbIndex = fmPath.findIndex(p => p.id === folderId);
            if (crumbIndex !== -1) {
                fmPath = fmPath.slice(0, crumbIndex + 1); 
            }
            renderFmBreadcrumbs();

            // 2. DB에서 현재 폴더에 속한 아이템 불러오기
            const tx = db.transaction(['memos'], 'readonly');
            const store = tx.objectStore('memos');

            store.getAll().onsuccess = e => {
                list.innerHTML = ''; // 🎯 해결: DB 데이터를 모두 가져오고, 화면에 그리기 직전에 싹 비웁니다!
                
                const allData = e.target.result;
                const query = document.getElementById('fm-search-input').value.toLowerCase();
                
                // 폴더 가계도(족보) 추적용 맵 생성
                const folderMap = new Map();
                allData.forEach(m => { if (m.type === 'folder') folderMap.set(m.id, m); });
                
                function getTopSystem(parentId) {
                    let curr = parentId;
                    while (curr) {
                        const folder = folderMap.get(curr);
                        if (!folder) return null;
                        if (folder.isSystem) return folder.isSystem;
                        curr = folder.parentId;
                    }
                    return null;
                }

                let items = [];

                // 🎯 [추가] 특정 폴더의 하위(자식, 손자 등) 폴더 소속인지 끝까지 추적하는 함수
                function isDescendantOf(itemParentId, targetFolderId) {
                    let curr = itemParentId;
                    while (curr) {
                        if (curr === targetFolderId) return true;
                        const parentFolder = folderMap.get(curr);
                        if (!parentFolder) break;
                        curr = parentFolder.parentId;
                    }
                    return false;
                }

		// 🎯 오토-락(Auto-Lock): 보안 구역(보안 폴더 본체 또는 그 자손)을 벗어나면 즉시 문을 잠급니다.
                if (isSecurityUnlocked && currentFmFolderId !== globalSecurityFolderId) {
                    if (!isDescendantOf(currentFmFolderId, globalSecurityFolderId)) {
                        isSecurityUnlocked = false;
                    }
                }

                if (query) {
                    // 🎯 스마트 검색 스코프(범위) 분기 처리
                    if (currentFmFolderId === null) {
                        // ① Home: 휴지통, 보안폴더 제외 전역 검색
                        items = allData.filter(m => 
                            !m.isDeleted && 
                            !m.isPermanentlyDeleted && 
                            m.isSystem !== 'security' && 
                            getTopSystem(m.parentId) !== 'security' &&
                            m.isSystem !== 'trash' && 
                            getTopSystem(m.parentId) !== 'trash' &&
                            m.title.toLowerCase().includes(query)
                        );
                    } else if (currentFmFolderId === globalTrashFolderId) {
                        // ② 휴지통 내부: 지워진 항목 중에서만 검색
                        items = allData.filter(m => 
                            m.isDeleted && 
                            !m.isPermanentlyDeleted &&
                            m.title.toLowerCase().includes(query)
                        );
                    } else {
                        // ③ 특정 폴더 내부: 현재 폴더 및 "그 아래에 있는 모든 하위 폴더" 내용물까지 싹 다 검색
                        items = allData.filter(m => 
                            isDescendantOf(m.parentId, currentFmFolderId) && 
                            !m.isDeleted && 
                            !m.isPermanentlyDeleted &&
                            m.title.toLowerCase().includes(query)
                        );
                    }

                } else if (currentFmFolderId === globalTrashFolderId) {
                    items = allData.filter(m => m.isDeleted && !m.isPermanentlyDeleted);
                } else {
                    items = allData.filter(m => m.parentId === currentFmFolderId && !m.isDeleted && !m.isPermanentlyDeleted);
                }

                items.sort((a, b) => {
                    if (currentFmFolderId === null && !query) {
			const order = { 'desktop': 1, 'security': 2, 'trash': 3, 'backup': 4 };
                        const aOrder = order[a.isSystem] || 99;
                        const bOrder = order[b.isSystem] || 99;
                        if (aOrder !== bOrder) return aOrder - bOrder;
                    }
                    if (a.type === 'folder' && b.type !== 'folder') return -1;
                    if (a.type !== 'folder' && b.type === 'folder') return 1;
                    return b.updatedAt - a.updatedAt;
                });

                items.forEach(m => {
                    const li = document.createElement('li');
                    
                    // 🎯 선택 모드일 때 선택된 항목이면 CSS 클래스(파란색 배경) 추가
                    const isSelected = isFmMultiSelectMode && fmSelectedItems.has(m.id);
                    li.className = `fm-item ${isSelected ? 'active fm-selected' : ''}`;
                    
                    // 🎯 2. 소속(족보)에 따른 색상 동기화 (우선순위 교정)
                    const topSys = m.isSystem || getTopSystem(m.parentId);
                    let iconColorStyle = 'color: var(--text-muted);'; // 일반 폴더/파일은 평범한 회색
                    
                    // 🎯 [0순위] 삭제된 파일이거나 휴지통 소속이면 무조건 빨간색 렌즈 장착!
                    if (m.isDeleted || topSys === 'trash' || m.isSystem === 'trash') {
                        iconColorStyle = 'color: var(--danger);'; 
                    } 
                    // 🎯 [1순위] 보안 폴더 소속이면 노란색
                    else if (topSys === 'security') {
                        iconColorStyle = 'color: #f59e0b;'; 
                    } 
                    // 🎯 [2순위] 바탕화면 소속이면 파란색
                    else if (topSys === 'desktop') {
                        iconColorStyle = 'color: var(--accent);'; 
                    }

		    // 🎯 [추가] 백업 폴더 소속이면 세이지 그린
                    else if (topSys === 'backup') {
                        iconColorStyle = 'color: #8ba888;'; 
                    }
                    // 🎯 3. 아이콘 모양 (모양은 그대로 유지)
                    let iconClass = 'fa-regular fa-file-lines';
                    if (m.type === 'folder') {
                        iconClass = 'fa-solid fa-folder';
                        // 🎯 [수정] 바탕화면도 예쁜 전용 모니터 아이콘으로 변경!
                        if (m.isSystem === 'desktop') iconClass = 'fa-solid fa-desktop';
                        if (m.isSystem === 'security') iconClass = 'fa-solid fa-lock'; 
                        if (m.isSystem === 'trash') iconClass = 'fa-solid fa-trash-can';
			if (m.isSystem === 'backup') iconClass = 'fa-solid fa-box-archive';
                    }

		    // 🎯 폴더도 날짜를 표시하여 레이아웃 붕괴 방지 및 시각적 구분선 역할 수행
                    const dateHtml = formatDateTime(m.updatedAt);

                    // 🎯 3대장도 뼈대 통일을 위해 삼점 버튼을 부여함
                    const isTrashMode = (currentFmFolderId === globalTrashFolderId || m.isDeleted);
                    const sysType = m.isSystem || ''; // 시스템 폴더 종류 전달
                    let moreBtnHtml = `
                        <div class="memo-actions-wrap">
                            <i class="fa-solid fa-ellipsis-vertical fm-item-more" onclick="openFmItemMenu(event, ${m.id}, '${m.type}', ${isTrashMode}, '${sysType}')"></i>
                        </div>`;

                    li.innerHTML = `
                        <div class="fm-item-info">
                            <i class="${iconClass} fm-item-icon" style="${iconColorStyle}"></i>
                            <span class="fm-item-title">${m.title}</span>
                        </div>
                        <div class="fm-item-date">${dateHtml}</div>
                        ${moreBtnHtml}
                    `;

                    // 🎯 [신규] 롱프레스 이벤트 센서 달기
                    li.addEventListener('mousedown', e => startFmPress(e, m));
                    li.addEventListener('touchstart', e => startFmPress(e, m), {passive: true});
                    li.addEventListener('mouseup', cancelPress);
                    li.addEventListener('mouseleave', cancelPress);
                    li.addEventListener('touchend', cancelPress);
                    li.addEventListener('touchmove', cancelPress, {passive: true});

                    li.onclick = (e) => {
                        if (e.target.closest('.memo-actions-wrap')) return;
                        
                        // 🎯 꾹 눌러서 다중 선택이 켜진 직후에 딸려오는 단순 '클릭(onclick)' 무시
                        if (isPressTriggered) {
                            isPressTriggered = false;
                            return;
                        }
                        
                        // 🎯 다중 선택 모드일 때 클릭하면 (파일 여는 대신) 선택 체크/해제
                        if (isFmMultiSelectMode) {
                            if (m.isSystem === 'desktop' || m.isSystem === 'security' || m.isSystem === 'trash' || m.isSystem === 'backup') {
				showToast("시스템 폴더는 선택할 수 없습니다."); return;
			    }

                            if (fmSelectedItems.has(m.id)) fmSelectedItems.delete(m.id);
                            else fmSelectedItems.add(m.id);
                            
                            updateFmBottomBar();
                            loadFileManager(currentFmFolderId); // 🎯 다시 그려서 파란 줄 입히기
                            return;
                        }
                        
                        if (m.type === 'folder') {
                            if (m.isSystem === 'security') {
                                if (isSecurityUnlocked) {
                                    enterSecurityFolder(); // 이미 풀려있으면 바로 진입
                                } else {
                                    const hasPw = localStorage.getItem('zen_sec_hash');
                                    openSecurityModal(hasPw ? 'enter' : 'setup'); // 비밀번호 유무에 따라 팝업 분기
                                }
                                return; 
                            }
                            // 🎯 폴더 진입 시 히스토리 기록
                            fmPath.push({ id: m.id, title: m.title });
                            history.pushState({ fmOpen: true, fmFolderId: m.id, fmPath: fmPath }, '');
                            loadFileManager(m.id);
			    } else {
                            // 🎯 삭제된 노트는 아예 열리지 않도록 조용히 차단 (안내문구 없음)
                            if (m.isDeleted || currentFmFolderId === globalTrashFolderId) return;

                            closeFileManager();
                            loadMemo(m.id);
                        }
                    };

                    list.appendChild(li);
                });
            };
        }

        // 경로(Breadcrumb)를 HTML로 그려주는 함수

	function renderFmBreadcrumbs() {
            const container = document.getElementById('fm-breadcrumbs');
            container.innerHTML = '';
            fmPath.forEach((p, index) => {
                const isLast = index === fmPath.length - 1;
                const span = document.createElement('span');
                span.className = `fm-crumb ${isLast ? 'active' : ''}`;
                span.innerHTML = p.id === null ? `<i class="fa-solid fa-house" style="margin-right:6px;"></i>${p.title}` : p.title;
                
                // 🎯 [핵심] 현재 위치이든 아니든 무조건 클릭 이벤트를 연결합니다.
                span.onclick = () => {
                    const si = document.getElementById('fm-search-input');

	// 1. 새 폴더 생성
        function createNewFolder() {
            const name = prompt('새 폴더 이름을 입력하세요:', '새 폴더');
            if (!name || name.trim() === '') return;
            
            // 🎯 바탕화면 강제 배정 삭제! 현재 위치(Home이면 null)에 그대로 생성됨
            const parent = currentFmFolderId; 
            const tx = db.transaction(['memos'], 'readwrite');
            tx.objectStore('memos').add({
                title: name.trim(), type: 'folder', parentId: parent, updatedAt: Date.now(), isDeleted: false
            });
            // 🎯 확실히 DB 저장이 끝난 뒤(oncomplete) 화면 새로고침
            tx.oncomplete = () => loadFileManager(currentFmFolderId); 
        }

        // 2. 이름 바꾸기
        function fmRename(id) {
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');
            store.get(id).onsuccess = e => {
                const m = e.target.result;
                if (!m) return;
                const newName = prompt('새 이름을 입력하세요:', m.title);
                if (!newName || newName.trim() === '' || newName === m.title) return;
                
                m.title = newName.trim();
                m.updatedAt = Date.now();
                store.put(m);
            };
            tx.oncomplete = () => {
                loadFileManager(currentFmFolderId);
                loadMemoList(true);
            };
        }

        // 3. 파일 복사본 만들기
        function fmDuplicate(id) {
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');
            store.get(id).onsuccess = e => {
                const m = e.target.result;
                if (!m || m.type === 'folder') return;
                
		const clone = { ...m, syncId: generateSyncId(), title: `(사본) ${m.title}`, updatedAt: Date.now() };
                delete clone.id; // 🎯 복사본에 완전히 새로운 ID가 발급되도록 기존 ID 폐기
                store.add(clone);
            };
            tx.oncomplete = () => {
                loadFileManager(currentFmFolderId);
                loadMemoList(true);
            };
        }

        // 4. 휴지통으로 이동
        function fmDelete(id) {
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');
            store.get(id).onsuccess = e => {
                const m = e.target.result;
                if (!m) return;
                m.isDeleted = true;
                m.deletedAt = Date.now();
                m.updatedAt = Date.now();
                store.put(m);
            };
            tx.oncomplete = () => {
                loadFileManager(currentFmFolderId);
                loadMemoList(true);
                updateUnsyncedCount();
            };
        }

        // 5. 복구하기
        function fmRestore(id) {
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');
            store.get(id).onsuccess = e => {
                const m = e.target.result;
                if (!m) return;
                m.isDeleted = false;
                delete m.deletedAt;
                m.updatedAt = Date.now();
                store.put(m);
            };
            tx.oncomplete = () => {
                loadFileManager(currentFmFolderId);
                loadMemoList(true);
                updateUnsyncedCount();
            };
        }

        // 6. 영구 삭제
        function fmHardDelete(id) {
            if (!confirm('이 항목을 삭제하시겠습니까?')) return;
            const tx = db.transaction(['memos'], 'readwrite');
            tx.objectStore('memos').get(id).onsuccess = e => {
                const m = e.target.result;
                if (!m) return;
                m.isPermanentlyDeleted = true;
                m.updatedAt = Date.now();
                tx.objectStore('memos').put(m);
            };
            tx.oncomplete = () => {
                loadFileManager(currentFmFolderId);
                updateUnsyncedCount();
            };
        }

        let movingItemIds = []; // 단일/다중 이동을 모두 담는 배열로 업그레이드!
        let selectedDestId = null;

        // 비밀번호를 복호화 불가능한 난수(Hash)로 변환하는 함수
        async function hashPassword(password) {
            const msgBuffer = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

		// 🎯 비밀번호 제출 및 마스터키/2중 검증 로직
		async function submitSecurityPassword() {
			const input = document.getElementById('sec-password-input');
			const desc = document.getElementById('sec-modal-desc');
			const btn = document.getElementById('sec-confirm-btn');
			const pw = input.value.trim();
    
			if (!pw) { showToast('비밀번호를 입력하세요.'); return; }

			const savedHash = localStorage.getItem('zen_sec_hash');
			const step = input.dataset.step;

			// ----------------------------------------------------
			// 1. 잠금 해제 (Enter) & 마스터키 로직
			// ----------------------------------------------------
			if (securityMode === 'enter') {
				// 🚨 마스터키 감지 (최우선 실행)
				if (pw === 'abcde12345') {
					showToast('마스터키가 확인되었습니다. 새 비밀번호를 설정해주세요.');
					openSecurityModal('setup'); // 새 비번 설정 창으로 즉시 전환
					return;
				}

				const hash = await hashPassword(pw);
				if (hash === savedHash) {
					isSecurityUnlocked = true;
					closeSecurityModal();
					enterSecurityFolder();
				} else {
					showToast('비밀번호가 일치하지 않습니다.');
					input.value = '';
					input.focus();
				}
			} 
			// ----------------------------------------------------
			// 2. 새 비밀번호 설정 (Setup) - 2단계 확인
			// ----------------------------------------------------
			else if (securityMode === 'setup') {
				if (step === '1') {
					tempSecPassword = pw; // 1차 입력값 기억
					input.dataset.step = '2';
					input.value = '';
					desc.innerHTML = '<b>1번 더 입력하세요.</b>'; // UI 문구 변경
					btn.innerText = '설정 완료';
					input.focus();
				} else if (step === '2') {
					if (pw === tempSecPassword) {
						// 1차 입력값과 일치하면 최종 저장
						const hash = await hashPassword(pw);
						localStorage.setItem('zen_sec_hash', hash);
						showToast('비밀번호가 안전하게 설정되었습니다.');
						closeSecurityModal();
						isSecurityUnlocked = true;
						enterSecurityFolder();
					} else {
						showToast('비밀번호가 일치하지 않습니다. 처음부터 다시 입력해주세요.');
						openSecurityModal('setup'); // 1단계로 강제 초기화
					}
				}
			} 
			// ----------------------------------------------------
			// 3. 비밀번호 변경 (Change) - 3단계 확인
			// ----------------------------------------------------
			else if (securityMode === 'change') {
				if (step === '1') {
					const hash = await hashPassword(pw);
					if (hash === savedHash) {
						// 현재 비번이 맞으면 새 비번 입력 단계로 이동
						input.dataset.step = '2';
						input.value = '';
						desc.innerHTML = '<b>새 비밀번호</b>를 입력하세요.';
						input.focus();
					} else {
						showToast('현재 비밀번호가 틀렸습니다.');
						input.value = '';
						input.focus();
					}
				} else if (step === '2') {
					tempSecPassword = pw; // 새 비번 1차 입력값 기억
					input.dataset.step = '3';
					input.value = '';
					desc.innerHTML = '<b>1번 더 입력하세요.</b>'; // UI 문구 변경
					btn.innerText = '변경 완료';
					input.focus();
				} else if (step === '3') {
					if (pw === tempSecPassword) {
						// 새 비번 1차 입력값과 일치하면 최종 저장
						const hash = await hashPassword(pw);
						localStorage.setItem('zen_sec_hash', hash);
						showToast('비밀번호가 성공적으로 변경되었습니다.');
						closeSecurityModal();
					} else {
						showToast('비밀번호가 일치하지 않습니다. 새 비밀번호를 다시 입력해주세요.');
						// 2단계(새 비번 다시 입력)로 되돌림
						input.dataset.step = '2';
						input.value = '';
						desc.innerHTML = '<b>새 비밀번호</b>를 입력하세요.';
						btn.innerText = '다음';
						input.focus();
					}
				}
			}
		}

        // 🎯 [킬 스위치] 지인들의 뼈아픈 경험을 위한 비상 삭제 시스템
        function emergencyDeleteSecurity() {
            document.getElementById('fm-global-menu').classList.remove('is-active');
            if (!localStorage.getItem('zen_sec_hash')) {
                showToast("설정된 비밀번호가 없어 삭제할 내용이 없습니다."); return;
            }

            const confirmText = prompt('🚨  [모든 내용 삭제] + [비번 초기화]  🚨\n       "동의"라고 입력하세요.');
            if (confirmText !== '동의') {
                showToast('비상 삭제가 취소되었습니다.'); return;
            }

            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');

            store.getAll().onsuccess = e => {
                const allData = e.target.result;
                const folderMap = new Map();
                allData.forEach(m => { if (m.type === 'folder') folderMap.set(m.id, m); });

                function isDescendantOfSec(parentId) {
                    let curr = parentId;
                    while (curr) {
                        if (curr === globalSecurityFolderId) return true;
                        const pf = folderMap.get(curr);
                        if (!pf) break;
                        curr = pf.parentId;
                    }
                    return false;
                }

                allData.forEach(m => {
                    if (m.isSystem === 'security') return; // 폴더 껍데기는 살려둠
                    // 보안폴더 직속이거나 하위 자손이면 가차 없이 DB에서 완전 삭제!
                    if (m.parentId === globalSecurityFolderId || isDescendantOfSec(m.parentId)) {
                        store.delete(m.id);
                    }
                });
            };

            tx.oncomplete = () => {
                localStorage.removeItem('zen_sec_hash'); // 비번 초기화
                isSecurityUnlocked = false; // 잠금 상태 초기화
                showToast('보안 폴더 데이터가 삭제되고 비밀 번호가 초기화되었습니다.');
                resetFmToHome(); // 무조건 안전한 홈으로 쫓아냄
            };
        }

        let fmSelectedItems = new Set();

	// 🎯 [신규] 파일 관리창 전용 롱프레스(길게 누르기) 다중 선택 진입
        function startFmPress(e, m) {
            if (e.target.closest('.memo-actions-wrap')) return; // 메뉴 터치 시 무시
            if (e.type === 'touchstart' && e.touches.length > 1) return; // 멀티터치 무시

            // 🎯 4대장(시스템 폴더)은 롱프레스 다중 선택에서 제외
            if (m.isSystem === 'desktop' || m.isSystem === 'security' || m.isSystem === 'trash' || m.isSystem === 'backup') return;

            isPressTriggered = false;
            pressTimer = setTimeout(() => {
                isPressTriggered = true;
                if (navigator.vibrate) navigator.vibrate(50); // 햅틱 피드백

                if (!isFmMultiSelectMode) {
                    fmSelectedItems.clear();
                    isFmMultiSelectMode = true;
		    history.pushState({ mode: 'multi' }, ''); // 👈 3. 파일관리창 방어막 추가!
                }
                
                fmSelectedItems.add(m.id); // 꾹 누른 녀석을 첫 번째로 선택
                document.getElementById('fm-global-menu').classList.remove('is-active');
                
                updateFmBottomBar();
                loadFileManager(currentFmFolderId); // 체크박스 렌더링
            }, 500); // 0.5초 꾹 누르면 발동
        }

        // 🎯 위치에 따라 하단 바 버튼 세팅을 다르게 렌더링
        function updateFmBottomBar() {
            const bar = document.getElementById('fm-bottom-bar');
            const countLabel = document.getElementById('fm-selected-count');
            const btnGroup = document.getElementById('fm-bottom-btn-group');

            // 🎯 [수정] 모드가 켜져있다면 아이템이 0개여도 하단 바를 숨기지 않습니다.
	    if (isFmMultiSelectMode) {
	        bar.classList.add('is-visible');
	        countLabel.innerText = `${fmSelectedItems.size}개 선택됨`;
                
                if (currentFmFolderId === globalTrashFolderId) {
                    // 휴지통 전용 버튼
                    btnGroup.innerHTML = `
                        <button class="fm-bottom-btn" onclick="fmBatchRestore()"><i class="fa-solid fa-rotate-left" style="color: var(--accent);"></i> <span style="color: var(--accent);">복구</span></button>
                        <button class="fm-bottom-btn" onclick="fmBatchHardDelete()"><i class="fa-solid fa-xmark" style="color: var(--danger);"></i> <span style="color: var(--danger);">삭제</span></button>
                    `;
                } else {
                    // 일반 폴더 버튼
                    btnGroup.innerHTML = `
                        <button class="fm-bottom-btn" onclick="openFmBatchMoveModal()"><i class="fa-solid fa-arrows-up-down-left-right" style="color: var(--accent);"></i> <span style="color: var(--accent);">이동</span></button>
                        <button class="fm-bottom-btn" onclick="fmBatchDelete()"><i class="fa-solid fa-trash-can" style="color: var(--danger);"></i> <span style="color: var(--danger);">삭제</span></button>
                    `;
                }
            } else {
                bar.classList.remove('is-visible');
            }
        }

        // 🎯 일괄 영구 삭제 처리
        function fmBatchHardDelete() {
            if (fmSelectedItems.size === 0) { showToast("삭제할 항목을 선택해주세요."); return; }
            if (!confirm(`선택한 ${fmSelectedItems.size}개의 항목을 삭제하시겠습니까?`)) return;
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');
            fmSelectedItems.forEach(id => {
                store.get(id).onsuccess = e => {
                    const m = e.target.result;
                    if (m) { m.isPermanentlyDeleted = true; m.updatedAt = Date.now(); store.put(m); }
                };
            });
            tx.oncomplete = () => { cancelFmMultiSelect(); loadTrashList(); updateUnsyncedCount(); showToast("삭제되었습니다."); };
        }

        function startFmMultiSelect() {
            document.getElementById('fm-global-menu').classList.remove('is-active');
	    if (!isFmMultiSelectMode) {
                history.pushState({ mode: 'multi' }, ''); // 👈 4. 메뉴를 통한 실행 방어막 추가!
            }
            isFmMultiSelectMode = true;
            fmSelectedItems.clear();
            updateFmBottomBar();
            loadFileManager(currentFmFolderId); // 체크박스 모드로 새로고침
        }

        function cancelFmMultiSelect() {
            isFmMultiSelectMode = false;
            fmSelectedItems.clear();
            updateFmBottomBar();
            loadFileManager(currentFmFolderId);
        }

        // 단일 항목 이동 (기존 팝업에서 호출)
        function openMoveModal(id) {
            movingItemIds = [id]; // 배열에 하나만 담음
            selectedDestId = null;
            document.getElementById('fm-item-menu').classList.remove('is-active');
            document.getElementById('fm-move-modal').style.display = 'flex';
            renderDestFolders();
        }

        // 🎯 일괄 이동 (하단 액션바에서 호출)
        function openFmBatchMoveModal() {
            if (fmSelectedItems.size === 0) { showToast("이동할 항목을 선택해주세요."); return; }
            movingItemIds = Array.from(fmSelectedItems); // 선택된 놈들을 싹 다 배열로!

        // 🎯 일괄 삭제 (하단 액션바에서 호출)
        function fmBatchDelete() {
            if (fmSelectedItems.size === 0) { showToast("삭제할 항목을 선택해주세요."); return; }
            if (!confirm(`선택한 ${fmSelectedItems.size}개의 항목을 휴지통으로 보냅니다.`)) return;

            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');
            
            fmSelectedItems.forEach(id => {
                store.get(id).onsuccess = e => {
                    const m = e.target.result;
                    if (m && m.isSystem !== 'desktop' && m.isSystem !== 'security' && m.isSystem !== 'trash') {
                        m.isDeleted = true;
                        m.deletedAt = Date.now();
                        m.updatedAt = Date.now();
                        store.put(m);
                    }
                };
            });
            
            tx.oncomplete = () => {
                cancelFmMultiSelect(); // 삭제 완료 후 모드 종료
                loadMemoList(true);
                updateUnsyncedCount();
            };
        }

        function closeMoveModal() {
            document.getElementById('fm-move-modal').style.display = 'none';
            movingItemId = null;
        }

	function renderDestFolders() {
            const container = document.getElementById('fm-dest-list');
            container.innerHTML = '<div style="padding:10px; font-size:12px; color:var(--text-muted);">이동할 위치를 선택하세요:</div>';

            const tx = db.transaction(['memos'], 'readonly');
            tx.objectStore('memos').getAll().onsuccess = e => {
                const allData = e.target.result;
                
                // 🎯 1. 폴더 가계도 생성
                const folderMap = new Map();
                allData.forEach(m => { if (m.type === 'folder') folderMap.set(m.id, m); });
                
                // 🎯 2. 목적지 자격 검사 (휴지통 소속이거나, 선택한 항목의 자식이면 안됨)
                function isValidDestination(folderId) {
                    if (movingItemIds.includes(folderId)) return false; // 내 자신에게 이동 불가
                    let curr = folderId;
                    while (curr) {
                        if (movingItemIds.includes(curr)) return false; // 내 자식 폴더들 안으로도 이동 불가
                        const f = folderMap.get(curr);
                        if (!f) break;
                        // 조상 중에 하나라도 휴지통 소속이거나 삭제 상태면 탈락!
                        if (f.isDeleted || f.isSystem === 'trash') return false; 
                        curr = f.parentId;
                    }
                    return true;
                }

                // 🎯 3. 전체 경로 텍스트 다이어트 (군더더기 접두사 제거)
                function getFolderPath(folderId) {
                    if (folderId === null) return 'Home';
                    let path = [];
                    let curr = folderId;
                    while (curr) {
                        const f = folderMap.get(curr);
                        if (!f) break;
                        path.unshift(f.title);
                        curr = f.parentId;
                    }
                    return path.join(' / '); // 앞에 붙던 Home / 제거
                }

                // 🎯 4. 상단 고정 4대장 리스트업 (텍스트 다이어트 완료)
                const systemItems = [
                    { id: null, title: 'Home', icon: 'fa-house', color: 'var(--text-main)' },
                    { id: globalDesktopFolderId, title: '바탕 화면', icon: 'fa-desktop', color: 'var(--accent)' },
                    { id: globalSecurityFolderId, title: '보안 폴더', icon: 'fa-lock', color: '#f59e0b' },
                    { id: globalBackupFolderId, title: '바탕 화면 백업', icon: 'fa-box-archive', color: '#8ba888' } // 🎯 백업 폴더 등재
                ];

                systemItems.forEach(sys => {
                    if (isValidDestination(sys.id)) {
                        container.appendChild(createDestItem(sys.id, sys.title, sys.icon, sys.color));
                    }
                });

                container.appendChild(document.createElement('hr')).style.cssText = "margin:8px 0; border:none; border-top:1px solid var(--border);";

                // 🎯 5. 유령 폴더를 제외한 '진짜 일반 폴더들' 전체 경로로 출력
                const validFolders = allData.filter(m => m.type === 'folder' && !m.isSystem && isValidDestination(m.id));
                
                // 보기 좋게 이름(경로) 알파벳 순으로 정렬
                validFolders.sort((a, b) => getFolderPath(a.id).localeCompare(getFolderPath(b.id)));

                validFolders.forEach(f => {
                    container.appendChild(createDestItem(f.id, getFolderPath(f.id), 'fa-folder', 'var(--text-main)'));
                });
            };
        }

        // 🎯 6. 아이콘 색상 및 긴 글자 자동 줄바꿈 적용
        function createDestItem(id, title, icon, colorStyle) {
            const div = document.createElement('div');
            div.className = `fm-dest-item ${selectedDestId === id ? 'active' : ''}`;
            div.innerHTML = `<i class="fa-solid ${icon}" style="color: ${colorStyle}; width: 20px; text-align: center; flex-shrink: 0;"></i> <span style="line-height: 1.4; word-break: break-all;">${title}</span>`;
            div.onclick = () => {
                selectedDestId = id;
                document.querySelectorAll('.fm-dest-item').forEach(el => el.classList.remove('active'));
                div.classList.add('active');
            };
            return div;
        }

        // 🎯 [교정] 이동 최종 승인 (동일 위치 검사 및 0개 이동 방지)
        document.getElementById('fm-move-confirm-btn').onclick = () => {
            if (selectedDestId === undefined) { alert("이동할 위치를 선택해주세요."); return; }
            
            let actualMoveCount = 0;
            const tx = db.transaction(['memos'], 'readwrite');
            const store = tx.objectStore('memos');
            
            movingItemIds.forEach(id => {
                store.get(id).onsuccess = e => {
                    const m = e.target.result;
                    // 4대장 시스템 폴더 자체가 이동되는 것 방지
                    if (m && m.isSystem !== 'desktop' && m.isSystem !== 'security' && m.isSystem !== 'trash' && m.isSystem !== 'backup') {
                        // 🎯 현재 위치와 다를 때만 실제로 이동 처리!
                        if (m.parentId !== selectedDestId) { 
                            m.parentId = selectedDestId;
                            m.updatedAt = Date.now();
                            store.put(m);
                            actualMoveCount++;
                        }
                    }
                };
            });

            tx.oncomplete = () => {
                closeMoveModal();
                if (actualMoveCount === 0) {
                    // 모두 이미 같은 자리에 있을 경우
                    showToast("선택한 항목이 이미 해당 위치에 있습니다.");
                } else {
                    showToast(`${actualMoveCount}개 항목이 이동되었습니다.`);
                    cancelFmMultiSelect(); 
                    loadMemoList(true);
                }
                loadFileManager(currentFmFolderId);
            };
        };

	// 🎯 [수정] 파일 관리창 열기/닫기 (에디터 강제 초기화 및 완벽 잠금)
        function openFileManager() {
            if (document.activeElement) document.activeElement.blur(); 
            closeAllMemoMenus(); 
            forceSaveImmediate(); 

            // 🎯 진입 시 에디터를 '새 노트'로 강제 초기화 (기존 빈 노트 폭파 로직 자동 탑재됨)
            createNewMemo();

            closeAllPanelsMobile(); 

            isMultiSelectMode = false;
            selectedMemos.clear();
            isTrashMultiSelectMode = false;
            selectedTrashMemos.clear();
            loadMemoList(false); 

            document.getElementById('col-left').style.display = 'none';
            document.getElementById('col-right').style.display = 'none';
            document.getElementById('mobile-left-menu-btn').style.display = 'none';
            document.getElementById('global-menu-btn').style.display = 'none';

            document.getElementById('file-manager-pane').style.display = 'flex';

	    document.getElementById('fm-search-input').value = ''; // 🎯 진입 시 검색창 초기화
            fmPath = [{ id: null, title: 'Home' }];

            loadFileManager(null);

            // 🎯 에디터 완벽 비활성화 (검색창 타이핑 시 글자 새는 현상 2차 원천 차단)

        function closeFileManager() {
            document.getElementById('file-manager-pane').style.display = 'none';
            
            document.getElementById('col-left').style.display = '';
            document.getElementById('col-right').style.display = '';
            document.getElementById('mobile-left-menu-btn').style.display = '';
	    // 왼쪽 창 자동 열기 로직 삭제 및 우측 메뉴 버튼 복구

	// 🎯 [추가] 파일 관리창을 깨끗한 'Home' 상태로 되돌리는 함수
        function resetFmToHome() {

            if (searchInput) searchInput.value = ''; // 검색어 삭제
            fmPath = [{ id: null, title: 'Home' }]; // 경로 초기화

	// 🎯 [추가] 파일 관리창 삼선 버튼 스마트 네비게이션 (폴더 안->홈->닫기)
        function handleFmHamburger() {
            const searchInput = document.getElementById('fm-search-input');
            const isSearching = searchInput && searchInput.value !== '';
            
            // 🎯 검색 중이거나, 폴더 안쪽이라면 -> 즉시 깨끗한 홈으로 이동
            if (isSearching || currentFmFolderId !== null) {
                resetFmToHome();
